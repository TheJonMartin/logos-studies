      {type:"p",html:'<strong>The exchange is already done — not a performance to keep proving.</strong> Verses 9–10 don’t say “keep proving you’ve changed”; they say you already laid aside the old self and put on the new. A hard day doesn’t undo a completed fact.'},
      {type:"p",html:'<strong>Renewal is something being done to you, not a willpower project.</strong> “Being renewed” is passive — relief for a mind that has run out of willpower for one more self-improvement effort. This is the Spirit’s ongoing work, not a task graded solely on your consistency.'},
      {type:"p",html:'<strong>Concrete images, not vague virtue.</strong> “Put to death,” “put away,” “strip off,” “put on” are all bodily, clothing-based pictures — easier for concrete-oriented thinking to hold onto than an abstract call to “be more spiritual.”'},
      {type:"p",html:'<strong>Every human ranking system dissolves (v.11).</strong> Greek/Jew, circumcised/uncircumcised, barbarian/Scythian, slave/free — every category people use to sort and rank each other gives way in Christ. For a mind that has often felt sorted into “other” by neurotype or temperament, this is a genuine, textual promise: those categories do not hold the final word.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name one thing to “take off” today.</strong> Anger, malice, slander, or another item from the list — say it out loud, like naming a piece of clothing you’re removing.",
        "<strong>Say the settled fact plainly.</strong> “I have already put off the old self and put on the new” — stated as fact, not as a goal you’re still working toward.",
        "<strong>Notice one ranking today, and remember v.11.</strong> Catch yourself sorting yourself or someone else into a human category, and recall: Christ is all, and in all."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, You have already stripped off my old self and clothed me with the new — help me live today from that finished reality, putting to death what still clings from the old way, and letting Your Spirit keep renewing me in the image of Christ. When I am tempted to sort people — including myself — by the categories the world uses, remind me that You erased those lines: Christ is all, and in all. Amen.'}
    ]}
  ],
  oneThing:"You have already put off the old self and put on the new — so put to death what belongs to your old life, and let the Spirit renew you in the image of the One who made you.",
  sources:"Translations: NASB 1995, ESV. Greek text: Colossians 3:5–11 (NA/UBS). Key words: nekrōsate (aorist imperative active of nekroō, v.5), apotithēmi/apothesthe (aorist middle imperative, v.8), apekdysamenoi (aorist middle participle of apekdyomai, v.9), endysamenoi (aorist middle participle of enduō, v.10), anakainoumenon (present passive participle of anakainoō, v.10), epignōsis (v.10), eikōn / ktisantos (aorist active participle of ktizō, v.10). Cross-references: Colossians 2:15; 2:20; 3:1–4; Ephesians 4:22–24; Romans 12:2; Romans 6:6; Genesis 1:26–27; Romans 8:29; 2 Corinthians 4:16; Galatians 3:28. Honest note flagged, not resolved as a translation dispute: Colossians 3:10 uses neos (“new” in time) for “the new self,” where the parallel Ephesians 4:24 uses kainos (“new” in kind) — same theological point, different Greek word, noted rather than treated as identical wording. Honest note on epignōsis (v.10): older grammars read the epi- prefix as intensifying (“full knowledge”); more recent lexical work is cautious about that claim, so “knowledge” is the safer gloss."
},
{
  id:"1pet2-4-10",
  reference:"1 Peter 2:4–10",
  title:"1 Peter 2:4–10",
  subtitle:"Coming to the living Stone, you are being built into a holy priesthood — chosen, royal, holy, and now truly God’s own.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Identity in Christ","Worship & Consecration","Purpose & Mission","Assurance & Security"],
  anchor:"Because you have come to Christ, the living Stone once rejected by men but chosen by God, you are being built into a holy priesthood — no longer an outsider, but a people truly God’s own, called out of darkness into His marvelous light.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">4</sup>And coming to Him as to a living stone which has been rejected by men, but is choice and precious in the sight of God, <sup class="vn">5</sup>you also, as living stones, are being built up as a spiritual house for a holy priesthood, to offer up spiritual sacrifices acceptable to God through Jesus Christ. <sup class="vn">6</sup>For this is contained in Scripture: “Behold, I lay in Zion a choice stone, a precious corner stone, and he who believes in Him will not be disappointed.” <sup class="vn">7</sup>This precious value, then, is for you who believe; but for those who disbelieve, “The stone which the builders rejected, this became the very corner stone,” <sup class="vn">8</sup>and, “A stone of stumbling and a rock of offense”; for they stumble because they are disobedient to the word, and to this doom they were also appointed. <sup class="vn">9</sup>But you are a chosen race, a royal priesthood, a holy nation, a people for God’s own possession, so that you may proclaim the excellencies of Him who has called you out of darkness into His marvelous light; <sup class="vn">10</sup>for you once were not a people, but now you are the people of God; you had not received mercy, but now you have received mercy.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">4</sup>As you come to him, a living stone rejected by men but in the sight of God chosen and precious, <sup class="vn">5</sup>you yourselves like living stones are being built up as a spiritual house, to be a holy priesthood, to offer spiritual sacrifices acceptable to God through Jesus Christ. <sup class="vn">6</sup>For it stands in Scripture: “Behold, I am laying in Zion a stone, a cornerstone chosen and precious, and whoever believes in him will not be put to shame.” <sup class="vn">7</sup>So the honor is for you who believe, but for those who do not believe, “The stone that the builders rejected has become the cornerstone,” <sup class="vn">8</sup>and “A stone of stumbling, and a rock of offense.” They stumble because they disobey the word, as they were destined to do. <sup class="vn">9</sup>But you are a chosen race, a royal priesthood, a holy nation, a people for his own possession, that you may proclaim the excellencies of him who called you out of darkness into his marvelous light. <sup class="vn">10</sup>Once you were not a people, but now you are God’s people; once you had not received mercy, but now you have received mercy.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"from newborns craving milk (2:1–3) to a people with a new name (2:9–10)",blocks:[
      {type:"p",html:'Peter has just urged his readers, like newborn infants, to long for the pure milk of the word (2:1–3). Here he widens the lens from individual growth to corporate identity: coming to Christ, the living Stone, believers themselves become living stones, built into a spiritual house and a holy priesthood.'},
      {type:"p",html:'The passage sits at the heart of Peter’s argument for a scattered, marginalized church (see 1:1, “those who reside as aliens”; 2:11, “sojourners and exiles”): it answers the question of who these suffering believers really are by stitching together a chain of Old Testament “stone” texts (Isaiah 28:16; Psalm 118:22; Isaiah 8:14) and then applying Israel’s own covenant titles from Exodus 19:5–6 directly to the church.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Before Peter tells this scattered, suffering church how to live among outsiders (2:11f), he first tells them plainly who they now are."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"four beats: coming to the Stone, the Stone quoted three ways, the fourfold name, once/now",blocks:[
      {type:"p",html:'<strong>Beat 1 — coming to the living Stone (vv.4–5).</strong> Christ is the living Stone, rejected by men but chosen and precious to God; believers, coming to Him, become living stones themselves — built into a spiritual house, a holy priesthood offering spiritual sacrifices through Him.'},
      {type:"p",html:'<strong>Beat 2 — the same Stone, three Scriptures (vv.6–8).</strong> Isaiah 28:16 (a precious cornerstone; whoever believes will not be put to shame), Psalm 118:22 (the stone the builders rejected becomes the cornerstone), and Isaiah 8:14 (a stone of stumbling) — one Stone, experienced entirely differently depending on belief or unbelief.'},
      {type:"p",html:'<strong>Beat 3 — the fourfold name (v.9).</strong> Drawing directly on Exodus 19:5–6 and Isaiah 43:20–21, Peter gives the church Israel’s own covenant titles: a chosen race, a royal priesthood, a holy nation, a people for God’s own possession — with a stated purpose: to proclaim the excellencies of the One who called them out of darkness into His marvelous light.'},
      {type:"p",html:'<strong>Beat 4 — once, now (v.10).</strong> Echoing Hosea 1:10 and 2:23: once not a people, now the people of God; once without mercy, now shown mercy.'},
      {type:"callout",style:"oneline",label:"In one line",html:"come to the living Stone, rejected by men but chosen by God → become living stones yourselves, a holy priesthood → the same Stone divides belief from unbelief → you now carry Israel’s own covenant names → because mercy you didn’t have, you now have."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"a living stone — lithon zōnta",parse:"accusative singular; zōnta, present active participle of zaō, “to live” (v.4)",html:'A deliberate paradox — a stone that is alive. Christ is first called this (v.4), then believers themselves become “living stones” (v.5), built into something larger than any one of them.'},
      {type:"word",term:"are being built up — oikodomeisthe",parse:"present, 2nd plural, of oikodomeō — most naturally indicative (“you are being built up”), though the form is grammatically capable of being read as an imperative (“be built up”) (v.5)",html:'Both NASB1995 and ESV read this as a statement of fact — an ongoing, Spirit-driven construction project already underway. Some commentators have noted the identical present-tense form could, in principle, carry an imperative sense (“let yourselves be built up”); the difference affects tone more than substance, since either way the building is God’s ongoing work in a people, not a single finished act.'},
      {type:"word",term:"a chosen race — genos eklekton",parse:"nominative singular; genos, “race, family, kind”; eklekton, adjective, “chosen, elect” (v.9)",html:'The same root, <em>eklektos</em>, describes Christ Himself as “choice” in v.4 and 6, and believers already in 1:1 (“those…who are elect”). Echoes Isaiah 43:20 LXX and Deuteronomy 7:6 — language of Israel’s own election, now given to the church.'},
      {type:"word",term:"a royal priesthood — basileion hierateuma",parse:"nominative singular phrase (v.9; anticipated by hierateuma hagion, “holy priesthood,” in v.5)",html:'Quotes Exodus 19:6 LXX almost word for word. Commentators have long discussed whether <em>basileion</em> functions as an adjective (“royal priesthood”) or as a noun in apposition (“a kingdom, a priesthood”) in the underlying Exodus text — the sense is close either way: a priesthood that belongs to, or constitutes, God’s own kingdom.'},
      {type:"word",term:"a people for His own possession — laos eis peripoiēsin",parse:"accusative phrase; peripoiēsis, “possession, acquiring, obtaining” (v.9)",html:'Echoes Exodus 19:5, Isaiah 43:21, and Malachi 3:17 — a people specifically acquired and owned by God for Himself, not gathered incidentally.'},
      {type:"callout",style:"oneline",label:"In one line",html:"a living Stone (Christ) → living stones being built up (an ongoing, corporate work) → a chosen race, royal priesthood, holy nation, a people for His own possession — Israel’s own covenant names, now given to you."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Peter did not know modern neuroscience, and this study claims no such thing. But notice how identity is formed here: named concretely, repeatedly, and corporately, and built incrementally rather than completed all at once.'},
      {type:"list",style:"plain",items:[
        "<strong>Identity is named in concrete categories, not vague feeling.</strong> “Race,” “priesthood,” “nation,” “people” — four specific, nameable titles (v.9) are easier for a mind to hold onto and return to than an abstract sense of “being spiritual.”",
        "<strong>The building is ongoing and shared, not a solo, one-time achievement.</strong> “Are being built up” describes a continuing, corporate process — one stone among many, not a single structure you must complete alone.",
        "<strong>A remembered, concrete before/after consolidates the change.</strong> Verse 10’s repeated once/now pattern — not a people, now God’s people; no mercy, now mercy — is a simple, repeatable contrast that helps a settled identity take hold."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Ephesians 2:20–22 — “built on the foundation of the apostles and prophets… a dwelling place for God” — the same pattern: many stones, one building, still under construction."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>You are named in concrete terms, not left with a vague label.</strong> Four specific titles in v.9 — chosen, royal, holy, His own — give a concrete-oriented mind something to hold onto, rather than an abstract feeling to chase.'},
      {type:"p",html:'<strong>You belong to something you’re not building alone.</strong> “Living stones” (plural) “are being built up” together — you are one part of a larger, ongoing structure, not a solo project you must finish or hold up by yourself.'},
      {type:"p",html:'<strong>Once an outsider, truly inside now (v.10) — because of mercy, not performance.</strong> If you have often felt like the one who doesn’t quite fit, this passage insists the move from “not a people” to “God’s people” rested on mercy shown to you, not on social performance you managed to pull off.'},
      {type:"p",html:'<strong>The Stone Himself was rejected by men before being proven precious by God (vv.4, 7).</strong> Being misjudged by human evaluation while still being precious to God is not a contradiction this text is uneasy with — it is the pattern the whole paragraph is built on.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Say the four names of v.9 slowly over yourself today.</strong> Chosen, royal, holy, His own — as fact, not as performance still to be earned.",
        "<strong>When you feel like an outsider today, recall v.10.</strong> Once not a people, now God’s people — not because anything changed about your performance, but because of mercy shown.",
        "<strong>Picture one living stone being set into a larger house.</strong> You don’t have to hold up the whole structure alone — you are one stone, being placed."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, thank You for calling me out of darkness into Your marvelous light, and for building even me — a living stone that often feels the wrong shape — into Your spiritual house. When I feel like an outsider, remind me: I was once not a people, but now I am Yours, not because I earned a place but because You showed me mercy I did not have before. Let me proclaim Your excellencies, not my own performance. Amen.'}
    ]}
  ],
  oneThing:"You are not an outsider — once not a people, now truly God’s own; a living stone, being built into a holy priesthood to declare the excellencies of the One who called you out of darkness.",
  sources:"Translations: NASB 1995, ESV. Greek text: 1 Peter 2:4–10 (NA/UBS). Key words: lithon zōnta (v.4), oikodomeisthe (present, v.5), genos eklekton (v.9), basileion hierateuma (v.9, cf. hierateuma hagion v.5), laos eis peripoiēsin (v.9). Cross-references: Isaiah 28:16; Psalm 118:22; Isaiah 8:14; Exodus 19:5–6; Isaiah 43:20–21; Deuteronomy 7:6; Hosea 1:10; 2:23 (also quoted Romans 9:25–26); Ephesians 2:20–22; Romans 12:1; Titus 2:14. Contested point flagged, not resolved: oikodomeisthe (v.5) is read as indicative by both NASB1995 and ESV (“are being built up”), though some commentators note the form could grammatically carry an imperative sense; and basileion in basileion hierateuma (v.9, quoting Exodus 19:6 LXX) has long been discussed as adjective (“royal”) versus noun in apposition (“a kingdom”) — sense is close either way."
},
{
  id:"1pet1-17-21",
  reference:"1 Peter 1:17–21",
  title:"1 Peter 1:17–21",
  subtitle:"Not redeemed with silver or gold, but with the precious, spotless blood of Christ, planned before the world began.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Freedom from Sin","Assurance & Security","Sanctification & Holiness"],
  anchor:"Live in reverent awe, not because you're unsure of your standing, but because you know exactly what it cost — not silver or gold, but the precious, spotless blood of Christ, planned before the world began and revealed for you.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">17</sup>If you address as Father the One who impartially judges according to each one’s work, conduct yourselves in fear during the time of your stay on earth; <sup class="vn">18</sup>knowing that you were not redeemed with perishable things like silver or gold from your futile way of life inherited from your forefathers, <sup class="vn">19</sup>but with precious blood, as of a lamb unblemished and spotless, the blood of Christ. <sup class="vn">20</sup>For He was foreknown before the foundation of the world, but has appeared in these last times for the sake of you <sup class="vn">21</sup>who through Him are believers in God, who raised Him from the dead and gave Him glory, so that your faith and hope are in God.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">17</sup>And if you call on him as Father who judges impartially according to each one’s deeds, conduct yourselves with fear throughout the time of your exile, <sup class="vn">18</sup>knowing that you were ransomed from the futile ways inherited from your forefathers, not with perishable things such as silver or gold, <sup class="vn">19</sup>but with the precious blood of Christ, like that of a lamb without blemish or spot. <sup class="vn">20</sup>He was foreknown before the foundation of the world but was made manifest in the last times for the sake of you <sup class="vn">21</sup>who through him are believers in God, who raised him from the dead and gave him glory, so that your faith and hope are in God.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the ground beneath the call to “be holy” (1:13–16)",blocks:[
      {type:"p",html:'Peter has just celebrated the believers’ “living hope” through Christ’s resurrection (1:3), an imperishable inheritance kept in heaven for them (1:4), and a tested faith more precious than gold (1:7). At 1:13 he turns to exhortation — prepare your minds, be holy as God is holy, quoting Leviticus (1:13–16).'},
      {type:"p",html:'Verse 17 opens a new paragraph that grounds that call to holy, reverent living in a specific fact: the price of their redemption. The logic is not “be holy so that you’ll be redeemed,” but the reverse — because you were redeemed at such a cost, conduct yourselves in reverent fear during your time as “exiles” in this world.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Before Peter says anything else about how to live, he grounds reverent living in exactly what it cost God to make them His."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"five beats: the ground for reverence, not this way, but this way, the eternal scope, the result",blocks:[
      {type:"p",html:'<strong>Beat 1 — the ground for reverent living (v.17).</strong> You call on a Father who judges impartially by each one’s deeds; therefore, conduct yourselves in reverent fear throughout your time as “exiles” — sojourners passing through, not permanently settled.'},
      {type:"p",html:'<strong>Beat 2 — not with this (v.18).</strong> Negatively stated first: you were not redeemed with perishable things like silver or gold, from a futile way of life inherited from your ancestors.'},
      {type:"p",html:'<strong>Beat 3 — but with this (v.19).</strong> The positive, climactic statement of the price: the precious blood of Christ, described in sacrificial terms — a lamb without blemish or spot.'},
      {type:"p",html:'<strong>Beat 4 — the eternal scope (v.20).</strong> Christ was foreknown before the world’s foundation, yet has been revealed now, in these last times, specifically for the readers’ sake.'},
      {type:"p",html:'<strong>Beat 5 — the result (v.21).</strong> Through Christ, believers now trust in God, who raised Him and gave Him glory — so that faith and hope rest in God, not in anything perishable.'},
      {type:"callout",style:"oneline",label:"In one line",html:"reverent fear is grounded in cost, not uncertainty → not redeemed by perishable currency, from an empty inherited way of life → but by the precious, spotless blood of Christ → planned before creation, revealed now for you → so that your faith and hope rest in God."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"you were redeemed — elytrōthēte",parse:"aorist passive indicative, 2nd plural, of lytroō, “to ransom, redeem” (v.18)",html:'Commercial, manumission language — paying a price to free a captive or slave (compare <em>lytron</em>, “ransom,” in Mark 10:45). Passive voice: something done to you, not achieved by you. Compare 1 Corinthians 6:20 (“you were bought with a price”) and Titus 2:14 (“gave Himself for us to redeem us”).'},
      {type:"word",term:"futile way of life inherited from the fathers — mataias anastrophēs patroparadotou",parse:"genitive singular phrase (v.18): mataios, “empty, futile”; anastrophē, “conduct, way of life”; patroparadotos, “handed down from the fathers” (a rare compound, only here in the New Testament)",html:'Names an entire inherited cultural and religious way of life as ultimately empty — <em>mataios</em> is used elsewhere of idols and idolatry (e.g. Jeremiah 2:5 LXX). The compound <em>patroparadotos</em> stresses that this was received, not individually invented.'},
      {type:"word",term:"precious blood — timiō haimati",parse:"dative singular; timios, “of great worth, precious” (v.19)",html:'Deliberately set against the “perishable” silver and gold of v.18 — an imperishable, priceless payment rather than a depreciating currency.'},
      {type:"word",term:"a lamb without blemish or spot — amnou amōmou kai aspilou",parse:"genitive singular; amnos, “lamb”; amōmos and aspilos, both “unblemished, without defect” (v.19)",html:'Sacrificial and Passover language, echoing the unblemished lamb of Exodus 12:5 and the suffering servant of Isaiah 53:7; the same word <em>amnos</em> is used of Jesus at John 1:29, 36 (“the Lamb of God”).'},
      {type:"word",term:"foreknown / made manifest — proegnōsmenou / phanerōthentos",parse:"perfect passive participle of proginōskō, “to know beforehand” (v.20); aorist passive participle of phaneroō, “to make visible, manifest” (v.20)",html:'A settled fact reaching back before creation (perfect tense: foreknown, and remaining so), contrasted with a datable event in history (aorist: was made manifest). <em>Phaneroō</em> is the same verb used of believers’ future appearing with Christ in Colossians 3:4 — there a future hope, here a past-and-present fact about Christ Himself.'},
      {type:"callout",style:"oneline",label:"In one line",html:"you were ransomed (elytrōthēte, a settled fact) → not with perishable currency, from an inherited, empty way of life → but with precious, spotless blood → planned before the world began (proegnōsmenou), revealed now (phanerōthentos) — for your sake."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Peter did not know modern neuroscience, and this study claims no such thing. But notice where reverent conduct is grounded: not in anxious uncertainty about the future, but in a settled, finished fact about the past.'},
      {type:"list",style:"plain",items:[
        "<strong>Reverent conduct is grounded backward, in a completed fact, not forward, in uncertainty.</strong> “You were redeemed” (aorist) and “foreknown” (perfect) both describe something already settled — a stable foundation to stand on, rather than an outcome still being negotiated.",
        "<strong>Perishable vs. imperishable reframes what counts as a stable measure of worth.</strong> Silver and gold corrode and lose value; the price actually paid does not — a fixed point rather than a fluctuating one.",
        "<strong>The plan predates your entire personal history.</strong> “Before the foundation of the world” means your place in it was never contingent on your own performance record up to this point."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 12:1 — reverent, whole-life devotion grounded “by the mercies of God” already shown, not offered in exchange for mercy still uncertain."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>You were bought at an actual, named price — not judged not worth the trouble.</strong> The contrast of perishable currency versus precious blood states your worth in concrete terms, a correction for a mind prone to reading itself as “too much” or a burden.'},
      {type:"p",html:'<strong>The old way of life is called inherited, not solely your own failure.</strong> “Patroparadotou” — handed down from the fathers — names something received, not individually invented; relief from carrying inherited patterns as if they were entirely your own fault.'},
      {type:"p",html:'<strong>The plan is older than your history.</strong> “Foreknown before the foundation of the world” means your place in it never depended on anything you managed or failed to manage in your own timeline.'},
      {type:"p",html:'<strong>“Fear” here means reverent seriousness, not anxious terror.</strong> It sits directly beside calling God “Father” (v.17) — a corrective for a mind prone to reading any call to seriousness as catastrophic threat.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name one “perishable” measure of your worth.</strong> Set it, just for a moment, next to the precious blood of v.19.",
        "<strong>Say quietly: “I was ransomed, not shamed, out of a way of life that was inherited, not fully my own choosing.”</strong>",
        "<strong>Rest in v.20’s timeline.</strong> The plan for you existed before the world did — today’s mistakes don’t move that starting point."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Father, You judge justly, and still You call me Yours — help me hold both truths together without collapsing into carelessness or anxious fear. Thank You that I was not bought with anything that perishes, but with the precious, spotless blood of Christ, planned before the world began and revealed for my sake. When old, inherited patterns pull at me, remind me they were never my only inheritance — my faith and hope are in You. Amen.'}
    ]}
  ],
  oneThing:"You were not redeemed with silver or gold, but with the precious, spotless blood of Christ, planned before the world began — so let reverent gratitude, not fear, shape how you live.",
  sources:"Translations: NASB 1995, ESV. Greek text: 1 Peter 1:17–21 (NA/UBS). Key words: elytrōthēte (aorist passive of lytroō, v.18), mataias anastrophēs patroparadotou (v.18), timiō haimati (v.19), amnou amōmou kai aspilou (v.19), proegnōsmenou (perfect passive participle of proginōskō, v.20), phanerōthentos (aorist passive participle of phaneroō, v.20). Cross-references: Mark 10:45; 1 Corinthians 6:20; Titus 2:14; Exodus 12:5; Isaiah 53:7; John 1:29, 36; Ephesians 1:4; Revelation 13:8; Colossians 3:4 (phaneroō); Romans 12:1; 1 Peter 1:3–4, 7, 13–16."
},
{
  id:"john15-1-11",
  reference:"John 15:1–11",
  title:"John 15:1–11",
  subtitle:"I am the vine, you are the branches — abide in Me, and My words in you, and you will bear much fruit and find your joy made full.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Union with Christ","Discipleship & Following Jesus","Purpose & Mission","Assurance & Security"],
  anchor:"Because Jesus is the true vine and you are already clean through His word, stay attached to Him — apart from Him you can do nothing, but abiding in Him, with His words abiding in you, bears much fruit and brings your joy to the full.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">1</sup>“I am the true vine, and My Father is the vinedresser. <sup class="vn">2</sup>Every branch in Me that does not bear fruit, He takes away; and every branch that bears fruit, He prunes it so that it may bear more fruit. <sup class="vn">3</sup>You are already clean because of the word which I have spoken to you. <sup class="vn">4</sup>Abide in Me, and I in you. As the branch cannot bear fruit of itself unless it abides in the vine, so neither can you unless you abide in Me. <sup class="vn">5</sup>I am the vine, you are the branches; he who abides in Me and I in him, he bears much fruit, for apart from Me you can do nothing. <sup class="vn">6</sup>If anyone does not abide in Me, he is thrown away as a branch and dries up; and they gather them, and cast them into the fire and they are burned. <sup class="vn">7</sup>If you abide in Me, and My words abide in you, ask whatever you wish, and it will be done for you. <sup class="vn">8</sup>My Father is glorified by this, that you bear much fruit, and so prove to be My disciples. <sup class="vn">9</sup>Just as the Father has loved Me, I have also loved you; abide in My love. <sup class="vn">10</sup>If you keep My commandments, you will abide in My love; just as I have kept My Father’s commandments and abide in His love. <sup class="vn">11</sup>These things I have spoken to you so that My joy may be in you, and that your joy may be made full.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">1</sup>“I am the true vine, and my Father is the vinedresser. <sup class="vn">2</sup>Every branch in me that does not bear fruit he takes away, and every branch that does bear fruit he prunes, that it may bear more fruit. <sup class="vn">3</sup>Already you are clean because of the word that I have spoken to you. <sup class="vn">4</sup>Abide in me, and I in you. As the branch cannot bear fruit by itself, unless it abides in the vine, neither can you, unless you abide in me. <sup class="vn">5</sup>I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing. <sup class="vn">6</sup>If anyone does not abide in me, he is thrown away like a branch and withers; and the branches are gathered, thrown into the fire, and burned. <sup class="vn">7</sup>If you abide in me, and my words abide in you, ask whatever you wish, and it will be done for you. <sup class="vn">8</sup>By this my Father is glorified, that you bear much fruit and so prove to be my disciples. <sup class="vn">9</sup>As the Father has loved me, so have I loved you. Abide in my love. <sup class="vn">10</sup>If you keep my commandments, you will abide in my love, just as I have kept my Father’s commandments and abide in his love. <sup class="vn">11</sup>These things I have spoken to you, that my joy may be in you, and that your joy may be full.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the night before the cross, in Jesus’ farewell to His disciples",blocks:[
      {type:"p",html:'This is part of the Upper Room discourse (John 13–17), spoken the night before the crucifixion — after Judas has left (13:30), after Jesus has promised the Holy Spirit and His own peace (14:16–17, 26–27). The vine picture draws on a well-worn Old Testament image: Israel as God’s vine, repeatedly failing to bear fruit (Psalm 80:8ff; Isaiah 5:1ff; Jeremiah 2:21; Ezekiel 15; 19). Jesus claims to be the <em>true</em> vine — succeeding where the old vine failed.'},
      {type:"p",html:'The passage runs as one continuous unit under this image before the discourse shifts, at 15:12, to “love one another” and then to the world’s hatred of the disciples (15:18ff). Everything here — pruning, abiding, asking, bearing fruit, joy — happens inside this one image of vine and branches.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Before Jesus tells His disciples to love one another and warns them of the world’s hatred, He first roots them — literally, by the image — in unbroken attachment to Himself."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"seven beats: identity, cleanness, abide, warning, promise, purpose, joy",blocks:[
      {type:"p",html:'<strong>Beat 1 — the claim and the pruning (vv.1–2).</strong> Jesus is the true vine, the Father the vinedresser; every fruitless branch is removed, every fruitful branch is pruned for more fruit.'},
      {type:"p",html:'<strong>Beat 2 — already clean (v.3).</strong> An aside, connected by a wordplay in the Greek (see §4) to the pruning just mentioned: the disciples are already clean because of Jesus’ word already spoken to them.'},
      {type:"p",html:'<strong>Beat 3 — the command and the total dependence (vv.4–5).</strong> “Abide in Me, and I in you,” repeated with the branch analogy, and climaxing in the flattest possible statement: “apart from Me you can do nothing.”'},
      {type:"p",html:'<strong>Beat 4 — the warning (v.6).</strong> The branch that does not abide is thrown away, withers, is gathered, and burned.'},
      {type:"p",html:'<strong>Beat 5 — the promise tied to abiding (v.7).</strong> If Jesus’ words abide in the disciple as much as the disciple abides in Him, ask whatever you wish — it will be done.'},
      {type:"p",html:'<strong>Beat 6 — the purpose (v.8).</strong> Much fruit glorifies the Father and proves discipleship — the two are the same event seen from two sides.'},
      {type:"p",html:'<strong>Beat 7 — abiding reframed as abiding in love, ending in joy (vv.9–11).</strong> As the Father loved Jesus, Jesus loved the disciples — abide in that love by keeping His commandments, just as He kept the Father’s and abides in His love — so that Jesus’ own joy would be in them, and their joy made full.'},
      {type:"callout",style:"oneline",label:"In one line",html:"the true vine and its keeper → already clean by His word → abide, because apart from Him nothing → the alternative is being cut off → abiding brings answered prayer and much fruit → which proves discipleship and glorifies the Father → and fills the disciple’s joy."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"the true vine — hē ampelos hē alēthinē",parse:"nominative singular; alēthinos, “true, real, genuine” as opposed to a counterfeit or a type not yet fulfilled (v.1)",html:'Sets up a deliberate contrast with the Old Testament vine, Israel, which repeatedly failed to bear fruit (Psalm 80; Isaiah 5; Jeremiah 2:21; Ezekiel 15; 19). Jesus is not a new vine alongside the old one, but the genuine reality the old image always pointed toward.'},
      {type:"word",term:"abide — menō (menete / meinate)",parse:"present active, occurring roughly ten times across vv.4–10 in various forms — imperative and indicative",html:'The passage’s central, hammered-home verb: to remain, stay, continue dwelling. Not a single decisive act but a continuous, returned-to state — the sheer repetition of the word in the Greek is itself part of the point.'},
      {type:"word",term:"prunes / clean — kathairei / katharoi",parse:"kathairei, present active indicative of kathairō, “to cleanse, prune” (v.2); katharoi, adjective “clean” (v.3), same root",html:'A wordplay in the Greek that does not fully carry over into English: the vinedresser “prunes” (kathairei) fruitful branches, and the disciples are already “clean” (katharoi) — the same root idea (cleansing/pruning) applied first to the vine, then directly to the disciples themselves.'},
      {type:"word",term:"bear fruit — karpon pherō (pherē / pherōn)",parse:"present subjunctive / present participle of pherō, recurring in vv.2, 4, 5, 8",html:'The stated goal of the whole passage, but notably never commanded directly — the disciples are commanded to <em>abide</em> (v.4); fruit is what abiding produces, not a separate task to strive after on its own.'},
      {type:"word",term:"apart from Me you can do nothing — chōris emou ou dynasthe poiein ouden",parse:"dynasthe, present middle/passive indicative, 2nd plural, of dynamai, “to be able” (v.5)",html:'A flat, total statement with no qualification — not “you can do less” or “you’ll struggle more,” but <em>nothing</em>. Fruitfulness is entirely contingent on the connection described in vv.4–5, not partially self-generated and partially Christ-enabled.'},
      {type:"callout",style:"oneline",label:"In one line",html:"the true vine (alēthinē) → repeatedly commanded: abide (menō) → already clean by His word, with a wordplay linking pruning to cleanness → fruit (pherō) as the result of abiding, not a separate achievement → and utterly impossible apart from Him."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Jesus did not describe neuroscience, and this study claims no such thing. But notice the shape of what is repeated, and where fruitfulness is located.'},
      {type:"list",style:"plain",items:[
        "<strong>The repetition is the point, not incidental.</strong> “Abide” (menō) recurs roughly ten times across a few verses — not a single decisive command but a continuously returned-to state, mirrored in the sheer frequency of the word itself.",
        "<strong>Fruit is a byproduct of sustained connection, not a direct target.</strong> The command is to abide (v.4); fruit is what results (vv.4–5, 8). Trying to manufacture fruit directly, apart from staying attached, produces nothing — durable growth tends to follow from sustained conditions, not isolated bursts of forced effort.",
        "<strong>Specific, remembered content sustains the connection.</strong> “My words abide in you” (v.7) ties ongoing abiding to particular, rememberable content — not a vague feeling to chase, but something concrete to return to."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Colossians 3:16 — “let the word of Christ dwell in you richly” — the same pattern: sustained, repeated intake of specific content, not a single moment of inspiration."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>“Abide,” not “achieve.”</strong> The one command repeated here is to remain, stay attached, keep returning — not to produce fruit by sheer effort. Relief for a mind that equates worth with output.'},
      {type:"p",html:'<strong>“Apart from Me you can do nothing” removes the burden of self-sufficiency.</strong> You were never meant to generate fruit alone. The experience of “trying harder” not working is not a unique personal defect — it is built into how the whole image works.'},
      {type:"p",html:'<strong>Pruning is care, not punishment.</strong> A fruit-bearing branch is the one that gets cut into (v.2), not the one left alone. If life feels like it is being trimmed back right now, that can be a sign of belonging to the vine, not rejection from it.'},
      {type:"p",html:'<strong>A concrete image, not an abstract demand.</strong> Vine, branch, gardener, fruit — something to picture and return to, rather than an abstract call to “have more faith.”'},
      {type:"p",html:'<strong>“Already clean” (v.3) comes before any command to abide.</strong> Cleanness is stated as an already-accomplished fact, resting on Jesus’ word already spoken — not something still to be earned by successfully abiding.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Return to one specific word of Jesus today.</strong> Let it simply abide — sit with it — rather than immediately trying to produce an outcome from it.",
        "<strong>Notice one place you’re straining to “bear fruit” by sheer effort today,</strong> and ask instead: am I staying attached?",
        "<strong>When you feel pruned or cut back today, remember v.2:</strong> pruning is for more fruit, not rejection."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord Jesus, You are the true vine, and I am nothing apart from You. Teach me to abide — not to strain for fruit on my own, but simply to stay attached to You and let Your words remain in me. When I feel cut back or reduced today, remind me that is a gardener’s care, not rejection. Let Your joy be in me, and let my joy be made full. Amen.'}
    ]}
  ],
  oneThing:"Apart from Christ you can do nothing — so abide in Him, let His words abide in you, and let Him produce the fruit.",
  sources:"Translations: NASB 1995, ESV. Greek text: John 15:1–11 (NA/UBS). Key words: alēthinē (v.1), menō (recurring, vv.4–10), kathairei / katharoi (wordplay, vv.2–3), karpon pherō (recurring), chōris emou ou dynasthe poiein ouden (v.5). Cross-references: Psalm 80:8ff; Isaiah 5:1ff; Jeremiah 2:21; Ezekiel 15; 19; John 6:56; 13:10; 17:17; 1 Corinthians 3:9; Romans 11:17; Colossians 3:16; 1 John 2:6. Honest note: the kathairei/katharoi wordplay (vv.2–3) is present in the Greek but does not carry over cleanly into English translation — worth noting rather than assuming the English alone conveys the connection."
},
{
  id:"col3-12-17",
  reference:"Colossians 3:12–17",
  title:"Colossians 3:12–17",
  subtitle:"Put on compassion, kindness, and love; let Christ’s peace be the umpire of your heart, and do everything in His name.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Sanctification & Holiness","Worship & Consecration","Discipleship & Following Jesus"],
  anchor:"As God’s chosen, holy, and beloved people, put on compassion, forgiveness, and love — let Christ’s peace be the umpire of your heart and His word dwell in you richly, so that everything you do, in word or deed, is done in His name with thanksgiving.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">12</sup>So, as those who have been chosen of God, holy and beloved, put on a heart of compassion, kindness, humility, gentleness and patience; <sup class="vn">13</sup>bearing with one another, and forgiving each other, whoever has a complaint against anyone; just as the Lord forgave you, so also should you. <sup class="vn">14</sup>Beyond all these things put on love, which is the perfect bond of unity. <sup class="vn">15</sup>Let the peace of Christ rule in your hearts, to which indeed you were called in one body; and be thankful. <sup class="vn">16</sup>Let the word of Christ richly dwell within you, with all wisdom teaching and admonishing one another with psalms and hymns and spiritual songs, singing with thankfulness in your hearts to God. <sup class="vn">17</sup>Whatever you do in word or deed, do all in the name of the Lord Jesus, giving thanks through Him to God the Father.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">12</sup>Put on then, as God’s chosen ones, holy and beloved, compassionate hearts, kindness, humility, meekness, and patience, <sup class="vn">13</sup>bearing with one another and, if one has a complaint against another, forgiving each other; as the Lord has forgiven you, so you also must forgive. <sup class="vn">14</sup>And above all these put on love, which binds everything together in perfect harmony. <sup class="vn">15</sup>And let the peace of Christ rule in your hearts, to which indeed you were called in one body. And be thankful. <sup class="vn">16</sup>Let the word of Christ dwell in you richly, teaching and admonishing one another in all wisdom, singing psalms and hymns and spiritual songs, with thankfulness in your hearts to God. <sup class="vn">17</sup>And whatever you do, in word or deed, do everything in the name of the Lord Jesus, giving thanks to God the Father through him.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the positive close of the “put off / put on” section (3:1–17)",blocks:[
      {type:"p",html:'Having stripped off vice (3:5–11) and declared every human distinction erased in Christ (3:11), Paul now describes what the “new self” looks like actually worn: a wardrobe of virtues, topped by love, governed by Christ’s peace, saturated by Christ’s word, and offered as thanksgiving.'},
      {type:"p",html:'This paragraph closes the whole “new self” unit that began at 3:1 (raised with Christ) before Paul turns, at 3:18, to specific household relationships. Verse 17 functions as a summary principle for everything said since 3:1 — whatever you do, all of it, done in the name of the Lord Jesus.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Having already put off the old self (3:5–11), here is what putting on the new one actually looks like worn: compassion, forgiveness, love, peace, the word of Christ, and thanksgiving — in everything."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"six beats: identity and virtues, forgiveness, love, peace as umpire, the word dwelling, the summary",blocks:[
      {type:"p",html:'<strong>Beat 1 — the identity basis and the first virtues (v.12).</strong> As God’s chosen, holy, and beloved people, put on compassion, kindness, humility, gentleness, and patience.'},
      {type:"p",html:'<strong>Beat 2 — bearing and forgiving, on a given pattern (v.13).</strong> Bear with one another, forgive one another — with the Lord’s own forgiveness stated as the standard and the reason.'},
      {type:"p",html:'<strong>Beat 3 — love, above all these (v.14).</strong> The binding, completing garment placed over everything else already put on.'},
      {type:"p",html:'<strong>Beat 4 — peace as umpire (v.15).</strong> Let the peace of Christ “rule” — a vivid arbitration image (see §4) — in your hearts, since you were called to it in one body; and be thankful.'},
      {type:"p",html:'<strong>Beat 5 — the word of Christ dwelling richly (v.16).</strong> Teaching, admonishing, and singing to one another, saturated with thankfulness.'},
      {type:"p",html:'<strong>Beat 6 — the summary principle (v.17).</strong> Whatever you do, in word or deed, all of it, in the name of the Lord Jesus, with thanks to God the Father through Him.'},
      {type:"callout",style:"oneline",label:"In one line",html:"put on compassion, kindness, humility, gentleness, patience → bear with and forgive, on the Lord’s own pattern → above all, love → let Christ’s peace umpire your heart → let His word dwell richly → and do all of it, whatever it is, in His name, with thanks."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"a heart of compassion — splanchna oiktirmou",parse:"accusative plural noun + genitive singular (v.12)",html:'<em>Splanchna</em> literally names the inward organs — in Hebraic thought, the seat of deep emotion (compare Philippians 1:8, “the affection of Christ Jesus”). <em>Oiktirmos</em> is compassion or mercy. Together: not a surface courtesy, but a gut-level, felt compassion put on deliberately.'},
      {type:"word",term:"forgiving — charizomenoi",parse:"present middle participle of charizomai (v.13)",html:'Shares its root with <em>charis</em>, “grace.” Forgiving one another is described with the same word-family as receiving grace — a grace-act modeled directly on “just as the Lord forgave you.”'},
      {type:"word",term:"the bond of perfection — ho syndesmos tēs teleiotētos",parse:"nominative phrase (v.14)",html:'<em>Syndesmos</em>, “that which binds together”; <em>teleiotēs</em>, “completeness, maturity.” Love is not one virtue in the list but the binding cord that holds the others together and brings them to completeness — NASB1995 “perfect bond of unity,” ESV “binds everything together in perfect harmony.”'},
      {type:"word",term:"let… rule — brabeuetō",parse:"present active imperative, 3rd singular, of brabeuō (v.15)",html:'An athletic/arbitration term — to act as umpire, arbiter, to award the prize or make the ruling call. Not merely “let peace be present,” but let Christ’s peace function as the decisive umpire in matters of the heart.'},
      {type:"word",term:"let… dwell — enoikeitō",parse:"present active imperative, 3rd singular, of enoikeō, “to dwell in, inhabit” (v.16)",html:'The same root used elsewhere of the Spirit indwelling believers (Romans 8:11). Paired here with “richly” (<em>plousiōs</em>) — not a passing visit but a rich, settled residence of Christ’s word within the community.'},
      {type:"callout",style:"oneline",label:"In one line",html:"a felt compassion, put on deliberately → forgiveness modeled on grace already received → love as the completing bond → Christ’s peace as the umpire of the heart → His word richly at home within you → all of it done in His name."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study makes no such claim. But notice how concretely the virtues are named, and how a decision-rule is supplied rather than a vague feeling.'},
      {type:"list",style:"plain",items:[
        "<strong>The virtues are named as something to “put on,” repeatedly, like clothing.</strong> A concrete, deliberate act returned to, not a feeling waited for before acting.",
        "<strong>Peace functioning as an “umpire” (brabeuetō) supplies an actual decision-rule.</strong> A specific test to apply in a moment of internal conflict — does this fit under that peace, or not — rather than only a mood to hope for.",
        "<strong>The word of Christ “dwelling richly” (v.16) points to a mechanism of saturation, not a single moment.</strong> Teaching, admonishing, and singing describe repeated intake over time, not one-time exposure."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 12:2 — “renewed… by the renewing of your mind” — the same pattern: concrete, repeated practice, not a single flash of insight."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Concrete virtues to “put on,” not vague character growth.</strong> A specific, nameable list — compassion, kindness, humility, gentleness, patience — is easier to reach for in the moment than an abstract “be a good person.”'},
      {type:"p",html:'<strong>Peace as a decision-rule, not a mood you must feel first.</strong> “Let the peace of Christ be the umpire” gives an actual test to apply — does this fit under that peace — rather than requiring you to feel calm before you can act rightly.'},
      {type:"p",html:'<strong>Forgiveness patterned on a model already given.</strong> “Just as the Lord forgave you” means you are not required to invent the standard yourself; it is supplied, and it is not your own performance that grounds it.'},
      {type:"p",html:'<strong>One blanket principle covers all of life (v.17).</strong> “Whatever you do, in word or deed” includes the ordinary and unglamorous, without needing a separate spiritual category for “important” actions versus everything else — relief from sorting your day into sacred and mundane bins.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Put on one virtue from v.12 today.</strong> Choose one — compassion, kindness, humility, gentleness, patience — and deliberately practice it in one specific interaction.",
        "<strong>Let peace be the umpire once today.</strong> When torn about a decision, ask: “does this fit under the peace of Christ, or against it?”",
        "<strong>Say v.17 over one ordinary task today.</strong> “I’m doing this in the name of the Lord Jesus” — even something small."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, thank You that You have already named what to put on — compassion, kindness, humility, gentleness, patience — and forgiven me first, so I have a pattern to follow rather than one to invent. Let Your peace be the umpire in my heart today, and Your word dwell richly in me. Whatever I do today, in word or deed, let it be done in Your name, with thanks to the Father through You. Amen.'}
    ]}
  ],
  oneThing:"Whatever you do, in word or deed, do everything in the name of the Lord Jesus, giving thanks to God the Father through Him.",
  sources:"Translations: NASB 1995, ESV. Greek text: Colossians 3:12–17 (NA/UBS). Key words: splanchna oiktirmou (v.12), charizomenoi (present middle participle of charizomai, v.13), syndesmos tēs teleiotētos (v.14), brabeuetō (present active imperative of brabeuō, v.15), enoikeitō (present active imperative of enoikeō, v.16). Cross-references: Colossians 3:1–11; Philippians 1:8; 2:1–2; Romans 8:11; 12:2; Ephesians 4:2–3, 32; 5:19–20; 1 Corinthians 10:31."
},
{
  id:"col1-24-29",
  reference:"Colossians 1:24–29",
  title:"Colossians 1:24–29",
  subtitle:"Paul suffers and labors to make the mystery known — Christ in you, the hope of glory — by a power not his own.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Purpose & Mission","Suffering & Endurance","Identity in Christ"],
  anchor:"Paul labors and suffers to make Christ known — Christ in you, the hope of glory — laboring not by his own strength but by Christ’s power working mightily within him.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">24</sup>Now I rejoice in my sufferings for your sake, and in my flesh I do my share on behalf of His body, which is the church, in filling up what is lacking in Christ’s afflictions. <sup class="vn">25</sup>Of this church I was made a minister according to the stewardship from God bestowed on me for your benefit, so that I might fully carry out the preaching of the word of God, <sup class="vn">26</sup>that is, the mystery which has been hidden from the past ages and generations, but has now been manifested to His saints, <sup class="vn">27</sup>to whom God willed to make known what is the riches of the glory of this mystery among the Gentiles, which is Christ in you, the hope of glory. <sup class="vn">28</sup>We proclaim Him, admonishing every man and teaching every man with all wisdom, so that we may present every man complete in Christ. <sup class="vn">29</sup>For this purpose also I labor, striving according to His power, which mightily works within me.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">24</sup>Now I rejoice in my sufferings for your sake, and in my flesh I am filling up what is lacking in Christ’s afflictions for the sake of his body, that is, the church, <sup class="vn">25</sup>of which I became a minister according to the stewardship from God that was given to me for you, to make the word of God fully known, <sup class="vn">26</sup>the mystery hidden for ages and generations but now revealed to his saints. <sup class="vn">27</sup>To them God chose to make known how great among the Gentiles are the riches of the glory of this mystery, which is Christ in you, the hope of glory. <sup class="vn">28</sup>Him we proclaim, warning everyone and teaching everyone with all wisdom, that we may present everyone mature in Christ. <sup class="vn">29</sup>For this I toil, struggling with all his energy that he powerfully works within me.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"Paul’s apostolic commentary flowing out of the Christ-hymn (1:15–23)",blocks:[
      {type:"p",html:'This paragraph follows directly on the great hymn of Christ’s supremacy (1:15–20) and the reconciliation it accomplishes (1:21–23), which ends: “...if indeed you continue in the faith... of which I, Paul, was made a minister” (1:23). Verse 25 picks up that exact thread — “of this church I was made a minister.”'},
      {type:"p",html:'If Christ is supreme over all things and reconciles all things (1:15–23), then Paul’s suffering ministry of proclaiming that Christ (1:24–29) is simply the outworking of it in his own life. This unit closes Paul’s personal introduction before he turns, at 2:1, to warn the Colossians directly against the false teaching threatening them.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Because Christ is supreme and reconciles all things, Paul suffers, labors, and proclaims Him — so that everyone may be presented complete in Christ."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"six beats: suffering for the body, the stewardship, the hidden mystery, its content, the aim, the means",blocks:[
      {type:"p",html:'<strong>Beat 1 — rejoicing in suffering, for the church’s sake (v.24).</strong> Paul rejoices in his sufferings and, in his flesh, “fills up” what is lacking in Christ’s afflictions, on behalf of the church.'},
      {type:"p",html:'<strong>Beat 2 — the stewardship given him (v.25).</strong> He became a minister of this church according to a stewardship from God, given for their benefit, so that he might fully make the word of God known.'},
      {type:"p",html:'<strong>Beat 3 — the mystery, hidden then revealed (v.26).</strong> That word centers on “the mystery” — hidden for ages and generations, now manifested to God’s saints.'},
      {type:"p",html:'<strong>Beat 4 — the content of the mystery (v.27).</strong> God willed to make known, among the Gentiles, the riches of this mystery’s glory: Christ in you, the hope of glory.'},
      {type:"p",html:'<strong>Beat 5 — the aim of the proclamation (v.28).</strong> Paul proclaims Christ, admonishing and teaching everyone with all wisdom, so as to present everyone complete (mature) in Him.'},
      {type:"p",html:'<strong>Beat 6 — the means (v.29).</strong> For this purpose Paul labors and strives, according to Christ’s power, which works mightily within him.'},
      {type:"callout",style:"oneline",label:"In one line",html:"suffering for the church’s sake → a stewardship to make the word fully known → the mystery once hidden, now revealed → Christ in you, the hope of glory → proclaimed so that everyone is presented complete in Him → all of it by a power not Paul’s own."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"filling up — antanaplērō",parse:"present active indicative, 1st singular (v.24)",html:'A rare compound verb (anti + ana + plēroō), “to fill up in turn, to complete on one’s own part.” Paul is not adding to Christ’s atoning work — see the caution below — but filling out, in his own body, the ongoing afflictions that come with proclaiming that finished work to the world.'},
      {type:"callout",style:"caution",label:"Caution — a phrase easy to misread",html:'“Filling up what is lacking in Christ’s afflictions” can sound like Christ’s atonement was insufficient. Standard evangelical commentary (Moo, O’Brien, Bruce) notes that the word for “afflictions” here (thlipsis) is never used elsewhere in the New Testament for Christ’s atoning, expiatory sufferings — that vocabulary (pathēma) is reserved for the cross itself. Paul’s “afflictions” are the ongoing sufferings of gospel ministry, shared by Christ’s body (the church) as it brings the message to completion — not a deficiency in the cross needing to be topped up. Commentators differ on exactly how to characterize this shared suffering (e.g., participation in the “messianic woes,” or simply apostolic hardship), but they agree the atonement itself is not in view as lacking.'},
      {type:"word",term:"stewardship — oikonomia",parse:"accusative singular noun (v.25)",html:'A household-management term — the entrusted responsibility of managing another’s affairs. Paul’s ministry is not self-appointed; it is a commission “bestowed” on him, for the Colossians’ benefit, not his own.'},
      {type:"word",term:"mystery — mystērion",parse:"nominative/accusative singular noun (vv.26–27)",html:'In Paul, a <em>mystērion</em> is not a puzzle to solve but a truth once hidden, now disclosed by revelation — see also Ephesians 3:3–6, where the mystery is identified as Gentile inclusion into the one body. Here its content is stated directly: Christ in you, the hope of glory.'},
      {type:"word",term:"complete — teleios",parse:"accusative singular adjective, predicate (v.28)",html:'From the <em>telos</em> root — goal, end, completion. “Complete” (NASB1995) or “mature” (ESV) describes the aim of Paul’s teaching: not information transfer alone, but people brought to their intended completeness in Christ.'},
      {type:"word",term:"labor, striving — kopiō, agōnizomenos",parse:"present active indicative + present middle/passive participle (v.29)",html:'<em>Kopiō</em> is labor to the point of weariness; <em>agōnizomenos</em> (root of “agonize”) is athletic/combat imagery — straining effort. Both are real, costly exertion — yet explicitly “according to His power, which mightily works within me,” not Paul’s own reserves.'},
      {type:"callout",style:"oneline",label:"In one line",html:"a shared suffering that completes nothing in the cross → an entrusted stewardship → a once-hidden mystery now disclosed → Christ in you, the hope of glory → aimed at everyone’s completeness → sustained by a power not his own."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study makes no such claim. But notice the mechanism named in v.28: “admonishing... and teaching... with all wisdom” — present-tense participles describing sustained, repeated instruction, not a single announcement.'},
      {type:"p",html:'The mystery, once hidden, becomes something believers actually know and are shaped by through this ongoing teaching and admonition (v.28), aimed at bringing them to completeness (teleios) in Christ — a pattern of repeated input over time producing settled change, under the Spirit’s ongoing work, not a single flash of insight.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 12:2 — “renewed... by the renewing of your mind” — the same pattern: sustained teaching and admonition, not one-time exposure, forming a mind toward completeness in Christ."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>“Christ in you” is a settled fact, not a performance to achieve.</strong> The hope of glory rests on Christ’s presence in you (v.27), not on your own steady output or consistency.'},
      {type:"p",html:'<strong>The mystery was hidden, then disclosed — not figured out by effort.</strong> You are not expected to arrive at this truth through constant self-generated insight; it was given, revealed, made known (v.26).'},
      {type:"p",html:'<strong>“Present everyone complete” names a goal, not a current requirement.</strong> The teaching and admonishing that gets you there (v.28) is patient and ongoing — relief from needing to already be complete.'},
      {type:"p",html:'<strong>The labor is real, and named honestly, but the power is not yours to manufacture.</strong> “Labor, striving... according to His power” (v.29) names real cost for a mind already managing limited executive-function reserves — while locating the actual strength outside yourself.'},
      {type:"p",html:'<strong>Rejoicing in suffering is anchored to a specific reason, not manufactured positivity.</strong> Paul rejoices “for your sake” (v.24) — a concrete, vocational reason, not a vague command to feel good about pain.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Say v.27 over yourself today.</strong> “Christ in me, the hope of glory” — a truth to rest in, not to earn.",
        "<strong>Receive one piece of teaching or counsel today with “all wisdom” (v.28) instead of resisting it</strong> — let someone admonish or instruct you on one specific thing.",
        "<strong>Name one place you are “laboring, striving” right now (v.29), and ask God directly for the power that works within you</strong> — rather than gritting through it alone."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, thank You that Christ is in me — the hope of glory — a settled fact, not a performance I must sustain. Thank You that the mystery once hidden has been made known, not something I had to figure out on my own. Where I am laboring and straining today, remind me that the power at work is Yours, mightily working within me, not my own dwindling reserves. Use whatever I carry today — for the sake of those You’ve put in my life — and bring me, in Your time, to completeness in Christ. Amen.'}
    ]}
  ],
  oneThing:"Christ in you is the hope of glory — and the power at work in you today is His, not your own.",
  sources:"Translations: NASB 1995, ESV. Greek text: Colossians 1:24–29 (NA/UBS). Key words: antanaplērō (present active indicative, v.24), oikonomia (accusative singular, v.25), mystērion (vv.26–27), teleios (v.28), kopiō / agōnizomenos (present active indicative + present participle, v.29). Cross-references: Colossians 1:15–23; 1:20–22; Ephesians 3:3–6; Romans 12:2; 1 Peter 1:11. Honest note: “filling up what is lacking in Christ’s afflictions” (v.24) is flagged and addressed directly — thlipsis (afflictions) is distinct from pathēma (Christ’s atoning sufferings) elsewhere in the NT; standard commentary does not read this as implying a deficient atonement, though the precise character of the shared suffering is discussed variously among commentators."
},
{
  id:"2co12-7-10",
  reference:"2 Corinthians 12:7–10",
  title:"2 Corinthians 12:7–10",
  subtitle:"A thorn Paul begged three times to have removed — answered instead with sufficient grace and power perfected in weakness.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Suffering & Endurance","Assurance & Security","Union with Christ"],
  anchor:"When Paul begged three times for his thorn to be removed, God answered not with removal but with sufficient grace — for His power is perfected in weakness.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">7</sup>Because of the surpassing greatness of the revelations, for this reason, to keep me from exalting myself, there was given me a thorn in the flesh, a messenger of Satan to torment me—to keep me from exalting myself! <sup class="vn">8</sup>Concerning this I implored the Lord three times that it might leave me. <sup class="vn">9</sup>And He has said to me, “My grace is sufficient for you, for power is perfected in weakness.” Most gladly, therefore, I will rather boast about my weaknesses, so that the power of Christ may dwell in me. <sup class="vn">10</sup>Therefore I am well content with weaknesses, with insults, with distresses, with persecutions, with difficulties, for Christ’s sake; for when I am weak, then I am strong.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">7</sup>So to keep me from becoming conceited because of the surpassing greatness of the revelations, a thorn was given me in the flesh, a messenger of Satan to harass me, to keep me from becoming conceited. <sup class="vn">8</sup>Three times I pleaded with the Lord about this, that it should leave me. <sup class="vn">9</sup>But he said to me, “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly of my weaknesses, so that the power of Christ may rest upon me. <sup class="vn">10</sup>For the sake of Christ, then, I am content with weaknesses, insults, hardships, persecutions, and calamities. For when I am weak, then I am strong.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the close of Paul’s reluctant “fool’s boasting” (chs.11–12)",blocks:[
      {type:"p",html:'Paul has been forced into an uncomfortable comparison with the “super-apostles” (11:5; 12:11), boasting — against his own instinct — in things that would normally count as weaknesses or dishonor (11:16–33). This paragraph directly follows his account of an extraordinary revelation, being caught up to the third heaven and Paradise (12:1–6).'},
      {type:"p",html:'The hinge is explicit: “because of... for this reason” (v.7) ties the thorn directly to the preceding vision. Precisely because the revelation was so great, something was given to keep Paul from exalting himself over it. This unit closes the whole “fool’s speech” begun in ch.11, pivoting Paul’s boasting entirely away from achievements and onto weakness.'},
      {type:"callout",style:"oneline",label:"In one line",html:"After an extraordinary revelation, a thorn kept Paul from pride — and God’s answer to his pleading reframed weakness itself as the place where Christ’s power is displayed."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"five beats: the thorn given, the plea, the answer, the resolve, the summary",blocks:[
      {type:"p",html:'<strong>Beat 1 — the thorn, given for a stated purpose (v.7).</strong> Because of the surpassing greatness of the revelations, and to keep Paul from exalting himself, a thorn in the flesh was given him — a messenger of Satan, to torment him. The purpose clause is repeated twice for emphasis.'},
      {type:"p",html:'<strong>Beat 2 — the plea (v.8).</strong> Paul implored the Lord three times that it might leave him.'},
      {type:"p",html:'<strong>Beat 3 — the Lord’s answer (v.9a).</strong> Not removal, but sufficiency: “My grace is sufficient for you, for power is perfected in weakness.”'},
      {type:"p",html:'<strong>Beat 4 — Paul’s resulting resolve (v.9b).</strong> He will rather boast about his weaknesses gladly, so that the power of Christ may dwell in — or rest upon — him.'},
      {type:"p",html:'<strong>Beat 5 — the summary paradox (v.10).</strong> Therefore he is content — well pleased, not merely resigned — with weaknesses, insults, distresses, persecutions, and difficulties, for Christ’s sake: “when I am weak, then I am strong.”'},
      {type:"callout",style:"oneline",label:"In one line",html:"a thorn given to guard against pride → three unanswered pleas for removal → grace declared sufficient, power perfected in weakness → boasting turned toward weakness on purpose → strength found precisely in weakness, for Christ’s sake."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"thorn — skolops",parse:"nominative singular noun (v.7)",html:'A sharp stake or splinter. What the thorn <em>was</em> is genuinely debated — see the caution below — but its stated agency is clear: “a messenger of Satan,” permitted by God for a named purpose.'},
      {type:"callout",style:"caution",label:"Caution — the thorn’s identity is genuinely debated",html:'Commentators are divided on what the “thorn” physically or circumstantially was. The majority view (Moo, Barnett, Harris) favors a recurring physical ailment (proposals include a chronic eye condition or a malarial-type illness); a minority (following some patristic and Reformed readers, including Calvin) have argued for persecution or opposition from people rather than a physical condition. The text itself does not specify, and does not need to for its point to stand — Paul names its agency (“a messenger of Satan”) and its God-given purpose (to keep him humble) without ever naming its exact form.'},
      {type:"word",term:"a messenger of Satan — angelos Satana",parse:"nominative singular noun phrase (v.7)",html:'<em>Angelos</em> ordinarily means simply “messenger” (used of human messengers elsewhere, e.g. James 2:25) but paired here with “of Satan” it names a hostile spiritual agency — permitted, not merely endured; the whole clause sits under God’s sovereign purpose (“there was given me”).'},
      {type:"word",term:"to torment — kolaphizē",parse:"present active subjunctive, in a hina (purpose) clause, of kolaphizō (v.7)",html:'Literally “to strike with the fist” — a violent, repeated-blow image (used elsewhere of Jesus being struck, Matthew 26:67), not a single passing ache.'},
      {type:"word",term:"is sufficient — arkei",parse:"present active indicative, 3rd singular, of arkeō (v.9)",html:'Present tense — a continuing, ongoing sufficiency, not a one-time grant. Compare Philippians 4:19, “my God will supply every need of yours.”'},
      {type:"word",term:"is perfected — teleitai",parse:"present passive indicative, 3rd singular, of teleō (v.9)",html:'“Comes to its intended completion” — power reaches its designed goal precisely in weakness, not despite it or in spite of it.'},
      {type:"word",term:"I am well content — eudokō",parse:"present active indicative, 1st singular, of eudokeō (v.10)",html:'A settled, deliberate pleasure or approval — the same verb used of the Father’s pleasure in the Son (Matthew 3:17) — not mere gritted-teeth endurance.'},
      {type:"callout",style:"oneline",label:"In one line",html:"an undefined thorn, satanically agented but divinely permitted → repeated pleading, honestly voiced → an ongoing sufficiency of grace → power completed, not despite weakness but within it → a settled, deliberate contentment, not resignation."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study makes no such claim. But notice the deliberate turn in v.9b: from the natural response — asking for the thorn’s removal — to an active, repeated resolve: “I will rather boast about my weaknesses.”'},
      {type:"p",html:'This is not a single flash of insight but something Paul actively returns to and rehearses — a specific belief (“power is perfected in weakness”) taken up and repeated until it reorganizes how he narrates his own weakness. Tie this modestly to Romans 12:2, “renewed... by the renewing of your mind” — the same pattern of a mind reshaped over time, under the Spirit’s ongoing work, not by self-help.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Not a single moment of relief, but a repeated, deliberate re-narration of weakness — from a threat to hide, to the place where Christ’s power rests."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Paul asked three times, and was told no — permission to keep asking honestly, and to receive “no” as a real, gracious answer, not a sign of failed faith.</strong>'},
      {type:"p",html:'<strong>“Power is perfected in weakness” directly reframes hitting a limit.</strong> The daily experience of running out of energy, focus, or sensory bandwidth is not, by this text, spiritual failure — it is the very place Christ’s power is designed to show up.'},
      {type:"p",html:'<strong>The thorn is never fully explained, resolved, or removed in the text.</strong> A model for living with an ongoing, unresolved limitation without needing full understanding — or a cure — before contentment becomes possible.'},
      {type:"p",html:'<strong>“Boast in weaknesses” reframes disclosure as strength’s dwelling place, not something to mask.</strong> Naming a struggle honestly is where Christ’s power is said to rest — the opposite of hiding it to appear fine.'},
      {type:"p",html:'<strong>The list in v.10 is concrete and specific, not a vague call to “be strong.”</strong> Weaknesses, insults, distresses, persecutions, difficulties — permission to name the actual hard things, rather than generic resilience talk.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Ask God plainly to remove one specific weakness or struggle</strong> — and also ask, honestly, for the grace that is “sufficient” if the answer is not yet.",
        "<strong>Name one weakness out loud today</strong> — to God, to a trusted person, or in writing — instead of hiding it. Not proudly, but honestly, as Paul does.",
        "<strong>When you hit a limit today — energy, focus, overload — pause and say: “Your grace is sufficient for me”</strong> before pushing through or shutting down."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, I have asked You more than three times to take this thing away. I don’t always understand why the answer has been no. Teach me to hear what You told Paul as true for me too: Your grace is sufficient, and Your power is made perfect exactly in my weakness, not somewhere past it. Where I am tempted to hide what is hard today, let me name it honestly instead — not for pity, but because that is where You say Your power rests. When I am weak, let me actually be strong, in You. Amen.'}
    ]}
  ],
  oneThing:"His grace is sufficient for you — His power is made perfect precisely in your weakness.",
