<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logos Studies</title>
<style>

  :root{
    --bg:#e6dabf; --panel:#efe4cf; --ink:#2a2620; --soft:#6a5f45; --line:#d2c09c;
    --accent:#6b7233; --accent-soft:#e7e5cc; --scripture:#332f24;
    --shadow:0 1px 3px rgba(60,50,20,.10),0 8px 24px rgba(60,50,20,.07);
    --measure:66ch; --fs:18px; --radius:14px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Newsreader',Georgia,'Times New Roman',serif;
    font-size:var(--fs); line-height:1.65; -webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  /* Top bar */
  header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
  .brand{font-weight:700;letter-spacing:.02em;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;gap:9px}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:800}
  .top-spacer{flex:1}
  .ctrl{display:flex;gap:6px;align-items:center}
  button.icon{background:var(--panel);border:1px solid var(--line);color:var(--ink);width:38px;height:34px;border-radius:9px;cursor:pointer;font-size:.95rem;display:grid;place-items:center;transition:.15s}
  button.icon:hover{border-color:var(--accent);color:var(--accent)}
  button.icon.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Library */
  .lib-head{padding:34px 0 8px}
  .lib-head h1{font-size:1.9rem;margin:0 0 6px}
  .lib-head p{color:var(--soft);margin:0;max-width:60ch}
  .view-toggle{display:flex;gap:8px;margin-top:16px}
  .vt-btn{background:var(--panel);border:1px solid var(--line);color:var(--soft);padding:7px 14px;border-radius:20px;
    cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;transition:.15s}
  .vt-btn:hover{border-color:var(--accent);color:var(--accent)}
  .vt-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding:22px 0 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;
    box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:10px;min-height:170px}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .ref{font-size:1.25rem;font-weight:700}
  .card .subtitle{color:var(--soft);font-size:.92rem;line-height:1.45;flex:1}
  .card-empty{border:1px dashed var(--line);background:transparent;display:grid;place-items:center;color:var(--soft);text-align:center;font-size:.9rem}
  .card-add{display:flex;place-items:stretch;cursor:default;text-align:left;gap:8px}
  .card-add .add-label{font-weight:700;color:var(--soft);font-size:.9rem}
  .queue-input{font-family:inherit;font-size:.95rem;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
  .queue-input:focus{outline:none;border-color:var(--accent)}
  .queue-submit{align-self:flex-start;margin-top:2px}
  .card-queued{position:relative;border-style:dashed;cursor:default}
  .card-queued .ref{color:var(--soft)}
  .queue-remove{position:absolute;top:10px;right:10px;background:transparent;border:none;color:var(--soft);font-size:1.15rem;line-height:1;cursor:pointer;padding:2px 7px;border-radius:6px;font-family:inherit}
  .queue-remove:hover{color:var(--accent);background:var(--accent-soft)}
  .group-header{grid-column:1/-1;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;border-bottom:1px solid var(--line);padding:18px 2px 8px;margin-top:4px}
  .group-header:first-child{padding-top:0;margin-top:0}

  /* Reader layout */
  .reader{display:none;padding:24px 0 100px}
  .reader.active{display:block}
  .reader-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px;align-items:start}
  nav.arc{position:sticky;top:74px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
  nav.arc .back{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.9rem;text-align:left;padding:6px 8px;font-weight:600;margin-bottom:6px}
  nav.arc a{color:var(--soft);text-decoration:none;padding:6px 10px;border-radius:8px;border-left:2px solid transparent;transition:.12s;display:block}
  nav.arc a:hover{color:var(--ink);background:var(--panel)}
  nav.arc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}

  article{max-width:var(--measure)}
  article h1.title{font-size:2rem;margin:0 0 4px;line-height:1.2}
  article .meta{color:var(--soft);margin:0 0 26px;font-size:.95rem}

  /* Sticky anchor */
  .anchor{position:sticky;top:74px;z-index:20;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
    border-radius:var(--radius);padding:16px 18px;margin:0 0 30px;box-shadow:var(--shadow)}
  .anchor .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .anchor p{margin:0;font-size:1.08rem;font-weight:600;line-height:1.5}

  section.blk{margin:0 0 34px;scroll-margin-top:150px}
  section.blk h2{font-size:1.3rem;margin:0 0 4px;display:flex;gap:10px;align-items:baseline}
  section.blk h2 .num{color:var(--accent);font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums}
  section.blk h2 .sub{display:block;font-size:.8rem;color:var(--soft);font-weight:400}
  .blk p{margin:.7em 0}
  .blk em{font-style:italic}
  .blk strong{font-weight:700}

  .scripture{background:var(--panel);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 18px;margin:14px 0;
    color:var(--scripture);font-size:1.05rem;line-height:1.7}
  .scripture .ver{display:block;font-family:inherit;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;font-family:-apple-system,sans-serif}
  sup.vn{font-size:.68em;color:var(--soft);font-weight:700;margin-right:2px}

  .word{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .word .term{font-weight:700;font-size:1.05rem}
  .word .parse{color:var(--soft);font-size:.85rem;font-style:italic;margin:2px 0 8px}
  .word .translit{color:var(--accent);font-style:italic}

  .callout{border-radius:12px;padding:13px 16px;margin:16px 0;font-size:.98rem;border:1px solid var(--line);background:var(--panel)}
  .callout.oneline{border-left:3px solid var(--accent);background:var(--accent-soft)}
  .callout.caution{border-left:3px solid #c98a2b;background:color-mix(in srgb,#c98a2b 10%,var(--panel))}
  .callout .clbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:4px;color:var(--soft)}

  ul.pick,ul.plain{margin:.6em 0;padding-left:0;list-style:none}
  ul.pick li,ul.plain li{position:relative;padding:8px 0 8px 26px;border-bottom:1px solid var(--line)}
  ul.pick li:last-child,ul.plain li:last-child{border-bottom:none}
  ul.pick li::before{content:"○";position:absolute;left:2px;color:var(--accent);font-weight:700}
  ul.plain li::before{content:"—";position:absolute;left:2px;color:var(--accent)}

  .prayer{font-style:italic;background:var(--panel);border-radius:12px;padding:18px 20px;line-height:1.7;color:var(--scripture)}
  .onething{background:var(--accent);color:#fff;border-radius:var(--radius);padding:20px 22px;font-size:1.15rem;font-weight:600;line-height:1.5}
  .onething .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;opacity:.85;font-weight:700;margin-bottom:6px}
  .sources{font-size:.82rem;color:var(--soft);border-top:1px solid var(--line);padding-top:16px;margin-top:30px;line-height:1.6}

  /* focus/reading mode hides side nav & widens */
  body.focus nav.arc{display:none}
  body.focus .reader-grid{grid-template-columns:minmax(0,1fr)}
  body.focus article{margin:0 auto}

  @media(max-width:760px){
    .reader-grid{grid-template-columns:1fr;gap:0}
    nav.arc{position:static;flex-direction:row;flex-wrap:wrap;top:0;margin-bottom:18px;gap:4px}
    nav.arc a{border-left:none;border-bottom:2px solid transparent;padding:5px 9px}
    nav.arc a.on{border-left:none;border-bottom-color:var(--accent)}
    .anchor,nav.arc{top:64px}
  }
  .hint{font-size:.8rem;color:var(--soft);text-align:center;padding:20px}

  /* theme picker */
  .picker{position:relative}
  .themepop{position:absolute;right:0;top:42px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:8px;display:none;grid-template-columns:repeat(2,1fr);gap:6px;width:230px;z-index:50}
  .themepop.open{display:grid}
  .swatch{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;border:1px solid transparent;cursor:pointer;
    background:none;color:var(--ink);font-size:.85rem;text-align:left;transition:.12s}
  .swatch:hover{background:var(--accent-soft)}
  .swatch.on{border-color:var(--accent)}
  .chip{width:26px;height:26px;border-radius:7px;flex:none;border:1px solid rgba(0,0,0,.15);position:relative;overflow:hidden}
  .chip::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-top-left-radius:6px}
  .sw-txt{display:flex;flex-direction:column;line-height:1.2}
  .sw-name{font-weight:600}
  .sw-font{font-size:.7rem;color:var(--soft)}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand" onclick="showLibrary()"><span class="mark">λ</span> Logos Studies</div>
    <div class="top-spacer"></div>
    <div class="ctrl">
      <button class="icon" id="focusBtn" title="Focus / reading mode" onclick="toggleFocus()">◎</button>
      <button class="icon" title="Smaller text" onclick="fontStep(-1)">A−</button>
      <button class="icon" title="Larger text" onclick="fontStep(1)">A+</button>
    </div>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- LIBRARY -->
  <div id="library">
    <div class="lib-head">
      <h1>Study Library</h1>
      <p>A growing collection of deep, AuDHD-aware studies. Each moves in one arc through the passage — Anchor first, one thing to carry last.</p>
      <div class="view-toggle" id="viewToggle">
        <button class="vt-btn" id="vtBook" onclick="setLibView('book')">By Book</button>
        <button class="vt-btn" id="vtTheme" onclick="setLibView('theme')">By Theme</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- READER -->
  <div class="reader" id="reader">
    <div class="reader-grid">
      <nav class="arc" id="arcNav"></nav>
      <article id="article"></article>
    </div>
  </div>
</div>

<div class="hint" id="foot"></div>

<script>
/* =========================================================
   STUDY DATA
   To add a study, append one object to STUDIES.
   Block types: p | scripture | word | callout | list | heading | prayer
   ========================================================= */
const STUDIES = [
{
  id:"rom12-1-2",
  reference:"Romans 12:1–2",
  title:"Romans 12:1–2",
  subtitle:"Mercy, the offered body, and the slow renewing of the mind.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Worship & Consecration","Renewal of the Mind","Sanctification & Holiness"],
  anchor:"Because God has already shown you mercy, give Him your actual body and let Him slowly rewire your mind — so you can recognize, from the inside, what He wants.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">1</sup>Therefore I urge you, brethren, by the mercies of God, to present your bodies a living and holy sacrifice, acceptable to God, which is your spiritual service of worship. <sup class="vn">2</sup>And do not be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what the will of God is, that which is good and acceptable and perfect.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">1</sup>I appeal to you therefore, brothers, by the mercies of God, to present your bodies as a living sacrifice, holy and acceptable to God, which is your spiritual worship. <sup class="vn">2</sup>Do not be conformed to this world, but be transformed by the renewal of your mind, that by testing you may discern what is the will of God, what is good and acceptable and perfect.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the weight of “therefore”",blocks:[
      {type:"p",html:'The word <strong>“therefore”</strong> (<em>oun</em>) is a hinge. Paul spends Romans 1–11 on what God has <em>done</em>: humanity’s guilt, justification by faith, freedom from sin’s dominion, and mercy toward Jew and Gentile. Chapter 11 ends not in a command but in doxology (11:33–36).'},
      {type:"p",html:'Only <em>then</em> comes “therefore.” The whole ethical section rests on eleven chapters of accomplished mercy — and Paul says it outright: he appeals <em>“by the mercies of God”</em> (<em>dia tōn oiktirmōn tou theou</em>).'},
      {type:"callout",style:"oneline",label:"In one line",html:"The command is downstream of the gift. You present your body as a <em>response</em> to mercy, never as a <em>payment</em> for it."},
      {type:"p",html:'For a mind prone to shame-driven striving, this order is the whole foundation. Obedience here is a thank-you, not a transaction.'}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"fuller exegesis",blocks:[
      {type:"p",html:'The passage is one sentence-complex in four beats:'},
      {type:"p",html:'<strong>Beat 1 — The appeal.</strong> <em>Parakalō oun hymas, adelphoi</em> — “I urge you, brothers.” <em>Parakalō</em> (present active) is warm and pastoral: to summon alongside, to plead. Paul could command; here he entreats.'},
      {type:"p",html:'<strong>Beat 2 — The offering.</strong> <em>Parastēsai ta sōmata hymōn</em> — “to present your bodies.” The infinitive is <em>aorist</em> (a decisive act), yet the sacrifice is <em>living</em> — so the single act of giving becomes an ongoing state.'},
      {type:"p",html:'<strong>Beat 3 — The turn.</strong> <em>Mē syschēmatizesthe… alla metamorphousthe</em> — pressure from <em>outside</em> versus remaking from <em>inside</em>. Both verbs are present tense (ongoing) and middle/passive in form.'},
      {type:"p",html:'<strong>Beat 4 — The outcome.</strong> <em>Eis to dokimazein</em> — “so that you may prove/discern.” The <em>eis to</em> + infinitive marks purpose and result: a renewed mind exists <em>in order to</em> discern.'},
      {type:"callout",style:"oneline",label:"In one line",html:"mercy → offering → transformation → discernment. Knowing God’s will is the <em>fruit</em> of a renewed mind, not the entry ticket."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"present — parastēsai",parse:"aorist active infinitive of paristēmi (v.1)",html:'A sacrificial/priestly term: to place at another’s disposal, to offer up. Same verb in Romans 6:13, 19 — “present your members” to God rather than to sin — making 12:1 the positive climax of that appeal.'},
      {type:"word",term:"living sacrifice — thysian zōsan",parse:"zōsan = present active participle, “living” (v.1)",html:'A deliberate paradox: every Levitical sacrifice <em>died</em> on the altar; this one keeps living. Worship is not one dramatic death but an ongoing, daily-yielded life.'},
      {type:"word",term:"spiritual service of worship — logikēn latreian",parse:"accusative, in apposition (v.1)",html:'Genuinely debated. <em>Latreia</em> is cultic worship (cf. Romans 9:4). <em>Logikos</em> can mean “rational/reasonable” <em>or</em> “spiritual” — hence NASB “spiritual service of worship” vs. KJV “reasonable service.” Cranfield leans toward the logical expression of a creature rightly understanding itself; Moo and Schreiner stress worship that engages the renewed mind. Either way: your reason is invited into worship, not switched off.'},
      {type:"word",term:"do not be conformed — mē syschēmatizesthe",parse:"present middle/passive imperative, 2nd pl. (v.2)",html:'Root <em>schēma</em> = outward shape or fashion. Same verb in 1 Peter 1:14. Present with <em>mē</em> = stop the ongoing drift; do not keep being molded by “this age.”'},
      {type:"word",term:"be transformed — metamorphousthe",parse:"present middle/passive imperative, 2nd pl. (v.2)",html:'Root <em>morphē</em> = inner, essential form — the word behind “metamorphosis.” Describes Jesus at the Transfiguration (Matthew 17:2; Mark 9:2) and the believer transformed “from one degree of glory to another” (2 Corinthians 3:18). Present tense = continual.'},
      {type:"callout",style:"caution",label:"Honest caution 1 — the schēma / morphē contrast",html:'It is popular to say <em>schēma</em> = fleeting outer fashion and <em>morphē</em> = permanent inner essence. There is <em>something</em> to it — but in Koine these roots overlap considerably, and careful commentators warn against resting heavy theology on the distinction alone. A suggestive nuance, not a proof.'},
      {type:"callout",style:"caution",label:"Honest caution 2 — middle or passive?",html:'Both imperatives share a form that can be <em>passive</em> (“be transformed” — God the agent) <em>or</em> <em>middle</em> (“let yourselves be transformed”). Most read passive-leaning, fitting Paul’s grace framework — but the middle nuance sharpens the point: transformation is neither self-manufactured nor passive-inert. It is <strong>cooperative</strong> — you yield; God remakes.'},
      {type:"callout",style:"oneline",label:"In one line",html:"<em>syschēmatizō</em> touches the surface; <em>metamorphoō</em> touches the substance — keep yielding to the second rather than drifting into the first."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul locates transformation at a precise site: <strong>“the renewing of your mind”</strong> — <em>tē anakainōsei tou noos</em> (dative of means: renewal is the <em>instrument</em> of transformation). <em>Anakainōsis</em> = a making-new, a renovation — ongoing, not instant.'},
      {type:"p",html:'Paul did not know modern neuroscience, and this study makes no claim that he did. But the <em>shape</em> of what he describes lines up with something real about how minds change:'},
      {type:"list",style:"plain",items:[
        "The brain forms and strengthens pathways through repeated, directed attention — “what fires together wires together.” Durable change comes from repetition over time, not a single heroic decision.",
        "Scripture frames renewal the same way — ongoing and mind-located: “renewed in the spirit of your minds” (Ephesians 4:23), “renewed in knowledge” (Colossians 3:10), “the washing of regeneration and renewal of the Holy Spirit” (Titus 3:5). Note the agent in Titus: the Spirit renews."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Paul’s call to be transformed by the renewing of the mind describes a real, gradual remaking — and God ordinarily works it the way attention reshapes a brain: repetition, direction, and time, empowered by the Spirit."},
      {type:"p",html:'This dismantles “try harder, decide once” and replaces it with “keep showing up, keep directing attention, let it be worked in you by the Spirit.”'}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>The verb form relieves the willpower trap.</strong> Whether passive or cooperative-middle, the load is not “generate change by force.” For a brain where willpower is unreliable and one-time resolutions rarely hold, this is good news, not a loophole. Keep yielding, keep showing up; the remaking is God’s work.'},
      {type:"p",html:'<strong>“Living sacrifice” honors embodiment.</strong> The offering is your <em>body</em> — your literal hours, your sensory-real life — not a vague inner surrender. For a mind that lives concretely, “present your body” is more graspable than abstract “give God your heart.”'},
      {type:"p",html:'<strong>“Do not be conformed” ≠ “mask harder.”</strong> The age’s <em>schēma</em> presses everyone toward its shape; for AuDHD people that often lands as exhausting masking to fit a neurotypical mold. Paul’s call is the opposite — not outward conformity but inward transformation. You are freed to be remade into Christ’s likeness, not pressed into everyone else’s fashion.'},
      {type:"p",html:'<strong>Discernment is a trained skill, not instant knowing.</strong> <em>Dokimazein</em> is an assaying word — to test metal for genuineness. God’s will is discerned by testing over time, not downloaded in a flash. Permission to discern iteratively: try, test, notice, adjust.'},
      {type:"p",html:'<strong>Repetition is the mechanism, not the failure.</strong> If renewal is ongoing, then returning here tomorrow is not backsliding — it is exactly how the remaking works. The loop <em>is</em> the path.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name the mold.</strong> Write down one specific “pattern of this age” pressing on you this week (a comparison, a fear, a scroll-habit). Naming the <em>schēma</em> is the first act of refusing it.",
        "<strong>One embodied offering.</strong> Choose one bodily, ordinary act this week and consciously “present” it to God as worship — a walk, a meal, the work of your hands. Say it out loud as you begin.",
        "<strong>A renewal loop.</strong> Pick one true sentence from this passage (“I am being transformed”) and return your attention to it at a fixed daily anchor point. The repetition <em>is</em> the renewing."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Father, I did not earn Your mercy, and I cannot earn it now. Because You have been merciful, here is my body — my real, ordinary, tired, distractible life. I cannot transform myself, so I yield and ask You to keep remaking me from the inside. Renew my mind slowly, faithfully, by Your Spirit, today and again tomorrow, until I can recognize from within what You want — and find it good. Amen.'}
    ]}
  ],
  oneThing:"“Be transformed” is something you <em>yield to</em>, not something you <em>manufacture</em>. Your job today is only to keep showing up and offering the body you have.",
  sources:"Translations: NASB 1995, ESV. Greek text: Romans 12:1–2 (NA/UBS). Cross-references: Romans 6:13, 19; 9:4; 11:33–36; 2 Corinthians 3:18; Matthew 17:2; Mark 9:2; Ephesians 4:23; Colossians 3:10; Titus 3:5; 1 Peter 1:14. Commentators referenced for contested points: Cranfield, Moo, Schreiner (Romans). Where the middle/passive and schēma/morphē questions are genuinely open, that is flagged rather than resolved."
},
{
  id:"gal2-20",
  reference:"Galatians 2:20",
  title:"Galatians 2:20",
  subtitle:"The old self already died; the life you now live is Christ living in you.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Union with Christ","Crucified with Christ","Identity in Christ"],
  anchor:"The old you already died with Christ — so your life now is not something you perform, it is Someone living in you, who personally loved you and gave Himself for you.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">20</sup>I have been crucified with Christ; and it is no longer I who live, but Christ lives in me; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself up for me.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">20</sup>I have been crucified with Christ. It is no longer I who live, but Christ who lives in me. And the life I now live in the flesh I live by faith in the Son of God, who loved me and gave himself for me.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the personal climax of an argument",blocks:[
      {type:"p",html:'Galatians 2 is a fight about the gospel. Paul confronts Peter at Antioch (2:11–14) for withdrawing from Gentile believers, then lays down the thesis of the whole letter: a person is justified <em>not by works of the law but through faith in Christ</em> (2:15–16). Verses 17–21 press it home.'},
      {type:"p",html:'Verse 20 is where the doctrine turns personal. In 2:19 Paul says, “through the law I died to the law, so that I might live to God.” Then he explains <em>how</em> that death and new life work — in the most intimate terms in the letter: not “we,” but “I,” “me,” “me.”'},
      {type:"callout",style:"oneline",label:"In one line",html:"This verse is justification by faith turned from courtroom verdict into personal testimony: what is true of Christ’s people is now true of <em>me</em>."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"fuller exegesis",blocks:[
      {type:"p",html:'The verse moves in four beats — a death, an exchange, a present life, and a ground:'},
      {type:"p",html:'<strong>Beat 1 — The death (already accomplished).</strong> “I have been crucified with Christ.” Not <em>will be</em>, not <em>am being</em> — a completed event with standing results (see the perfect tense in §4). Your union with His cross is a past fact you now live inside.'},
      {type:"p",html:'<strong>Beat 2 — The exchange.</strong> “It is no longer I who live, but Christ lives in me.” The old self-directed “I” has been displaced; the animating center of the life is now Christ Himself indwelling.'},
      {type:"p",html:'<strong>Beat 3 — The present life.</strong> “The life which I now live in the flesh I live by faith.” Real, ongoing, embodied life — lived <em>by faith</em>, a continual leaning on Another.'},
      {type:"p",html:'<strong>Beat 4 — The ground.</strong> “…in the Son of God, who loved me and gave Himself up for me.” The faith rests on a Person and His decisive act of self-giving love.'},
      {type:"callout",style:"oneline",label:"In one line",html:"death → exchange → daily faith → grounded in the Son who loved <em>me</em>. The Christian life is not self-improvement layered on the old self; it is a new self, animated by Christ, sustained by trust."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"I have been crucified with — synestaurōmai",parse:"perfect passive indicative, 1st sing., of systauroō (v.20)",html:'The load-bearing word. The <em>perfect</em> tense = a completed past action whose result stands into the present: “I was crucified with Him, and I remain in that crucified-with-Christ state.” <em>Passive</em>: it was done <em>to</em> you, not by you. The same root describes the old self in Romans 6:6 (“our old self was crucified with him”).'},
      {type:"word",term:"it is no longer I who live — zō... ouketi egō",parse:"zō = present active indicative, 1st sing. (v.20)",html:'“I live, yet no longer I.” Paul does not say the self is annihilated — he says the self-as-center is dethroned. The one living is now defined by Another. Compare Philippians 1:21, “to live is Christ.”'},
      {type:"word",term:"in the flesh — en sarki",parse:"dative, “in the flesh/body” (v.20)",html:'Important nuance: here <em>sarx</em> is <strong>neutral</strong> — ordinary bodily, earthly existence — <em>not</em> Paul’s negative “flesh” (the sinful nature) of Galatians 5:19–21. The new life is not escape from the body; it is lived out inside real, physical, everyday life.'},
      {type:"word",term:"by faith in the Son of God — en pistei... tē tou huiou tou theou",parse:"en pistei = “by/in faith”; genitive phrase (v.20)",html:'Present tense of <em>live</em> here (“I <em>now</em> live … I live by faith”) marks faith as ongoing, daily, not a one-time transaction. Faith is the continual posture of the new life.'},
      {type:"callout",style:"caution",label:"Honest caution — “faith IN” or “faithfulness OF” the Son of God?",html:'The Greek <em>pistis … tou huiou tou theou</em> is grammatically ambiguous. Traditionally (and in NASB/ESV) it is an <em>objective</em> genitive: “faith <em>in</em> the Son of God” — my trust directed at Christ. Since Richard Hays, many argue for a <em>subjective</em> genitive: “the faith<em>fulness</em> of the Son of God” — Christ’s own faithful obedience as the ground. Both are defensible and the debate crosses theological camps; the standard English translations you use render it “faith in.” Worth knowing the phrase carries more than the translation shows.'},
      {type:"word",term:"who loved me and gave Himself up for me — agapēsantos me kai paradontos heauton hyper emou",parse:"two aorist active participles (v.20)",html:'Both participles are <em>aorist</em> — pointing to the decisive historical act of the cross. <em>Paradontos</em> (from <em>paradidōmi</em>, “hand over, deliver up”) is the language of the passion. Notice the relentless <strong>singular</strong>: “loved <em>me</em>… gave Himself for <em>me</em>.” Paul takes the most corporate truth in the gospel and makes it devastatingly personal.'},
      {type:"callout",style:"oneline",label:"In one line",html:"A finished crucifixion (perfect), an indwelling Christ (present), a daily faith (present), grounded in a decisive act of love (aorist) — aimed personally at <em>me</em>."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'This verse is less about renewing thoughts (Romans 12:2) and more about <strong>identity</strong> — the self-story you carry: “Who am I?” Paul hands you a radically new answer: “no longer I, but Christ in me.”'},
      {type:"p",html:'Paul did not know modern neuroscience, and this study makes no such claim. But the <em>shape</em> of what he asks lines up with something real about self-concept:'},
      {type:"list",style:"plain",items:[
        "The brain maintains a running self-narrative, and that narrative is not fixed — it is reinforced (or revised) by what we repeatedly rehearse about ourselves. Identity is formed by repetition, not a single insight.",
        "Paul assumes exactly this rhythm elsewhere: “<em>consider</em> [Greek <em>logizesthe</em>, an ongoing reckoning] yourselves dead to sin and alive to God in Christ Jesus” (Romans 6:11). The new identity in Galatians 2:20 is meant to be reckoned as true, again and again, until it becomes the default self-story."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"“No longer I, but Christ” is a true identity to be rehearsed, not merely believed once — and rehearsed truth is how a self-story is remade over time."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Identity is fixed in Christ, not in performance.</strong> For a mind whose sense of worth swings with executive function — a productive day feels like a good self, a scattered day like a failed self — “it is no longer I who live, but Christ lives in me” cuts the tie between identity and output. Your standing does not fluctuate with your capacity today.'},
      {type:"p",html:'<strong>The perfect tense is “already done.”</strong> <em>Synestaurōmai</em> is a settled fact, not a state you must keep re-earning. For a mind that struggles to hold onto the permanence of a good spiritual state — where grace can feel like it “resets” each morning — the grammar itself preaches: this was accomplished, and it stands.'},
      {type:"p",html:'<strong>The singular “me” is for the one who feels like the exception.</strong> If corporate love (“God loves everyone”) never quite lands as “God loves <em>me</em>,” Paul’s relentless singular is the antidote: “loved <em>me</em>… gave Himself for <em>me</em>.” You are not a rounding error in a general love; you are personally named by it.'},
      {type:"p",html:'<strong>“By faith” is a daily posture, not a grand achievement.</strong> The present tense means today’s trust can be small and ordinary. You are not asked to summon heroic faith once; you are invited to lean, again, today.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Reckon it.</strong> Once today, say out loud: “I have been crucified with Christ; the life I live, I live by faith in the Son of God who loved me.” Let the repetition do its slow work (§5).",
        "<strong>Personalize the singular.</strong> Write the verse replacing every general term with your own name: “…who loved [your name] and gave Himself up for [your name].” Read it back.",
        "<strong>Locate one embodied ‘in the flesh’ moment.</strong> Pick one ordinary bodily task today (§ neutral <em>sarx</em>) and do it as someone in whom Christ lives — not to earn anything, simply as the new self living real life."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord Jesus, I did not crucify my old self — You took me into Your death, and it is finished. I so easily tie my worth to how I performed today; remind me that it is no longer I who live, but You who live in me. When I cannot feel it, hold the fact steady for me. Let me live this ordinary day by simple faith in You — the Son of God who loved me and gave Yourself for me. Amen.'}
    ]}
  ],
  oneThing:"You are not performing a life; Christ is living one in you. The cross that killed the old self already happened — today, just lean on the One who loved <em>you</em>.",
  sources:"Translations: NASB 1995, ESV. Greek text: Galatians 2:20 (NA/UBS). Cross-references: Galatians 2:15–19; 5:19–24; 6:14; Romans 5:8; 6:6–11; 2 Corinthians 5:14–15; Ephesians 5:2, 25; Philippians 1:21; Colossians 3:3–4. Contested point flagged, not resolved: the pistis Christou debate (objective “faith in” vs. subjective “faithfulness of” the Son of God; Richard Hays and others for the subjective reading; NASB/ESV render objective)."
},
{
  id:"rom6-1-7",
  reference:"Romans 6:1–7",
  title:"Romans 6:1–7",
  subtitle:"Buried with Christ in baptism, your old self was crucified with Him — so sin's ownership is broken and His resurrection life is just as certainly yours.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Union with Christ","Crucified with Christ","Freedom from Sin","Resurrection Hope"],
  anchor:"United with Christ in a death like His, your old self was crucified with Him and sin's ownership over you is broken — and because that union holds, His resurrection life is just as certainly yours.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">1</sup>What shall we say then? Are we to continue in sin so that grace may increase? <sup class="vn">2</sup>May it never be! How shall we who died to sin still live in it? <sup class="vn">3</sup>Or do you not know that all of us who have been baptized into Christ Jesus have been baptized into His death? <sup class="vn">4</sup>Therefore we have been buried with Him through baptism into death, so that as Christ was raised from the dead through the glory of the Father, so we too might walk in newness of life. <sup class="vn">5</sup>For if we have become united with Him in the likeness of His death, certainly we shall also be in the likeness of His resurrection, <sup class="vn">6</sup>knowing this, that our old self was crucified with Him, in order that our body of sin might be done away with, so that we would no longer be slaves to sin; <sup class="vn">7</sup>for he who has died is freed from sin.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">1</sup>What shall we say then? Are we to continue in sin that grace may abound? <sup class="vn">2</sup>By no means! How can we who died to sin still live in it? <sup class="vn">3</sup>Do you not know that all of us who have been baptized into Christ Jesus were baptized into his death? <sup class="vn">4</sup>We were buried therefore with him by baptism into death, in order that, just as Christ was raised from the dead by the glory of the Father, we too might walk in newness of life. <sup class="vn">5</sup>For if we have been united with him in a death like his, we shall certainly be united with him in a resurrection like his. <sup class="vn">6</sup>We know that our old self was crucified with him in order that the body of sin might be brought to nothing, so that we would no longer be enslaved to sin. <sup class="vn">7</sup>For one who has died has been set free from sin.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"answering “shall we go on sinning?”",blocks:[
      {type:"p",html:'Romans 6 answers a question raised by chapter 5: if grace abounded all the more where sin increased, “are we to continue in sin so that grace may increase?” (6:1). Paul’s answer is horror — “May it never be!” — and his reason is not willpower or a fresh resolution, but <em>union with Christ</em>, already accomplished.'},
      {type:"p",html:'This seven-verse paragraph is one continuous argument: the question and its rejection (vv.1–2), the baptismal logic that grounds the rejection (vv.3–4), the guarantee that follows from it (v.5), and the settled facts that guarantee secures (vv.6–7). Everything Paul commands later in the chapter (“consider yourselves dead to sin,” 6:11) rests on what this paragraph establishes as already true.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Before Paul tells the Romans how to live differently, he grounds them in what has already happened to them: joined to Christ’s death, and therefore to His life."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"question → union explained → guarantee → settled facts",blocks:[
      {type:"p",html:'<strong>Beat 1 — the question and its horrified rejection (vv.1–2).</strong> If grace increases where sin increases, why not keep sinning? Paul’s answer — “May it never be!” — is grounded in a fact stated as already true: “we who died to sin.” The question assumes sin is still your master; Paul says that assumption is simply false.'},
      {type:"p",html:'<strong>Beat 2 — the baptismal logic (vv.3–4).</strong> Paul appeals to something the Roman believers already know: baptism into Christ Jesus is baptism into His death. Being “buried with Him” through baptism has a purpose — “so that…we too might walk in newness of life.” Union with the crucified Christ is the ground; new obedience is the fruit, not the cause.'},
      {type:"p",html:'<strong>Beat 3 — the guarantee (v.5).</strong> “If we have become united with Him in the likeness of His death, certainly we shall also be in the likeness of His resurrection.” You cannot be joined to half of Christ — the same union that binds you to His death binds you just as surely to His risen life.'},
      {type:"p",html:'<strong>Beat 4 — the settled facts (vv.6–7).</strong> “Knowing this” introduces two facts the guarantee rests on: your old self was crucified with Him, so sin’s regime is broken (v.6); and death itself settles the account — “he who has died is freed from sin” (v.7), using the ordinary word for being declared righteous (see §4).'},
      {type:"callout",style:"oneline",label:"In one line",html:"question rejected (v.1–2) → because baptized into His death (v.3–4) → therefore resurrection is guaranteed (v.5) → because the old self already died and the verdict is in (v.6–7)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"we were buried with — synetaphēmen",parse:"aorist passive indicative, 1st plural, of synthaptō, “to bury together with” (v.4)",html:'A definite past event, done <em>to</em> the believer through baptism, not achieved by effort. Paul’s image moves from death (v.3) to burial (v.4) to a stated purpose — “so that we too might walk in newness of life” — before he ever gives a command. New obedience flows from a completed burial, not the reverse.'},
      {type:"word",term:"united with — symphytoi",parse:"nominative plural adjective; New Testament hapax legomenon (only occurrence) · from syn “together” + phyō “to grow” (v.5)",html:'Not glued on or clinging by effort, but organically grown together — the picture of a graft fused into the stock until the two share one life. Paul reaches for a living, vivid metaphor to describe how certain the resurrection side of this union is.'},
      {type:"word",term:"was crucified with [Him] — synestaurōthē",parse:"aorist passive indicative, 3rd singular, of synstauroō, “to crucify together with” (v.6)",html:'Another definite, completed past event, done to the old self rather than performed by the believer — the same root and tense-family as Galatians 2:20’s <em>synestaurōmai</em> (perfect passive, “I have been crucified with Christ”).'},
      {type:"word",term:"might be done away with — katargēthē",parse:"aorist subjunctive passive, 3rd singular, of katargeō, “to render idle, ineffective, deprived of ruling force” (v.6)",html:'Not “annihilated” — <em>katargeō</em> means put out of business, stripped of authority to rule. Sin’s regime over the old self has been broken; that indwelling sin still presents a fight is a separate matter (see Romans 7).'},
      {type:"word",term:"is freed / has been set free — dedikaiōtai",parse:"perfect indicative middle/passive, 3rd singular, of dikaioō, ordinarily “to justify, declare righteous” (v.7)",html:'The verb Paul uses everywhere else for justification. NASB1995 and ESV both render it “freed” / “set free” here (ESV even flags in a footnote that the Greek literally reads “has been justified”), reading it as a legal metaphor: death settles sin’s claim the way a verdict settles a case — the one who has died is discharged, acquitted of any further claim sin could bring.'},
      {type:"callout",style:"caution",label:"Honest caution — “freed” or “justified” in v.7?",html:'Both NASB1995 and ESV translate <em>dedikaiōtai</em> as “freed” / “set free” rather than the verb’s ordinary sense “justified,” and ESV notes the literal Greek in a footnote. Commentators generally read this as Paul extending the law-court language of justification into a death-and-discharge metaphor — sin’s legal claim on the one who has died is settled — rather than introducing a second, separate doctrine of justification. The wording is genuinely striking; the translations’ choice is a real interpretive judgment, honestly flagged rather than hidden.'},
      {type:"callout",style:"caution",label:"Honest caution — “likeness” of His death (v.5)",html:'Commentators debate what “the likeness (<em>homoiōma</em>) of His death” refers to: union with His actual death itself, or with a <em>representation</em> of it (many point to baptism, from vv.3–4). The main sense is secure — real union with the crucified-and-risen Christ — but exactly what “likeness” modifies is genuinely discussed.'},
      {type:"callout",style:"oneline",label:"In one line",html:"buried with Him (settled) → grown together, guaranteed (certain) → crucified with Him, sin’s rule broken (settled) → the claim discharged (settled) — all four verbs describe something done to you, not achieved by you."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But note the shape of what he says: identity-level change, described with a growth image, resting on a guaranteed future.'},
      {type:"list",style:"plain",items:[
        "<strong>Identity-level change is what actually holds.</strong> Behavior change pursued apart from a settled sense of who you now are tends to revert; a genuine shift in identity — “our old self was crucified” — provides a durable base for new patterns to form on top of it, rather than the patterns having to hold the identity up.",
        "<strong>Growth, not a switch.</strong> <em>Symphytos</em> — a graft fusing over time — pictures the resurrection-life side of this union as a gradual knitting-together, matching how durable change is actually laid down: slowly, by repeated connection, until the new becomes structural.",
        "<strong>A secured future reshapes present effort.</strong> A guaranteed good outcome lowers threat and frees energy for the present. Paul roots present obedience (“walk in newness of life,” v.4) in a <em>certain</em> future (“we shall also be,” v.5) and a finished past (vv.6–7) — hope here is a settled fact aimed forward, not a mood."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"You are not trying to become someone new through sheer effort — you already are someone new, and today’s obedience grows from that settled, guaranteed ground."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Something done to you, not by you.</strong> “Buried with Him,” “crucified with Him,” “freed” — every key verb in this passage is passive. None of it depended on your follow-through. For a brain already managing high cognitive load, that is real relief.'},
      {type:"p",html:'<strong>Not a status to re-earn.</strong> Because the old self’s death is a settled fact (aorist), a bad day does not undo it. This counters the shame spiral that can follow a stumble, especially for a mind prone to rejection-sensitive dysphoria.'},
      {type:"p",html:'<strong>Sin’s rule broken, not sin’s presence erased.</strong> <em>Katargeō</em>’s “rendered powerless” — not “eliminated” — is honest about ongoing struggle without feeding all-or-nothing thinking (“if I still struggle, nothing really changed”).'},
      {type:"p",html:'<strong>The ending is guaranteed — which quiets uncertainty.</strong> “We shall certainly also be” (v.5) removes the outcome from doubt. If future-uncertainty spikes your anxiety, this verse hands you a fixed point: the resurrection side is not in question.'},
      {type:"p",html:'<strong>Union is grown, not gripped.</strong> <em>Symphytos</em> means you are grafted in — fused, sharing one life with Christ. You are not holding on to God by the strength of today’s focus or willpower; you have been grown together with Him. On a scattered day, the graft still holds.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Say the settled fact aloud.</strong> Once today: “My old self was crucified with Christ; that already happened.”",
        "<strong>Picture the graft.</strong> Once today, picture yourself as a branch grown into a living vine — fused, sharing its life. Let it counter the felt need to “hold on tight” by effort.",
        "<strong>Name one ‘newness of life’ step.</strong> Choose one small, ordinary action today that belongs to the risen life (v.4) rather than the old pattern — and do just that one."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, I did not bury myself with You, and I did not crucify my own old self — You did that, in a union I did not have to achieve. Thank You that Your resurrection life is just as surely mine as Your death was; the ending is not in doubt, and the verdict is already in. When I feel sin’s pull, remind me its rule over me was broken, even while the daily fight continues. Grow me slowly into newness of life, and let today’s obedience rest on what is already finished. Amen.'}
    ]}
  ],
  oneThing:"Your old self was crucified with Christ and the claim is discharged — so sin no longer owns you, and His resurrection life is just as certainly yours.",
  sources:"Translations: NASB 1995, ESV. Greek text: Romans 6:1–7 (NA/UBS). Key words: synetaphēmen (aorist passive of synthaptō, v.4), symphytos (Strong’s 4854, NT hapax, v.5), synestaurōthē (aorist passive of synstauroō, v.6), katargēthē (aorist subjunctive passive of katargeō, v.6), dedikaiōtai (perfect middle/passive of dikaioō, v.7). Cross-references: Romans 6:8–14; 7:24; 8:3, 11; Galatians 2:20; 3:27; 5:24; 6:14; Philippians 2:7; 3:10–11; Colossians 2:12; 3:1, 9–10; 2 Corinthians 5:17; Ephesians 4:22, 24; 1 Peter 4:1; 2 Timothy 2:11. Commentators referenced: Cranfield (on “body of sin,” v.6). Contested points flagged, not resolved: whether dedikaiōtai (v.7) is best read as ordinary legal “justified” language applied metaphorically to death, or as a looser sense of “freed” (both NASB1995 and ESV render it “freed”/“set free,” with ESV footnoting the literal Greek); the referent of “likeness” (homoiōma) of His death in v.5 — union with the death itself, or with baptism as its representation; and whether the future “we shall be” (v.5) is chiefly the final bodily resurrection or an already-inaugurated newness of life. This study supersedes and merges the earlier standalone Romans 6:5 and Romans 6:6 studies, expanded to the full paragraph (Romans 6:1–7) per NASB1995/ESV paragraphing."
},
{
  id:"col3-1-4",
  reference:"Colossians 3:1–4",
  title:"Colossians 3:1–4",
  subtitle:"Raised with Christ, your life is hidden with Him now — and will be revealed in glory when He appears.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Union with Christ","Identity in Christ","Renewal of the Mind","Assurance & Security"],
  anchor:"Because you were raised with Christ, your life is now hidden safely with Him — so set your mind on Him now, and wait for the day His life, and yours, is revealed in glory.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">1</sup>Therefore if you have been raised up with Christ, keep seeking the things above, where Christ is, seated at the right hand of God. <sup class="vn">2</sup>Set your mind on the things above, not on the things that are on earth. <sup class="vn">3</sup>For you have died and your life is hidden with Christ in God. <sup class="vn">4</sup>When Christ, who is our life, is revealed, then you also will be revealed with Him in glory.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">1</sup>If then you have been raised with Christ, seek the things that are above, where Christ is, seated at the right hand of God. <sup class="vn">2</sup>Set your minds on things that are above, not on things that are on earth. <sup class="vn">3</sup>For you have died, and your life is hidden with Christ in God. <sup class="vn">4</sup>When Christ who is your life appears, then you also will appear with him in glory.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the hinge between “you died to the old way” and “put to death what remains”",blocks:[
      {type:"p",html:'Colossians 2 has just warned against submitting to man-made religious rules, on the ground that believers already died with Christ to the world’s elemental teachings (2:20) and were buried and raised with Him in baptism (2:12). Chapter 3 opens with “therefore” (<em>oun</em>) — everything that follows depends on that already-accomplished union.'},
      {type:"p",html:'This four-verse paragraph is the hinge of the letter: it grounds the ethical commands that follow at 3:5 (“put to death therefore what is earthly in you”) in a settled identity — raised, seeking, mind fixed above, life hidden, awaiting glory — before any instruction about behavior is given.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Before Paul tells the Colossians what to put to death (3:5), he grounds them in who they already are: raised with Christ, safely hidden, certain of glory."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"four beats: raised, minded, hidden, revealed",blocks:[
      {type:"p",html:'<strong>Beat 1 — the premise and its command (v.1).</strong> “Since you have been raised with Christ” states an accomplished fact (see the aorist in §4); on that basis comes a command — “keep seeking the things above, where Christ is.” The command is present tense: continuous, not a one-time act.'},
      {type:"p",html:'<strong>Beat 2 — the mind, not just the eyes (v.2).</strong> “Set your mind on the things above” sharpens “seeking” into something deeper — the whole cast of one’s thinking, not isolated glances upward.'},
      {type:"p",html:'<strong>Beat 3 — the reason (v.3).</strong> “For you have died and your life is hidden with Christ in God” explains <em>why</em> heavenly-mindedness makes sense: your true life is not on public display here — it is kept elsewhere.'},
      {type:"p",html:'<strong>Beat 4 — the future completion (v.4).</strong> “When Christ… is revealed, then you also will be revealed with Him in glory” promises that the hidden life does not stay hidden forever — it will be publicly disclosed, in the same moment and the same glory as Christ’s own appearing.'},
      {type:"callout",style:"oneline",label:"In one line",html:"raised (fact) → keep seeking / set the mind above (command) → because your life is hidden with Christ (reason) → and will be revealed in glory (certain future)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"you have been raised with — synēgerthēte",parse:"aorist passive indicative, 2nd plural, of synegeirō (v.1)",html:'A definite past event: God raised believers together with Christ — echoing 2:12, “buried with Him in baptism, in which you were also raised with Him.” Passive voice: something done <em>to</em> you, not an achievement of yours.'},
      {type:"word",term:"keep seeking — zēteite",parse:"present imperative active, 2nd plural, of zēteō (v.1)",html:'Present-tense imperative: a continuous, repeated command — “keep on seeking,” not “seek once.”'},
      {type:"word",term:"the things above / on earth — ta anō / ta epi tēs gēs",parse:"accusative neuter substantives; anō an adverb (“above/upward”), epi tēs gēs a prepositional phrase (vv.1–2)",html:'A spatial contrast used as a moral and orientational category. Paul is no dualist who treats earthly things as inherently evil (compare 1 Timothy 4:4, “everything created by God is good”) — the contrast is about where one’s center of gravity is fixed, not a rejection of the material world.'},
      {type:"word",term:"set your mind — phroneite",parse:"present imperative active, 2nd plural, of phroneō (v.2)",html:'Stronger than “seeking” — <em>phroneō</em> denotes a whole cast of mind or settled orientation, not isolated acts of attention. Paul uses the same verb in Philippians 2:5, “have this mind (<em>phroneite</em>) among yourselves which was also in Christ Jesus.”'},
      {type:"word",term:"you have died / is hidden — apethanete / kekryptai",parse:"aorist active indicative of apothnēskō / perfect passive indicative of kryptō (v.3)",html:'<em>Apethanete</em> is a definite past event — a finished chapter, not a process. <em>Kekryptai</em> is perfect passive: “has been hidden and remains hidden,” done by God — a treasure secured beyond reach, doubly located “with Christ” and “in God” (3:3).'},
      {type:"word",term:"is revealed / will be revealed — phanerōthē / phanerōthēsesthe",parse:"aorist subjunctive passive / future indicative passive, both of phaneroō, “to make visible, manifest” (v.4)",html:'The same verb applied to both Christ’s future appearing and believers’ future appearing. The hidden life of v.3 is not permanently concealed — it will be publicly disclosed at the same moment and in the same glory as Christ’s own revealing.'},
      {type:"callout",style:"caution",label:"Honest note — “your life” or “our life”? (v.4)",html:'A minor, well-known textual variant: some manuscripts read “our life,” others “your life” — NASB1995 follows the former, ESV’s main text the latter (with a footnote for the variant). The sense is unaffected either way — believers’ life is bound up with Christ’s.'},
      {type:"callout",style:"caution",label:"Honest note — “the things above”: realities, or Christ Himself?",html:'Commentators note some ambiguity in what exactly “the things above” refers to — future/eschatological realities in general, or Christ Himself specifically. The text roots the two together rather than forcing a choice: v.1 defines “above” as “where Christ is.”'},
      {type:"callout",style:"oneline",label:"In one line",html:"raised (settled fact) → keep seeking, set the mind (continuous commands) → died, hidden (settled facts) → will be revealed (certain future) — all four verbs of vv.3–4 describe things done <em>to</em> you or <em>for</em> you, not achievements of your own."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But note the order and shape of what he says: a secure base, followed by sustained, repeated attention-direction, aimed at a certain future.'},
      {type:"list",style:"plain",items:[
        "<strong>Security enables attention, not the reverse.</strong> A mind that feels safe can redirect its focus; a mind under threat defends. Paul grounds the commands to seek and set the mind above (vv.1–2) in an already-secured life (v.3) — safety comes first, then the attentional work.",
        "<strong>Repeated redirection is how a pattern forms.</strong> “Keep seeking” and “set your mind” are both present-tense, ongoing commands — sustained, repeated re-aiming of attention, not a single decisive glance, is what actually reshapes a settled orientation over time.",
        "<strong>A certain, positive future changes what the present feels safe to do.</strong> Verse 4’s guaranteed outcome — “you also will be revealed with Him in glory” — gives the mind a fixed, positive point to organize around, which lowers the pull toward anxious threat-scanning about how things will turn out."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 12:2 — “be transformed by the renewing of your mind” — the same pattern: a secure identity underneath, repeated re-aiming of attention on top."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>“Keep seeking” and “set your mind” are repeated, not one-time.</strong> These are present-tense commands you return to again and again, not achievements you either nail or fail. A scattered day doesn’t disqualify tomorrow’s attempt.'},
      {type:"p",html:'<strong>Your real life is not the performance on display.</strong> Verse 3 relocates your true life off the stage — hidden with Christ in God. For a mind sensitive to evaluation or rejection, that is real relief: the watched, graded self is not where your life actually is.'},
      {type:"p",html:'<strong>Something concrete to do with today’s attention.</strong> Unlike an abstract call to “be spiritually minded,” verses 1–2 point attention toward a person — “where Christ is” — which is easier for concrete-oriented thinking to hold onto than a vague virtue.'},
      {type:"p",html:'<strong>A fixed, certain future to return to.</strong> Verse 4’s promise — you will be revealed with Him in glory — is a stable anchor point for a mind that tends toward catastrophizing about how an uncertain situation will end.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name one “thing above” today.</strong> A truth, a promise, or Christ Himself — fix your attention on it for one deliberate moment, practicing v.2 small.",
        "<strong>Relocate your life when you feel exposed.</strong> Say once: “My real life is hidden with Christ — safe, not on display.”",
        "<strong>Picture the certainty of v.4.</strong> You will be revealed with Him in glory — let that fixed point steady a shaky day."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, You raised me with Christ before I felt strong enough to seek You on my own; today, keep turning my mind toward the things above — toward Christ Himself, where my true life is hidden and safe with You. When I am tempted to measure myself only by what is visible today, remind me: the hidden life You have given me will be revealed in glory, with Him, on that day. Until then, keep my mind fixed where He is. Amen.'}
    ]}
  ],
  oneThing:"Your life is not what’s on display today — it is hidden with Christ now, and will be revealed in glory when He is; until then, keep your mind fixed on Him.",
  sources:"Translations: NASB 1995, ESV. Greek text: Colossians 3:1–4 (NA/UBS). Key words: synēgerthēte (aorist passive of synegeirō), zēteite (present imperative of zēteō), phroneite (present imperative of phroneō), apethanete (aorist of apothnēskō), kekryptai (perfect passive of kryptō), phaneroō (aorist subjunctive passive / future passive, v.4). Cross-references: Colossians 2:12, 2:20; Romans 12:2; Philippians 2:5; 3:20–21; 1 John 3:2; 1 Timothy 4:4; Galatians 2:20; Romans 6:5, 8; 2 Corinthians 5:17. Textual note flagged, not resolved: v.4’s “your life” (ESV main text) vs. “our life” (NASB1995, and an ESV-noted manuscript variant) — sense unaffected. Interpretive note flagged, not resolved: whether “the things above” (vv.1–2) denotes future/eschatological realities, Christ Himself, or both — the text roots them together by defining “above” as “where Christ is” (v.1). Note: this study supersedes the earlier single-verse Colossians 3:3 study, expanded to its full paragraph (3:1–4) per NASB1995/ESV paragraphing, as a test of a paragraph-level study format."
},
{
  id:"1co6-17",
  reference:"1 Corinthians 6:12–20",
  title:"1 Corinthians 6:12–20",
  subtitle:"Your body is a temple of the Holy Spirit, joined to the Lord as one spirit with Him — bought at a price, so glorify God in it.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Union with Christ","Life in the Spirit","Sanctification & Holiness","Identity in Christ"],
  anchor:"Your body was bought at a price and is now a temple of the Holy Spirit, joined to the Lord as one spirit with Him — a union so real, and so bodily, that it reaches all the way into what you do with the body you have, and calls you to glorify God in it.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">12</sup>All things are lawful for me, but not all things are profitable. All things are lawful for me, but I will not be mastered by anything. <sup class="vn">13</sup>Food is for the stomach and the stomach is for food, but God will do away with both of them. Yet the body is not for immorality, but for the Lord, and the Lord is for the body. <sup class="vn">14</sup>Now God has not only raised the Lord, but will also raise us up through His power. <sup class="vn">15</sup>Do you not know that your bodies are members of Christ? Shall I then take away the members of Christ and make them members of a prostitute? May it never be! <sup class="vn">16</sup>Or do you not know that the one who joins himself to a prostitute is one body with her? For He says, “The two shall become one flesh.” <sup class="vn">17</sup>But the one who joins himself to the Lord is one spirit with Him. <sup class="vn">18</sup>Flee immorality. Every other sin that a man commits is outside the body, but the immoral man sins against his own body. <sup class="vn">19</sup>Or do you not know that your body is a temple of the Holy Spirit who is in you, whom you have from God, and that you are not your own? <sup class="vn">20</sup>For you have been bought with a price: therefore glorify God in your body.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">12</sup>“All things are lawful for me,” but not all things are helpful. “All things are lawful for me,” but I will not be dominated by anything. <sup class="vn">13</sup>“Food is meant for the stomach and the stomach for food”—and God will destroy both one and the other. The body is not meant for sexual immorality, but for the Lord, and the Lord for the body. <sup class="vn">14</sup>And God raised the Lord and will also raise us up by his power. <sup class="vn">15</sup>Do you not know that your bodies are members of Christ? Shall I then take the members of Christ and make them members of a prostitute? Never! <sup class="vn">16</sup>Or do you not know that he who is joined to a prostitute becomes one body with her? For, as it is written, “The two will become one flesh.” <sup class="vn">17</sup>But he who is joined to the Lord becomes one spirit with him. <sup class="vn">18</sup>Flee from sexual immorality. Every other sin a person commits is outside the body, but the sexually immoral person sins against his own body. <sup class="vn">19</sup>Or do you not know that your body is a temple of the Holy Spirit within you, whom you have from God? You are not your own, <sup class="vn">20</sup>for you were bought with a price. So glorify God in your body.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"a fight about the body",blocks:[
      {type:"p",html:'In 1 Corinthians 6:12–20 Paul confronts sexual immorality (<em>porneia</em>) among the Corinthians, likely responding to a slogan some in the church were using to justify it: “all things are lawful for me” (v.12, repeated twice, and printed in quotation marks in the ESV as a probable Corinthian catchphrase). Paul does not reject the slogan outright — he qualifies it twice, with “not… helpful” and “I will not be dominated.”'},
      {type:"p",html:'He then dismantles a second piece of Corinthian reasoning: if food and stomach are made for each other and both are temporary (v.13a), perhaps the body and its appetites work the same way — bodily acts are just physical, morally neutral. Paul flatly denies the analogy: “the body is not meant for sexual immorality, but for the Lord, and the Lord for the body” (v.13b). The body matters permanently, because it is destined for resurrection (v.14), already joined to Christ (v.15), and — as the passage climaxes — inhabited by the Holy Spirit Himself (v.19).'},
      {type:"p",html:'The argument builds in two matched movements: vv.15–17 argue from union (whose “one body” or “one spirit” are you?), and vv.18–20 argue from indwelling and ownership (whose temple, whose property, is your body?). Both movements land on the same command: glorify God in the body — not despite it, and not by escaping it.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Because your body is joined to the Lord and indwelt by His Spirit, it is not neutral territory or temporary scaffolding — it is bought, inhabited, and meant for God’s glory."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"a slogan qualified, a union claimed, a temple named",blocks:[
      {type:"p",html:'<strong>Beat 1 — the slogan, qualified twice (v.12).</strong> “All things are lawful for me” is met not with denial but with two limits: not everything is helpful, and Paul will not let anything master him — the verb (see §4) pictures being enslaved by what one claims to have mastered.'},
      {type:"p",html:'<strong>Beat 2 — a false analogy rejected (vv.13–14).</strong> Food-and-stomach is a temporary, morally neutral pairing, both destined to be “done away with.” The body-and-Lord pairing is not like that: the body is “for the Lord,” and it will be raised, not discarded — God’s own resurrection power guarantees it (v.14, echoing 1 Corinthians 15).'},
      {type:"p",html:'<strong>Beat 3 — the foil: one flesh with a prostitute (vv.15–16).</strong> A real, bodily union is formed by the act itself, grounded in Genesis 2:24’s “one flesh” — Paul’s point is that this union actually happens, whether or not it is acknowledged.'},
      {type:"p",html:'<strong>Beat 4 — the claim: one spirit with the Lord (v.17).</strong> Same verb of joining, higher union — not one flesh but one spirit. This is the deeper union already claiming the body before any lesser union is chosen.'},
      {type:"p",html:'<strong>Beat 5 — the command: flee (v.18).</strong> Not fight, negotiate, or reason with — flee. Sexual sin is framed as uniquely against one’s own body, in a way other sins (committed “outside the body”) are not.'},
      {type:"p",html:'<strong>Beat 6 — the climax: temple, ownership, price (vv.19–20).</strong> Your body is a sanctuary of the Holy Spirit, who is <em>in</em> you; you are not your own; you were bought at a price. The paragraph’s whole argument culminates here and issues in a single command: glorify God in your body.'},
      {type:"callout",style:"oneline",label:"In one line",html:"a slogan qualified (v.12) → a false analogy rejected because the body is raised, not discarded (vv.13–14) → one flesh with immorality versus one spirit with the Lord (vv.15–17) → flee (v.18) → your body is the Spirit’s temple, bought and owned — so glorify God in it (vv.19–20)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"mastered / dominated — exousiasthēsomai",parse:"future passive indicative, 1st singular, of exousiazō (v.12)",html:'From the same root as <em>exousia</em>, “authority” — to be brought under someone or something’s ruling power. Paul takes the Corinthian freedom-slogan and turns it back on itself: everything may be permissible, but he refuses to let any permitted thing become his master. Freedom that enslaves is not freedom.'},
      {type:"word",term:"body — sōma",parse:"appears repeatedly, vv.13, 15, 18, 19, 20 (nominative/accusative singular)",html:'Paul’s anthropology here is not dualist — the body is not a disposable shell for the “real,” spiritual self. It is “for the Lord” (v.13), a member of Christ (v.15), a temple of the Spirit (v.19), and the site where God is to be glorified (v.20). The body is included in redemption, not escaped from it.'},
      {type:"word",term:"joins himself — kollōmenos",parse:"present participle of kollaō, middle/passive with reflexive force (v.16, and again v.17)",html:'The picture word: <em>kollaō</em> means to <strong>glue, bind, cleave</strong> (from <em>kolla</em>, glue). It is the same verb the Greek Old Testament uses for a man who “cleaves” to his wife (Genesis 2:24) and for Israel called to “hold fast / cleave to the LORD” (Deuteronomy 10:20). The <em>present</em> tense pictures an ongoing, clinging union, not a one-time act — used first of the union with a prostitute (v.16), then, deliberately, of union with the Lord (v.17).'},
      {type:"word",term:"one spirit — hen pneuma",parse:"“one spirit,” set against “one flesh/body” in v.16 (v.17)",html:'The climax of the first movement. Where joining to immorality makes “one flesh,” joining to the Lord makes “one spirit” — a union of the deepest kind. It deliberately out-weighs the bodily union it is contrasted with.'},
      {type:"word",term:"flee — pheugete",parse:"present active imperative, 2nd plural, of pheugō (v.18)",html:'A command to <strong>run away</strong>, not stand and fight. The present tense pictures an ongoing practice — make a habit of fleeing — rather than a single decision made once. Paul gives the same instruction to Timothy about youthful passions (2 Timothy 2:22): flee, and pursue righteousness instead. Some sins are resisted; this one is fled.'},
      {type:"word",term:"temple — naos",parse:"nominative singular of naos (v.19)",html:'Greek distinguishes <em>naos</em>, the inner sanctuary itself — the Holy of Holies, the dwelling place of the deity — from <em>hieron</em>, the whole temple precinct including its outer courts. Paul chooses the more intimate word: your body is not the outer courtyard but the inner sanctuary where the Holy Spirit dwells. He uses the same word, <em>naos</em>, of the church corporately in 1 Corinthians 3:16 — here it is personal and individual as well.'},
      {type:"word",term:"bought with a price — ēgorasthēte timēs",parse:"ēgorasthēte: aorist passive indicative, 2nd plural, of agorazō, “to buy in the marketplace” (v.20)",html:'Marketplace and slave-purchase language. The aorist marks a completed transaction; the passive voice means it was done <em>to</em> you, by another — you did not purchase yourself. The image evokes the ancient practice of a slave being bought and thereby transferred to a new owner’s possession.'},
      {type:"word",term:"glorify — doxasate",parse:"aorist active imperative, 2nd plural, of doxazō (v.20)",html:'The command that the whole paragraph has been building toward. The aorist imperative here calls for a decisive, summary response — do this — rather than framing glorifying God as one option among several. It answers the argument of vv.12–19 with a single, concrete charge.'},
      {type:"callout",style:"caution",label:"Honest caution 1 — “one spirit” or “one Spirit”?",html:'Interpreters differ on <em>pneuma</em> in v.17: (a) the <strong>Holy Spirit</strong> — you are united to the Lord <em>in / by</em> the one Spirit (note v.19, “your body is a temple of the Holy Spirit”; and 1 Corinthians 12:13); or (b) a description of the <strong>nature</strong> of the union — “spiritual,” contrasted with the “one flesh” of v.16. Standard translations print lowercase “spirit”; the two senses are not far apart, and the text does not force a choice.'},
      {type:"callout",style:"caution",label:"Honest caution 2 — “joins himself” or “is joined”?",html:'<em>Kollōmenos</em> is middle/passive in form. Lexicons note it is used with <strong>reflexive force</strong> (“join oneself, cleave to”), which is why most English versions read “joins himself.” A passive sense (“is joined” — God joins you) is grammatically possible. Either way the union is real; the nuance is whether the stress falls on your clinging or on His joining.'},
      {type:"callout",style:"oneline",label:"In one line",html:"not mastered by anything (exousiasthēsomai) — cleaved to the Lord, one spirit with Him (kollaō, hen pneuma) — flee, don’t fight (pheugete) — the body is the Spirit’s inner sanctuary (naos), bought (ēgorasthēte) and owed glory (doxasate)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'This passage is about <strong>what you bind yourself to</strong> — attachment — and Paul assumes that what we cleave to shapes us, body and all.'},
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But the shape of it rings true:'},
      {type:"list",style:"plain",items:[
        "<strong>Attachment forms the self.</strong> What we repeatedly bind ourselves to — the relationships and objects we cleave to — shapes identity and behavior over time. The brain is built for attachment; where the attachment goes, formation follows.",
        "<strong>Cleaving is ongoing (present tense).</strong> Scripture frames union with God as a continual holding-fast: “cleave to the LORD” (Deuteronomy 10:20). The bond is real, and it is also renewed by repeatedly turning toward Him — the same directed, repeated attention behind lasting change.",
        "<strong>Fleeing, not fighting, is sometimes the wiser strategy for the mind, too.</strong> Paul’s present-tense command to flee (v.18) matches what is often true of ingrained temptation patterns: removing yourself from the trigger is frequently more effective, and more sustainable, than white-knuckled resistance in place."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"You are shaped by what you cleave to and by what you place yourself near; joined to the Lord and indwelt by His Spirit, the deepest bond is already yours — kept by ongoing turning toward Him, and protected by fleeing what threatens it."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Belonging, not performance.</strong> “One spirit with Him” is a bond, not a grade. If you often feel othered, disconnected, or like you have to earn your place, this passage names a union already true of you — you are <em>glued</em> to the Lord, not clinging by the strength of a good day.'},
      {type:"p",html:'<strong>Your body is included, and that is good news.</strong> This passage is emphatically physical — members of Christ, a temple, “glorify God in your body” (v.20). For a concrete, embodied thinker, faith is not an abstraction floating above the body; it is lived <em>in</em> the body you actually have (cf. Romans 12:1, “present your bodies”).'},
      {type:"p",html:'<strong>Your worth was set from outside you.</strong> “You were bought with a price” (v.20). Your value is not something your output has to keep proving; it was established by what Christ paid — fixed, not fluctuating.'},
      {type:"p",html:'<strong>Flee is a permission, not a failure.</strong> The command in v.18 is to remove yourself, not to white-knuckle it out through sheer willpower. For a mind that runs out of resistance capacity fast, “flee” is honest, practical instruction — leaving the situation counts as obedience, not as giving up.'},
      {type:"p",html:'<strong>Cleaving is a repeatable act.</strong> The present tense means the joining is not a single heroic moment but an ongoing turning-toward. On a scattered day, you can still do the small thing: cleave again, now.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name the bond.</strong> Once today, say: “I am joined to the Lord — one spirit with Him.” Let it answer a moment of feeling disconnected or unworthy.",
        "<strong>Honor the body.</strong> Following v.20, choose one bodily act today (rest, food, a walk, restraint) done consciously as someone whose body belongs to Christ — worship, not performance.",
        "<strong>Practice fleeing, not fighting.</strong> Identify one concrete trigger you could simply remove yourself from today, and treat leaving it as the whole win — no negotiation required."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, I am joined to You — one spirit with You — and even my body belongs to You, bought at a price I did not pay. Thank You that You did not just forgive me and leave, but made my body Your temple, Your Spirit’s home. When I feel disconnected or like I must earn my place, remind me that the bond is already real. When I am tempted, give me the honesty to flee rather than negotiate. Teach me to cleave to You again and again through this ordinary day, and to glorify You in the body You have made Your own. Amen.'}
    ]}
  ],
