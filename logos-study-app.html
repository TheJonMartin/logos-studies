  oneThing:"Your body is a temple of the Holy Spirit and you are <em>glued</em> to the Lord — one spirit with Him — bought at a price and belonging to Him; today, simply cleave again, and glorify God in the body you have.",
  sources:"Translations: NASB 1995, ESV. Greek text: 1 Corinthians 6:12–20 (NA/UBS). Key words: exousiasthēsomai (future passive indicative of exousiazō, v.12), sōma (v.13,15,18,19,20), kollōmenos (present middle/passive participle of kollaō, vv.16–17, echoing Genesis 2:24 and Deuteronomy 10:20 LXX), hen pneuma (v.17), pheugete (present active imperative of pheugō, v.18), naos (v.19), ēgorasthēte (aorist passive indicative of agorazō, v.20), doxasate (aorist active imperative of doxazō, v.20). Cross-references: Genesis 2:24; Deuteronomy 10:20; 1 Corinthians 3:16; 12:13; 15; 2 Timothy 2:22; John 17:21–23; Romans 8:9–11; 12:1; Galatians 2:20; Colossians 3:3; Romans 6:5. Contested points flagged, not resolved: whether “one spirit” (v.17) denotes the Holy Spirit or the spiritual nature of the union, and whether kollōmenos is reflexive (“joins himself”) or passive (“is joined”)."
},
{
  id:"luke9-23",
  reference:"Luke 9:23",
  title:"Luke 9:23",
  subtitle:"Deny yourself, take up your cross daily, and follow Him — discipleship as a repeated, ordinary-day choice.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Discipleship & Following Jesus","Suffering & Endurance","Sanctification & Holiness"],
  anchor:"Following Jesus means daily, deliberate self-denial and cross-bearing — not a single decision made once, but an ordinary choice made again today.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">23</sup>And He was saying to them all, “If anyone wishes to come after Me, he must deny himself, and take up his cross daily and follow Me.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">23</sup>And he said to all, “If anyone would come after me, let him deny himself and take up his cross daily and follow me.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"right after Jesus names His own cross",blocks:[
      {type:"p",html:'This saying immediately follows Peter’s confession (9:18–20) and Jesus’ first passion prediction: “The Son of Man must suffer many things… and be killed, and on the third day be raised” (9:21–22). Having just named His own coming suffering, Jesus turns “to them all” — Luke notes a wider crowd, not only the Twelve — and says that following Him means walking the same shape of life.'},
      {type:"p",html:'The Matthean and Markan parallels (Matthew 16:24; Mark 8:34) record the same saying without one word Luke alone includes: “daily” (see §4). Genre note: this is Gospel narrative — the movement below traces the pericope’s internal logic rather than a doctrinal argument.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Right after Jesus names His own cross, He tells the crowd that following Him means taking up the same shape of life — and Luke alone makes it a daily rhythm."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"one decisive turn, one daily rhythm",blocks:[
      {type:"p",html:'<strong>The condition:</strong> “if anyone wishes to come after Me” — an open invitation resting on genuine desire, not coercion.'},
      {type:"p",html:'<strong>Deny himself</strong> — a decisive act of renunciation (aorist imperative; see §4): disowning self-rule and self-preservation as governing authority.'},
      {type:"p",html:'<strong>Take up his cross daily</strong> — also a decisive act grammatically, but modified by “daily”: repeated, not performed once.'},
      {type:"p",html:'<strong>Follow Me</strong> — a present-tense imperative: continuous, ongoing accompaniment.'},
      {type:"callout",style:"oneline",label:"In one line",html:"deny (once, decisively) → take up the cross (daily, repeatedly) → follow (continuously) — a settled reorientation lived out in daily practice."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"let him deny — arnēsasthō heauton",parse:"aorist imperative middle, 3rd singular, of arneomai + reflexive pronoun (v.23)",html:'The same verb family Luke later uses of Peter’s denial of Jesus (<em>arnēsē</em>, Luke 22:34) — a deliberate irony: disciples must “deny” (disown) themselves the way Peter will wrongly “deny” Jesus. To deny oneself is to disown self-rule and self-preservation as the governing authority over one’s life, not merely to give up a habit.'},
      {type:"word",term:"let him take up his cross — aratō ton stauron autou",parse:"aorist imperative active, 3rd singular, of airō + accusative stauron (v.23)",html:'To hearers before the crucifixion, “take up your cross” evoked the Roman practice of the condemned carrying the crossbeam to execution — a vivid image of public shame and death, not private inconvenience. Later devotional use sometimes flattens “my cross to bear” into any burden; the text’s original resonance is death to self and willingness to suffer for Christ, even to the point of literal death.'},
      {type:"word",term:"daily — kath’ hēmeran",parse:"prepositional phrase, kata + accusative hēmeran, distributive “every day” (v.23)",html:'Unique to Luke among the Synoptic parallels — Matthew 16:24 and Mark 8:34 record the saying without it. It turns a singular, dramatic act into an everyday posture. This is a genuine textual observation worth flagging rather than over-explaining: Luke does not state why he alone includes it, though it fits his broader interest in ongoing, daily discipleship (compare Acts 2:46–47; 17:11).'},
      {type:"word",term:"let him follow — akoloutheitō moi",parse:"present imperative active, 3rd singular, of akoloutheō (v.23)",html:'Present tense pictures continuous, ongoing accompaniment — “keep following,” not “follow this one time.”'},
      {type:"callout",style:"caution",label:"Honest caution — Luke’s “daily” is a real textual difference",html:'This is not a resolvable theological debate so much as an honest observation: Matthew and Mark’s parallel accounts of this saying do not include “daily.” Luke’s addition is worth noting precisely, without over-claiming a settled explanation for why he alone records it.'},
      {type:"callout",style:"oneline",label:"In one line",html:"deny (arnēsasthō, decisive) + take up the cross daily (kath’ hēmeran, repeated, Luke’s addition) + keep following (akoloutheitō, continuous)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Jesus did not teach with modern neuroscience in view, and this study claims no such thing. But note what “daily” does: it turns a dramatic, once-for-all decision into a repeated practice.'},
      {type:"list",style:"plain",items:[
        "<strong>Repetition is how durable change is actually formed.</strong> A single decisive commitment (“deny himself”) sets a direction; it is the daily repetition (“take up his cross daily”) that forms a pattern into something lived, over time, rather than a memory of one dramatic moment.",
        "<strong>Small, repeated acts outlast a single big resolve.</strong> The grammar itself models this: an aorist “decide” alongside a distributive “every day” — decision plus rhythm, not decision alone."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"You don’t need one perfect, permanent breakthrough — you need today’s cross, taken up again, and Jesus built that expectation into the words themselves."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Daily, not once-for-all-and-done.</strong> This relieves the pressure of needing one dramatic spiritual breakthrough; discipleship in this text is compatible with needing to “start over” each day, which fits an AuDHD relationship with routine and relapse.'},
      {type:"p",html:'<strong>A concrete, embodied image.</strong> A cross to carry is tangible in a way that abstract willpower language is not — AuDHD minds often engage better with a specific picture than with a vague virtue demand.'},
      {type:"p",html:'<strong>Invitation, not coercion.</strong> “If anyone wishes” — the condition is genuine desire, which can reduce the demand-avoidance response that heavy imperative language sometimes triggers.'},
      {type:"p",html:'<strong>Repetition-as-mechanism.</strong> “Daily” matches how an AuDHD brain often needs external, rhythmic structure to sustain change, rather than relying on a single burst of sustained willpower.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name one small self-denial today.</strong> One preference set aside for someone else — small and specific, not a whole-life resolution.",
        "<strong>Before today’s hardest moment, say once:</strong> “This is today’s cross; I take it up and follow.”",
        "<strong>At day’s end, don’t audit the whole day.</strong> Just ask whether you followed Him in one moment — and let that be enough."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, You did not ask for one dramatic decision and call it finished — You asked for today, and tomorrow, and the day after. I deny myself, imperfectly, and take up whatever this day asks of me, and I follow You in it. When yesterday’s failure or tomorrow’s uncertainty presses in, remind me that today’s cross is enough for today. Amen.'}
    ]}
  ],
  oneThing:"Following Jesus is not a single decision made once — it is a cross taken up again today, and again tomorrow.",
  sources:"Translations: NASB 1995, ESV. Greek text: Luke 9:23 (NA/UBS). Key words: arnēsasthō (aorist imperative middle of arneomai), aratō (aorist imperative active of airō), kath’ hēmeran (distributive “daily,” unique to Luke among the Synoptic parallels), akoloutheitō (present imperative active of akoloutheō). Cross-references: Matthew 10:38; 16:24–25; Mark 8:34–35; Luke 14:27; 22:34; Acts 2:46–47; 17:11; 2 Corinthians 4:16. Noted, not resolved as a theological debate: Luke’s inclusion of “daily” is absent from the Matthean and Markan parallels of this saying."
},
{
  id:"rom8-13",
  reference:"Romans 8:13",
  title:"Romans 8:13",
  subtitle:"By the Spirit’s power, not your own, put today’s sinful pattern to death — ongoing evidence of life, not a performance test.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Life in the Spirit","Sanctification & Holiness","Freedom from Sin"],
  anchor:"Living according to the flesh leads to death; but putting sin’s deeds to death by the Spirit’s power leads to life — the ongoing shape of a life headed toward life, not a performance test.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">13</sup>for if you are living according to the flesh, you must die; but if by the Spirit you are putting to death the deeds of the body, you will live.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">13</sup>For if you live according to the flesh you will die, but if by the Spirit you put to death the deeds of the body, you will live.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"where indicative becomes imperative",blocks:[
      {type:"p",html:'Romans 8 opens with “no condemnation” (8:1), grounded in the Spirit’s liberating work (8:2). Verses 5–11 contrast flesh-minded and Spirit-minded existence at length; verse 12 draws the inference — “we are debtors — not to the flesh, to live according to the flesh.” Verse 13 states the stakes in the starkest possible terms: two paths, two outcomes.'},
      {type:"p",html:'It sits at the hinge between indicative (who you are in the Spirit, vv.1–11) and imperative (what that requires, v.13’s “you put to death”).'},
      {type:"callout",style:"oneline",label:"In one line",html:"Everything Paul has just said about life in the Spirit comes to a point here: an ongoing, Spirit-empowered war against the body’s sinful deeds, with life riding on it."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"two conditions, two outcomes",blocks:[
      {type:"p",html:'<strong>First conditional:</strong> “if you are living according to the flesh, you must die” — present-tense living on a trajectory toward death (see <em>mellete</em> in §4).'},
      {type:"p",html:'<strong>Contrast:</strong> “but if by the Spirit…” — same conditional structure, opposite means and outcome.'},
      {type:"p",html:'<strong>Means:</strong> “by the Spirit” (<em>pneumati</em>) — the Holy Spirit named as the acting agent, not human willpower operating alone.'},
      {type:"p",html:'<strong>Action:</strong> “you are putting to death the deeds of the body” — present tense, ongoing, an active campaign rather than passive waiting.'},
      {type:"p",html:'<strong>Result:</strong> “you will live” — a certain future.'},
      {type:"callout",style:"oneline",label:"In one line",html:"flesh-walking trends toward death (inevitable); Spirit-empowered, ongoing mortification of the body’s deeds trends toward life (certain)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"you must die — mellete apothnēskein",parse:"present active indicative of mellō (“about to”) + present infinitive of apothnēskō (v.13)",html:'<em>Mellō</em> + infinitive often signals a settled, impending outcome — not merely “someday,” but the trajectory that flesh-living is already on.'},
      {type:"word",term:"by the Spirit — pneumati",parse:"dative singular, instrumental (v.13)",html:'Names the Holy Spirit as the empowering means of what follows — not self-generated effort. Ties directly to 8:9–11’s repeated language of the Spirit dwelling in believers.'},
      {type:"word",term:"you put to death — thanatoute",parse:"present active indicative, 2nd plural, of thanatoō (v.13)",html:'Present tense: continuous, ongoing action — not a once-for-all event. This is the key grammatical contrast with Romans 6:6’s <em>synestaurōthē</em> (aorist passive, “was crucified,” a completed past event). Read together: 6:6 states the old self’s crucifixion is already accomplished; 8:13 commands ongoing, Spirit-empowered killing of specific deeds that still arise. Both are true — the classic “already / not yet” shape of Pauline sanctification, not a contradiction.'},
      {type:"word",term:"the deeds of the body — tas praxeis tou sōmatos",parse:"accusative plural (praxeis) + genitive singular (sōmatos) (v.13)",html:'“Deeds” (<em>praxeis</em>) are concrete, particular actions flowing from unredeemed patterns still active “in the body” — not the body itself as evil. Paul is no dualist here; compare Romans 12:1’s offering of the body as a “living sacrifice.”'},
      {type:"word",term:"you will live — zēsesthe",parse:"future middle indicative of zaō (v.13)",html:'A certain future consequence, completing the “you will live” trajectory already begun by the Spirit’s indwelling described in 8:11.'},
      {type:"callout",style:"caution",label:"Honest caution — what does “you must die” imply?",html:'A genuine, longstanding debate: some read this verse as a real warning that a truly regenerate person could, through persistent unrepentant flesh-living, forfeit final salvation. Others — in the tradition associated with Cranfield, Moo, and Schreiner — read it as descriptive: it states the necessary link between genuine Spirit-indwelling and a life that increasingly puts sin to death, functioning as one of the means God uses to keep His own, not a live possibility that a truly regenerate person ends in death. NASB and ESV render the underlying Greek similarly; the theological conclusion drawn from it is contested and not resolved here.'},
      {type:"callout",style:"oneline",label:"In one line",html:"living by the flesh trends to death (mellete); Spirit-empowered, ongoing killing (thanatoute, present tense) of the body’s deeds trends to certain life (zēsesthe)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But note the present-tense, repeated-action verb <em>thanatoute</em>: mortification is pictured as ongoing, active work — not a single event.'},
      {type:"list",style:"plain",items:[
        "<strong>Ingrained patterns are unwound through repeated, deliberate counter-action over time</strong> — which is exactly the present-tense shape of “you put to death” here, not a one-time act.",
        "<strong>The power named is external to the self.</strong> “By the Spirit” locates the acting agent outside human willpower, which matches how sustained change tends to outlast a person’s own depletable resolve."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 12:2 — “be transformed by the renewing of your mind” — an ongoing process, Spirit-enabled, not self-generated."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Ongoing, not one-and-done.</strong> The present tense <em>thanatoute</em> means today’s failure doesn’t erase yesterday’s progress or disqualify tomorrow’s effort — this is a war fought daily, which matches an AuDHD brain’s relationship with inconsistency.'},
      {type:"p",html:'<strong>Spirit-empowered, not willpower-dependent.</strong> “By the Spirit” relocates the source of power outside depleted executive function — real relief for a brain that runs out of self-regulation capacity by midday.'},
      {type:"p",html:'<strong>Specific, not vague.</strong> “Deeds” (<em>praxeis</em>) names concrete actions — something small and nameable to target, rather than an overwhelming, abstract demand to “be better.”'},
      {type:"p",html:'<strong>Framed relationally, not as a performance grade.</strong> Life versus death, Spirit versus flesh — this reduces the all-or-nothing, rejection-sensitive reading of the verse as “I must perform perfectly or I’m condemned.”'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name one specific deed today</strong> — not a vague category — and ask the Spirit’s help to set it aside once.",
        "<strong>When you fail today, say:</strong> “The Spirit’s work in me is ongoing, not undone by this.”",
        "<strong>Pair this with Romans 6:6.</strong> Rest in what’s already true (old self crucified) before you act on what’s still asked (put to death today’s deed)."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Spirit of God, by Your power and not my own, I put today’s pattern to death. I cannot manufacture this by willpower, and You have not asked me to. When I fail, remind me this is ongoing work, not a single test I have already lost. Lead me toward life — not by my performance, but by Your presence in me. Amen.'}
    ]}
  ],
  oneThing:"By the Spirit’s power, not your own, put today’s sinful pattern to death — this is the ongoing shape of a life headed toward life, not a performance test.",
  sources:"Translations: NASB 1995, ESV. Greek text: Romans 8:13 (NA/UBS). Key words: mellete apothnēskein, pneumati (instrumental dative), thanatoute (present active indicative of thanatoō), praxeis tou sōmatos, zēsesthe. Cross-references: Romans 8:1–2, 6, 9–11; 6:6; 12:1–2; Galatians 5:16–17, 24; Colossians 3:5. Commentators referenced regarding the perseverance/warning debate: Cranfield, Moo, Schreiner. Contested point flagged, not resolved: whether v.13’s “you must die” implies a genuine possibility of a believer’s apostasy or describes the necessary evidence of true Spirit-indwelling."
},
{
  id:"phil1-21",
  reference:"Philippians 1:21",
  title:"Philippians 1:21",
  subtitle:"For Paul, ordinary life and death both belong to Christ — living means Christ is his whole substance, and dying only brings more of what he already has.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Purpose & Mission","Suffering & Endurance","Assurance & Security"],
  anchor:"For Paul, ordinary life and death both belong to Christ — living means Christ is his whole substance, and dying only brings more of what he already has.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">21</sup>For to me, to live is Christ and to die is gain.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">21</sup>For to me to live is Christ, and to die is gain.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"a prisoner weighing life and death",blocks:[
      {type:"p",html:'Philippians 1 finds Paul imprisoned (1:12–14), uncertain whether his trial will end in release or execution (1:19–20), and determined that Christ will be honored “whether by life or by death” (1:20). Verse 21 is the compressed, memorable summary of that resolve.'},
      {type:"p",html:'It is followed immediately by Paul actually weighing the two options — continued ministry versus being with Christ (1:22–24) — and concluding that remaining is more necessary for the Philippians’ sake (1:24–25).'},
      {type:"callout",style:"oneline",label:"In one line",html:"Facing possible execution, Paul states the conviction that governs both outcomes: living or dying, Christ is what he has."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"the logic of an unusual equation",blocks:[
      {type:"p",html:'<strong>“For” (gar)</strong> grounds verse 20’s confidence that Christ will be exalted in Paul’s body “whether by life or by death.”'},
      {type:"p",html:'<strong>“To me” (Emoi)</strong> — dative, fronted for emphasis: this is Paul’s own examined conviction, not a general platitude offered to others.'},
      {type:"p",html:'<strong>“To live is Christ”</strong> — living, for Paul, does not merely include Christ among other concerns; his very life is defined by, summed up in, Christ (see §4).'},
      {type:"p",html:'<strong>“And to die is gain”</strong> — death is not loss but gain: more of what he already has.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Christ is the content of Paul’s life; death only increases it — so the choice between the two is not a threat, though it is, humanly, hard to call (see 1:22–24)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"to me — Emoi",parse:"dative singular personal pronoun, fronted for emphasis (v.21)",html:'Not “living is generally a good thing” in the abstract, but Paul’s specific, examined conviction — an autobiographical confession, not detached doctrine.'},
      {type:"word",term:"to live — to zēn",parse:"articular present infinitive of zaō, functioning as the subject of the clause (v.21)",html:'The present tense pictures ongoing, everyday life — not a single moment but the whole continuing texture of Paul’s existence.'},
      {type:"word",term:"Christ — Christos",parse:"nominative singular, anarthrous (without the article) predicate (v.21)",html:'The predicate lacks the article. Some grammarians note an anarthrous predicate nominative can emphasize quality or character rather than mere identity (compare discussions of Colwell’s rule). Functionally here it means Paul’s life is characterized by, saturated with, Christ — not that Christ is merely one item among Paul’s concerns.'},
      {type:"word",term:"to die — to apothanein",parse:"articular aorist infinitive of apothnēskō, subject of the second clause (v.21)",html:'The aorist pictures the single event of dying, set against the ongoing present of <em>to zēn</em>, “to live.”'},
      {type:"word",term:"gain — kerdos",parse:"nominative singular predicate (v.21)",html:'A commercial term — gain, profit — a striking word choice for death. Paul picks up the same commercial register in 3:7–8, recounting his credentials as “loss” (<em>zēmia</em>) compared to the “surpassing value” of knowing Christ.'},
      {type:"callout",style:"caution",label:"Honest note — what exactly does “to live is Christ” encompass?",html:'Commentators on Philippians (for example, Fee and O’Brien) generally read the phrase as holding together both Paul’s personal, relational union with Christ and his ongoing apostolic mission — the two are not separable for him. The text itself does not spell out which emphasis is primary, and it is best read as holding both rather than reducing it to only one.'},
      {type:"callout",style:"oneline",label:"In one line",html:"“to me” (personal) — “to live” (ongoing) = “Christ” (defining substance); “to die” (single event) = “gain” (more of the same, not less)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But note what is happening in this single, compressed sentence: he names Christ as the totalizing frame through which both the best and worst possible outcomes — continued life, execution — are interpreted.'},
      {type:"list",style:"plain",items:[
        "<strong>A single, stable reference point holds together radically different circumstances</strong> without fragmenting a person’s sense of meaning — here, both possible outcomes (life or death) are read through the same fixed point, Christ.",
        "<strong>Where the frame is fixed, the felt threat of uncertainty changes.</strong> Paul is not indifferent to the outcome (see 1:22–24, where he genuinely weighs it) — but the frame itself does not shift with the circumstance."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Colossians 3:1–2 — “set your minds on things above” — the same pattern of a fixed reference point governing how varied circumstances are read."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>One master value reduces decision overload.</strong> With life’s whole meaning already anchored in Christ, Paul does not have to re-derive purpose from scratch under each new, unpredictable circumstance — real relief for a mind that finds constant re-evaluation exhausting.'},
      {type:"p",html:'<strong>Neither outcome threatens identity.</strong> Because both living and dying are framed as “Christ” and “gain,” Paul’s sense of self does not hinge on which one happens — a useful reframe against catastrophizing about uncertain outcomes.'},
      {type:"p",html:'<strong>Honest deliberation, not suppressed feeling.</strong> Philippians 1:22–24 shows Paul actually working through the tension rather than pretending to be unaffected, before landing on conviction — modeling that settled faith does not require suppressing genuine internal weighing.'},
      {type:"p",html:'<strong>A short, repeatable anchor phrase.</strong> “To live is Christ, to die is gain” functions almost like a memorizable statement to return to under stress — a concrete phrase rather than an abstract feeling to chase.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Say the verse as your own sentence today:</strong> “For me, to live is Christ.”",
        "<strong>Name one uncertain outcome you’re facing</strong>, and note that Christ is the constant in both possible outcomes — not just the good one.",
        "<strong>Read Philippians 1:22–24 once</strong>, noticing that Paul weighs his feelings honestly before resting in conviction — give yourself permission to do the same."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, whatever today holds, You are the constant. I don’t always feel settled the way Paul sounds here — sometimes I am still weighing, still uncertain, still afraid. Let Christ be what defines my life regardless of the outcome I am facing, and teach me to hold both my honest uncertainty and my settled conviction without shame at having both. Amen.'}
    ]}
  ],
  oneThing:"Whatever today holds, Christ is the constant — so nothing that happens can take away what actually defines your life.",
  sources:"Translations: NASB 1995, ESV. Greek text: Philippians 1:21 (NA/UBS). Key words: to zēn (articular present infinitive), Christos (anarthrous predicate nominative), to apothanein (articular aorist infinitive), kerdos. Cross-references: Philippians 1:12–14, 19–20, 22–25; 3:7–8; Galatians 2:20; Colossians 3:1–2; 2 Corinthians 5:8. Commentators referenced on the scope of “to live is Christ”: Fee, O’Brien. Interpretive note flagged, not resolved: whether the phrase foregrounds mystical union with Christ or missional/apostolic purpose — best read as holding both together."
},
{
  id:"phil1-3-11",
  reference:"Philippians 1:3–11",
  title:"Philippians 1:3–11",
  subtitle:"He who began a good work in you will carry it through to completion — confidence rooted in God's follow-through, not yours.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Assurance & Security","Sanctification & Holiness","Purpose & Mission","Discipleship & Following Jesus"],
  anchor:"Paul's confidence for the Philippians rests on one thing: God, who began the good work in them, is the same God who will carry it through to completion — so their partnership in the gospel and their growing love are evidence of His follow-through, not their own.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">3</sup>I thank my God in all my remembrance of you, <sup class="vn">4</sup>always offering prayer with joy in my every prayer for you all, <sup class="vn">5</sup>in view of your participation in the gospel from the first day until now. <sup class="vn">6</sup>For I am confident of this very thing, that He who began a good work in you will perfect it until the day of Christ Jesus. <sup class="vn">7</sup>For it is only right for me to feel this way about you all, because I have you in my heart, since both in my imprisonment and in the defense and confirmation of the gospel, you all are partakers of grace with me. <sup class="vn">8</sup>For God is my witness, how I long for you all with the affection of Christ Jesus. <sup class="vn">9</sup>And this I pray, that your love may abound still more and more in real knowledge and all discernment, <sup class="vn">10</sup>so that you may approve the things that are excellent, in order to be sincere and blameless until the day of Christ; <sup class="vn">11</sup>having been filled with the fruit of righteousness which comes through Jesus Christ, to the glory and praise of God.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">3</sup>I thank my God in all my remembrance of you, <sup class="vn">4</sup>always in every prayer of mine for you all making my prayer with joy, <sup class="vn">5</sup>because of your partnership in the gospel from the first day until now. <sup class="vn">6</sup>And I am sure of this, that he who began a good work in you will bring it to completion at the day of Jesus Christ. <sup class="vn">7</sup>It is right for me to feel this way about you all, because I hold you in my heart, for you are all partakers with me of grace, both in my imprisonment and in the defense and confirmation of the gospel. <sup class="vn">8</sup>For God is my witness, how I yearn for you all with the affection of Christ Jesus. <sup class="vn">9</sup>And it is my prayer that your love may abound more and more, with knowledge and all discernment, <sup class="vn">10</sup>so that you may approve what is excellent, and so be pure and blameless for the day of Christ, <sup class="vn">11</sup>filled with the fruit of righteousness that comes through Jesus Christ, to the glory and praise of God.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the thanksgiving that opens the letter",blocks:[
      {type:"p",html:'After his greeting (1:1–2), Paul opens Philippians with thanksgiving and prayer for a church he clearly loves — his only congregation to have supported him financially, from the very start of his ministry there (v.5; see 4:15–16). Even writing from prison (v.7), his tone is warm, not anxious.'},
      {type:"p",html:'This nine-verse paragraph is a single unit: thanksgiving rooted in the Philippians’ partnership (vv.3–5), confidence in God’s ongoing work in them (v.6), the reason that confidence is right (v.7–8), and a specific prayer for what that work should look like as it continues (vv.9–11). It sets the tone for the whole letter, which returns again and again to joy, partnership, and the “day of Christ” as the horizon for present growth.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Before Paul asks anything of the Philippians, he tells them what he is confident God is already doing in them — and prays that it keeps going."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"thanksgiving → confidence → reason → prayer",blocks:[
      {type:"p",html:'<strong>Beat 1 — thanksgiving rooted in partnership (vv.3–5).</strong> Paul’s joy is not generic gratitude; it is specifically for the Philippians’ “participation in the gospel” (<em>koinōnia</em>) — a shared partnership stretching back to “the first day.”'},
      {type:"p",html:'<strong>Beat 2 — the confidence stated (v.6).</strong> The verse this passage is best known for: God, who began the good work, is the one who will bring it to completion — framed as a settled conviction (see the perfect participle in §4), not a hope.'},
      {type:"p",html:'<strong>Beat 3 — the reason the confidence is right (vv.7–8).</strong> Paul’s feelings for the Philippians are not sentimental excess — “it is only right” — because they share with him in grace, in imprisonment, and in gospel defense alike. God Himself is called as witness to how deeply Paul longs for them.'},
      {type:"p",html:'<strong>Beat 4 — the prayer for what continues (vv.9–11).</strong> Paul does not pray they coast on God’s finishing work; he prays their love would keep abounding, paired with knowledge and discernment, aimed at a purpose: approving what is excellent, being blameless for the day of Christ, and bearing the fruit of righteousness that comes through Jesus Christ — all “to the glory and praise of God.”'},
      {type:"callout",style:"oneline",label:"In one line",html:"thankful for shared partnership (v.3–5) → confident God will finish what He started (v.6) → because that confidence is grounded in real, shared grace (v.7–8) → praying love keeps growing toward that finished day (v.9–11)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"partnership / participation — koinōnia",parse:"dative singular noun, from koinos “common, shared” (v.5)",html:'More than financial support, though it includes it (see 4:15–16) — a genuine shared stake in the gospel’s advance, from the very beginning of the relationship. The word covers fellowship, contribution, and joint participation together.'},
      {type:"word",term:"having begun — enarxamenos",parse:"aorist middle participle, nominative masculine singular, of enarchomai, “to begin, make a beginning” (v.6)",html:'A definite past starting-point — God is the one who began this work, not the Philippians’ own initiative. Paired deliberately with <em>epitelesei</em> below: the same God who started will finish.'},
      {type:"word",term:"will perfect / will bring it to completion — epitelesei",parse:"future indicative active, 3rd singular, of epiteleō, “to complete, accomplish, carry through to the end” (v.6)",html:'The verb pairs precisely with <em>enarxamenos</em> — begun and completed by the same agent. Paul’s confidence (<em>pepoithōs</em>, a perfect participle — a settled, present state of persuasion) rests entirely on who starts and finishes this work, not on the Philippians’ own follow-through.'},
      {type:"word",term:"to approve — dokimazein",parse:"present infinitive active, of dokimazō, “to test, examine, and by extension approve what passes the test” (v.10)",html:'Not passive preference but active discernment — testing “the things that differ” (<em>ta diapheronta</em>) to recognize what is genuinely excellent, so that love (v.9) is guided by real knowledge and discernment rather than untested sentiment.'},
      {type:"word",term:"fruit of righteousness — karpon dikaiosynēs",parse:"accusative singular noun phrase (v.11)",html:'The goal of the whole prayer: not bare purity for its own sake, but fruit — visible, produced growth — and explicitly “through Jesus Christ,” not self-generated, aimed “to the glory and praise of God” rather than the believer’s own credit.'},
      {type:"callout",style:"caution",label:"Honest note — is v.6’s “good work” personal sanctification or the Philippians’ gospel partnership specifically?",html:'Commentators differ slightly on whether “the good work” God began and will complete (v.6) refers most immediately to the Philippians’ ongoing partnership in gospel ministry (the topic of vv.3–5, immediately preceding) or more broadly to their personal sanctification, culminating at “the day of Christ Jesus.” Many hold both are in view — the church’s shared gospel work and each believer’s ongoing transformation are not sharply separable in Paul’s thought — but the specific referent is genuinely discussed rather than settled by the grammar alone.'},
      {type:"callout",style:"oneline",label:"In one line",html:"begun by God, finished by God (enarxamenos / epitelesei) — real discernment, not passive drift (dokimazein) — visible fruit, credited to Christ and God’s glory (karpon dikaiosynēs)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But note what this prayer targets and what it grounds that target in.'},
      {type:"list",style:"plain",items:[
        "<strong>A guaranteed outcome changes what effort feels safe.</strong> Verse 6’s certainty — the same God who started will finish — removes outcome-anxiety from the process of growth. Effort aimed at a guaranteed destination is a different kind of effort than effort spent trying to secure an uncertain one.",
        "<strong>Discernment is trainable, not just felt.</strong> Paul prays for love “with knowledge and all discernment” (v.9) so the Philippians can actively test (<em>dokimazein</em>, v.10) what is excellent — pairing affection with active, ongoing evaluation rather than leaving growth to untrained sentiment alone.",
        "<strong>Growth is described as fruit, not achievement.</strong> “Filled with the fruit of righteousness…through Jesus Christ” (v.11) locates the visible growth in a source outside the person bearing it — consistent with how durable change actually roots: in a sustained relationship and process, not a single act of will."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Philippians 2:13 — “it is God who works in you, both to will and to work for His good pleasure” — the same pattern: God supplies both the desire and the power, start to finish."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>The follow-through is not yours to guarantee.</strong> Verse 6’s confidence rests on God’s completion, not the Philippians’ consistency. For a mind that struggles with follow-through and dreads abandoned projects, this reframes spiritual growth: the “project” is being carried by Someone whose follow-through does not falter.'},
      {type:"p",html:'<strong>A fixed finish line, not an open-ended demand.</strong> “Until the day of Christ Jesus” (v.6) and “for the day of Christ” (v.10) give this growth a concrete horizon rather than a vague, perpetually unfinished task — useful for a mind that finds open-ended goals harder to hold onto than bounded ones.'},
      {type:"p",html:'<strong>Discernment, not intuition on demand.</strong> Verse 9’s pairing of love with “knowledge and all discernment” validates that growth in wisdom is something learned and tested (<em>dokimazein</em>), not something you either intuitively have or lack. That is relief for a mind that processes situations more through explicit reasoning than instant social read.'},
      {type:"p",html:'<strong>Named partnership, not silent obligation.</strong> Paul is explicit and specific about what the Philippians mean to him (vv.7–8) rather than assuming it is understood. For a mind that relies on things being stated plainly rather than inferred, that concreteness is itself a model worth noting.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Say the settled confidence aloud.</strong> Once today: “The One who began the good work in me will carry it through to completion.”",
        "<strong>Test one thing today.</strong> Practice v.10’s <em>dokimazein</em> in miniature — pause on one decision today and actively ask what is genuinely excellent, rather than defaulting to habit.",
        "<strong>Name your partnership.</strong> Like Paul in vv.7–8, tell one person plainly and specifically what their partnership in your life or faith means to you."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, You began the good work in me, and I trust You to carry it through — not because I am consistent, but because You are. Let my love keep abounding, paired with real knowledge and discernment, so that I learn to recognize what is genuinely excellent rather than merely familiar. Keep the day of Christ in view as the fixed horizon for a growth that sometimes feels slow or unfinished. And let whatever fruit grows in me be credited to Jesus Christ, and to Your glory, not my own effort. Amen.'}
    ]}
  ],
  oneThing:"The One who began the good work in you will carry it through to completion at the day of Christ Jesus — your part is to keep loving with discernment, not to guarantee the finish.",
  sources:"Translations: NASB 1995, ESV. Greek text: Philippians 1:3–11 (NA/UBS). Key words: koinōnia (v.5), enarxamenos (aorist middle participle of enarchomai, v.6), epitelesei (future active indicative of epiteleō, v.6), dokimazein (present infinitive active of dokimazō, v.10), karpon dikaiosynēs (v.11). Cross-references: Philippians 2:13; 4:15–16; 1 Corinthians 1:8; 1 Thessalonians 5:24; Colossians 1:9–10; 3:10. Contested points flagged, not resolved: whether “the good work” of v.6 refers most immediately to the Philippians’ shared gospel partnership, to personal sanctification more broadly, or (as many hold) both together."
},
{
  id:"rom7-21-25",
  reference:"Romans 7:21–25",
  title:"Romans 7:21–25",
  subtitle:"Wretched man that I am! Who will set me free? Thanks be to God through Jesus Christ our Lord.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Suffering & Endurance","Freedom from Sin","Sanctification & Holiness","Assurance & Security"],
  anchor:"Even a mind that delights in God's law and genuinely wants to do good finds another law waging war within it — and the cry of real anguish that follows does not end in despair, but in thanksgiving to God through Jesus Christ.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">21</sup>I find then the principle that evil is present in me, the one who wants to do good. <sup class="vn">22</sup>For I joyfully concur with the law of God in the inner man, <sup class="vn">23</sup>but I see a different law in the members of my body, waging war against the law of my mind and making me a prisoner of the law of sin which is in my members. <sup class="vn">24</sup>Wretched man that I am! Who will set me free from the body of this death? <sup class="vn">25</sup>Thanks be to God through Jesus Christ our Lord! So then, on the one hand I myself with my mind am serving the law of God, but on the other, with my flesh the law of sin.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">21</sup>So I find it to be a law that when I want to do right, evil lies close at hand. <sup class="vn">22</sup>For I delight in the law of God, in my inner being, <sup class="vn">23</sup>but I see in my members another law waging war against the law of my mind and making me captive to the law of sin that dwells in my members. <sup class="vn">24</sup>Wretched man that I am! Who will deliver me from this body of death? <sup class="vn">25</sup>Thanks be to God through Jesus Christ our Lord! So then, I myself serve the law of God with my mind, but with my flesh I serve the law of sin.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the climax of the “I” section",blocks:[
      {type:"p",html:'Romans 7:14–25 is Paul’s famous, intensely personal description of the conflict between wanting to do good and finding evil close at hand. Whether Paul describes his pre-Christian experience, an ongoing believer’s struggle, or a rhetorical “I” representing anyone under the law apart from the Spirit’s power is genuinely debated by careful readers (see the caution below) — but the raw honesty of the passage is not in question.'},
      {type:"p",html:'This five-verse paragraph is the climax of that section: the principle restated (v.21), the delight in God’s law that makes the conflict so painful (v.22), the war within the members (v.23), the anguished cry (v.24) — and then, without transition into a different tone, thanksgiving (v.25). The very next words of the letter (8:1) are “There is therefore now no condemnation” — this paragraph is the hinge into that relief, not a dead end.'},
      {type:"callout",style:"oneline",label:"In one line",html:"The cry of real anguish in verse 24 does not go unanswered — verse 25 answers it immediately, and Romans 8 answers it at length."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"principle → delight → war → anguish → thanks",blocks:[
      {type:"p",html:'<strong>Beat 1 — the principle restated (v.21).</strong> Paul names a recurring pattern: wanting to do what is right and finding evil present, close at hand, whenever he tries.'},
      {type:"p",html:'<strong>Beat 2 — genuine delight in God’s law (v.22).</strong> This is not indifference or rebellion — Paul “joyfully concurs” with God’s law in his inner being. The conflict is painful precisely because the desire for good is real.'},
      {type:"p",html:'<strong>Beat 3 — the war within (v.23).</strong> A military image: “another law” wages war against the law of his mind, taking him prisoner to the law of sin still active in his members.'},
      {type:"p",html:'<strong>Beat 4 — the cry (v.24).</strong> “Wretched man that I am!” — unguarded anguish, followed by a genuine question: who will rescue me from this body of death?'},
      {type:"p",html:'<strong>Beat 5 — the answer, immediately (v.25).</strong> Not a pause, not a change of subject: “Thanks be to God through Jesus Christ our Lord!” The rescuer is named before the chapter ends, even while the closing summary (v.25b) is honest that the conflict itself continues — mind serving God’s law, flesh still serving sin’s.'},
      {type:"callout",style:"oneline",label:"In one line",html:"real delight in what is good (v.22) → real war within (v.23) → real anguish (v.24) → an answer named without delay (v.25)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"waging war — antistrateuomenon",parse:"present participle middle/passive, accusative masculine singular, of antistrateuomai, “to campaign against, wage war against” (v.23)",html:'A military metaphor — an opposing army actively campaigning, not a passive obstacle. The present tense pictures ongoing, active conflict, not a settled or occasional friction.'},
      {type:"word",term:"making [me] a prisoner — aichmalōtizonta",parse:"present participle active, accusative masculine singular, of aichmalōtizō, “to take captive in war, lead away as a prisoner of war” (v.23)",html:'The same root gives “prisoner of war” in Greek — reinforcing the military picture of v.23. This is forceful, involuntary language: being taken captive, not merely tempted.'},
      {type:"word",term:"wretched — talaipōros",parse:"nominative masculine singular adjective, “distressed, afflicted, miserable” (v.24)",html:'A strong, unguarded word for genuine misery — used elsewhere in the New Testament only in Revelation 3:17, of the Laodicean church’s self-deceived poverty. Paul’s use here is raw, first-person, and without any softening qualifier.'},
      {type:"word",term:"will set me free / will deliver — rhysetai",parse:"future indicative middle, 3rd singular, of rhyomai, “to rescue, deliver from danger” (v.24)",html:'The same verb the Lord’s Prayer uses for “deliver us from evil” (Matthew 6:13). The question is not rhetorical despair but a real question expecting a real rescuer — and verse 25 answers it by name.'},
      {type:"word",term:"the body of this death — sōmatos tou thanatou toutou",parse:"genitive construction (v.24)",html:'Genuinely discussed: a graphic ancient image (some point to the practice of binding a corpse to a living prisoner), a reference to the mortal body as sin’s ongoing battleground, or a summary phrase for the whole condition just described in vv.21–23. Whichever precise referent, the phrase names something Paul wants rescue <em>from</em>, not something he claims has already ceased to trouble him.'},
      {type:"callout",style:"caution",label:"Honest caution — who is speaking in Romans 7:14–25?",html:'A long-standing, genuine debate: does this “I” describe Paul’s (or anyone’s) pre-Christian experience under the law, a mature believer’s ongoing internal struggle with remaining sin, or a rhetorical device representing humanity under law apart from the Spirit? Commentators are divided — Cranfield, for instance, reads much of the passage as describing the mature Christian’s experience; others place it earlier in salvation history. The passage does not resolve which reading is correct, and this study does not resolve it either — but under any reading, the raw honesty about internal conflict, and the thanksgiving that follows it, apply.'},
      {type:"callout",style:"oneline",label:"In one line",html:"real war (antistrateuomenon, aichmalōtizonta) → real misery, named plainly (talaipōros) → a real rescuer, asked for and answered (rhysetai) → a real ongoing struggle, named honestly even after the thanksgiving (v.25b)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But note what this passage does and does not claim about internal conflict.'},
      {type:"list",style:"plain",items:[
        "<strong>Naming the conflict precisely is not the same as losing the fight.</strong> Paul describes the war within in unusually specific, almost clinical detail (vv.22–23) — mind, members, law, law — rather than a vague sense of failure. Precise naming of a struggle is generally a prerequisite for addressing it, not evidence the struggle has won.",
        "<strong>An unguarded cry is followed by a named answer, not silence.</strong> Verse 24’s anguish gets an immediate, specific response in verse 25 — not reassurance that the struggle isn’t real, but a rescuer named. A mind that spirals in unanswered distress is working differently than a mind whose distress is met with something concrete to hold onto.",
        "<strong>Two things can be true in the same sentence.</strong> Verse 25b holds both together without resolving the tension into a tidy conclusion: “I myself…serve the law of God…[and] the law of sin.” Tolerating this kind of both/and, rather than forcing premature resolution, matches how real, ongoing change is actually described here — underway, not finished."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 8:1 — the very next verse — “there is therefore now no condemnation”: the answer to this chapter's cry is not a technique but a Person, and the relief is immediate."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Wanting to do good and still struggling are not contradictory.</strong> Verse 22’s genuine delight in what is right, alongside verse 23’s real ongoing struggle, names exactly the gap many AuDHD believers feel between sincere intention and inconsistent follow-through — without treating either half as fake.'},
      {type:"p",html:'<strong>An unfiltered cry is biblical, not a failure of faith.</strong> “Wretched man that I am!” is about as unguarded as language gets — and it is Scripture, not a lapse. A mind that struggles to perform composed, measured distress has precedent here for saying the raw thing plainly.'},
      {type:"p",html:'<strong>The struggle itself is not the disqualifying fact.</strong> Verse 25b’s honest, ongoing tension — mind serving God’s law, flesh still serving sin’s — comes right after thanksgiving, not instead of it. Continued struggle and genuine rescue are not mutually exclusive claims in this passage.'},
      {type:"p",html:'<strong>Relief is not indefinitely delayed.</strong> The chapter does not leave the cry of v.24 hanging — v.25 answers immediately, in the very next clause. For a mind that tends to expect prolonged unresolved distress, that immediacy is itself worth noticing.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Say the cry and the answer together.</strong> Once today: “Wretched man that I am — thanks be to God through Jesus Christ our Lord.” Let both halves stand, without rushing past the first to get to the second.",
        "<strong>Name one specific struggle precisely.</strong> Rather than a vague sense of failure today, name one specific area where you want to do good and find evil close at hand — precision over vague self-judgment.",
        "<strong>Read Romans 8:1 right after this passage.</strong> Once today, read straight from 7:25 into 8:1 to feel the hinge Paul intended — the cry does not go unanswered."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, I do delight in what is right, and I still find evil close at hand when I try to do it — that gap is real, and I will not pretend it isn’t. Wretched as I sometimes feel, I know who will rescue me: not a technique, not more effort, but You, through Jesus Christ our Lord. Thank You that the cry does not go unanswered, and that the struggle that continues is not evidence You have left. Amen.'}
    ]}
  ],
  oneThing:"The war within is real, and so is the rescue — thanks be to God through Jesus Christ our Lord, named the moment the cry is spoken.",
  sources:"Translations: NASB 1995, ESV. Greek text: Romans 7:21–25 (NA/UBS). Key words: antistrateuomenon (present participle of antistrateuomai, v.23), aichmalōtizonta (present participle of aichmalōtizō, v.23), talaipōros (v.24), rhysetai (future middle indicative of rhyomai, v.24), sōmatos tou thanatou toutou (v.24). Cross-references: Romans 6:6; 8:1–2, 23; Galatians 5:17; James 4:1; Matthew 6:13. Commentators referenced on the identity of the “I” in 7:14–25: Cranfield, among others, who reads much of the passage as describing the mature believer’s experience; other readings place it earlier in salvation history. Contested point flagged, not resolved: whether Romans 7:14–25 describes Paul’s (or a believer’s) pre-Christian experience, an ongoing believer’s struggle with remaining sin, or a rhetorical “I” representing humanity under law apart from the Spirit."
},
{
  id:"2co5-16-17",
  reference:"2 Corinthians 5:16–17",
  title:"2 Corinthians 5:16–17",
  subtitle:"If anyone is in Christ, he is a new creation — the old has passed away, and the new has already come.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Identity in Christ","Union with Christ","Renewal of the Mind","Resurrection Hope"],
  anchor:"Because you are in Christ, you are a new creation — not evaluated by outward, fleshly categories any longer, since the old has genuinely passed away and the new has already, actually come.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">16</sup>Therefore from now on we recognize no one according to the flesh; even though we have known Christ according to the flesh, yet now we know Him in this way no longer. <sup class="vn">17</sup>Therefore if anyone is in Christ, he is a new creature; the old things passed away; behold, new things have come.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">16</sup>From now on, therefore, we regard no one according to the flesh. Even though we once regarded Christ according to the flesh, we regard him thus no longer. <sup class="vn">17</sup>Therefore, if anyone is in Christ, he is a new creation. The old has passed away; behold, the new has come.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the hinge inside Paul's argument for reconciliation",blocks:[
      {type:"p",html:'2 Corinthians 5:11–21 defends Paul’s ministry and unpacks what compels it: “the love of Christ controls us” (v.14), because one died for all, so those who live should no longer live for themselves (vv.14–15). Verse 16 draws the first conclusion from that: a whole new way of regarding people, no longer “according to the flesh.”'},
      {type:"p",html:'This compact two-verse paragraph is the pivot of the section — from the theological basis (Christ’s death for all, vv.14–15) to its outworking, first in how Paul now regards others and Christ himself (v.16), then in the flat declarative statement the paragraph is famous for (v.17). What follows immediately (vv.18–21) explains this new creation in terms of reconciliation: God reconciling the world to Himself in Christ, and entrusting believers with that same ministry.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Before Paul describes the ministry of reconciliation (vv.18–21), he states the fact reconciliation rests on: in Christ, a person is not the same — genuinely new, not merely reevaluated."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"a new way of seeing → a flat declaration",blocks:[
      {type:"p",html:'<strong>Beat 1 — a changed way of regarding people (v.16).</strong> “From now on” marks a decisive shift: no more evaluating anyone — not even Christ Himself, as Paul once did — by external, fleshly categories.'},
      {type:"p",html:'<strong>Beat 2 — the declaration (v.17).</strong> The conclusion is stated as flatly as Greek allows: if anyone is in Christ — new creation. No verb even appears in the Greek clause (see §4); the fact is stated, not argued for.'},
      {type:"p",html:'<strong>Beat 3 — the two-part proof (v.17b).</strong> “The old has passed away” — a definite, completed event; “the new has come” — a present reality that stays. Both halves of the claim get their own verb, in deliberately different tenses (see §4).'},
      {type:"callout",style:"oneline",label:"In one line",html:"a new way of seeing everyone, even Christ (v.16) → because in Christ, someone is genuinely new (v.17) → the old is finished, and the new has already arrived and remains (v.17b)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"according to the flesh — kata sarka",parse:"prepositional phrase, accusative singular of sarx (v.16)",html:'Not a reference to physical bodies as such, but to outward, worldly categories of evaluation — status, appearance, human credentials — the very standard Paul says he once used even to assess Christ, and no longer does.'},
      {type:"word",term:"is in Christ — en Christō",parse:"prepositional phrase, dative singular (v.17)",html:'The single condition of the whole verse. Everything that follows — new creation, the old passing, the new coming — is entirely contingent on this one location: in Christ, not achieved by any process the person underwent themselves.'},
      {type:"word",term:"a new creation — kainē ktisis",parse:"nominative feminine singular; the verse has no expressed verb in Greek, so translators supply “he is” (v.17)",html:'<em>Kainē</em> means new in kind or quality, not merely new in time — a fresh, previously nonexistent kind of thing, not just another instance of the old kind. <em>Ktisis</em> can mean either the act of creating or the created thing itself; ESV footnotes the alternate rendering “creature.” The Greek clause’s missing verb makes the claim read almost like a title or a fact stated in shorthand — this is simply what is true, not an argument being built toward.'},
      {type:"word",term:"has passed away — parēlthen",parse:"aorist indicative active, 3rd singular, of parerchomai, “to pass by, pass away” (v.17)",html:'A definite, completed past event — the old order is finished, not fading or in the process of ending.'},
      {type:"word",term:"has come — gegonen",parse:"perfect indicative active, 3rd singular, of ginomai, “to become, come to be” (v.17)",html:'A deliberate tense shift from the aorist <em>parēlthen</em>: the perfect tense describes a past event with a result that continues in the present. The old ended (aorist, a closed fact); the new arrived and remains here now (perfect, an ongoing present reality) — the two verbs are chosen precisely, not interchangeably.'},
      {type:"callout",style:"caution",label:"Honest note — “creature” or “creation”?",html:'ESV renders <em>ktisis</em> “new creation” in the main text with a footnote offering “creature”; NASB1995 reads “new creature.” Both are legitimate: <em>ktisis</em> can denote either the act/order of creation broadly (favoring a cosmic, new-creation reading tied to Isaiah 43:18–19 and Revelation 21:5) or the individual created thing (favoring a focus on the person’s own transformation). Most interpreters hold the individual and cosmic senses together rather than forcing a choice — the language deliberately echoes both.'},
      {type:"callout",style:"oneline",label:"In one line",html:"no more fleshly evaluation (kata sarka) → the one condition is union with Christ (en Christō) → genuinely, categorically new (kainē ktisis) → the old is finished (parēlthen, aorist), the new has arrived and stays (gegonen, perfect)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But note the shift this passage describes and the tense it is described in.'},
      {type:"list",style:"plain",items:[
        "<strong>A changed evaluative frame, not just changed behavior.</strong> Verse 16 describes a shift in the very categories used to assess people — “according to the flesh” abandoned altogether — rather than a list of new behaviors layered onto an unchanged way of seeing. Durable change tends to follow a shift in framework, not just in output.",
        "<strong>The tense change (aorist → perfect) marks something as finished and settled, not perpetually in progress.</strong> A mind that experiences change as a completed, standing fact — rather than an ongoing, uncertain project — has a different relationship to that change than one that must keep re-verifying it.",
        "<strong>The missing verb makes it a declaration, not an argument to be won.</strong> Verse 17’s bare Greek clause (§4) states the fact rather than building a case for it — consistent with how settled identity, once established, functions less like a conclusion to keep re-proving and more like a premise to act from."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 6:4 — “walk in newness of life” — the same pattern: a settled, already-accomplished new identity, from which new patterns of living grow."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Not evaluated by external categories anymore.</strong> Verse 16’s rejection of judging “according to the flesh” — status, appearance, performance — includes how you are meant to see yourself, not only others. Your worth is not read off outward metrics.'},
      {type:"p",html:'<strong>A settled fact, not a project.</strong> The bare declaration of v.17, with no verb even supplied in the Greek, reads like a stated fact rather than a goal still being pursued. New creation is not a self-improvement program you are mid-way through — it is what is already true.'},
      {type:"p",html:'<strong>The old is actually finished — not just improving.</strong> <em>Parēlthen</em>’s aorist tense (definite, completed) means the old identity did not merely fade or get managed; it passed away. That is different from — and more final than — “getting better at managing the old self.”'},
      {type:"p",html:'<strong>The new is present and staying, not arriving eventually.</strong> <em>Gegonen</em>’s perfect tense says the new has already come and remains — not a future hope still pending, but a current, ongoing reality, useful for a mind that finds indefinitely deferred promises hard to hold onto.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Say the declaration plainly.</strong> Once today: “I am in Christ — the old has passed away, the new has come.” State it as fact, not aspiration.",
        "<strong>Drop one “according to the flesh” evaluation.</strong> Notice one place today you are judging yourself (or someone else) by outward, fleshly categories, and consciously set it down.",
        "<strong>Locate the one condition.</strong> When you doubt whether you’ve really changed, return to the single hinge of v.17: not your consistency, but whether you are “in Christ.”"
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord, thank You that in Christ I am a new creation — not a project still under construction, but a settled fact: the old has passed away, and the new has already come and remains. Teach me to stop evaluating myself and others by outward, fleshly categories, the way Paul once even misjudged You by them. When I doubt whether anything has really changed in me, return me to the one condition that matters: that I am in Christ. Amen.'}
    ]}
  ],
  oneThing:"If you are in Christ, you are a new creation — the old has genuinely passed away, and the new has already, actually come.",
  sources:"Translations: NASB 1995, ESV. Greek text: 2 Corinthians 5:16–17 (NA/UBS). Key words: kata sarka (v.16), en Christō (v.17), kainē ktisis (nominative, verbless clause, v.17), parēlthen (aorist active of parerchomai, v.17), gegonen (perfect active of ginomai, v.17). Cross-references: 2 Corinthians 5:11–15, 18–21; Romans 6:4; Galatians 6:15; Ephesians 2:15; 4:24; Isaiah 43:18–19; 65:17; Revelation 21:5. Contested point flagged, not resolved: whether kainē ktisis (v.17) is best rendered “new creation” (favoring a cosmic, new-creation-order sense) or “new creature” (favoring the individual believer's transformation) — both NASB1995 and ESV differ slightly here, and most interpreters hold the two senses together rather than choosing between them."
},
{
  id:"col3-5-11",
  reference:"Colossians 3:5–11",
  title:"Colossians 3:5–11",
  subtitle:"Put to death what belongs to the old self, and put on the new — being renewed in the image of the One who made you, where Christ is all, and in all.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Sanctification & Holiness","Renewal of the Mind","Identity in Christ","Union with Christ"],
  anchor:"Because you have already put off the old self and put on the new, put to death what belongs to your old life and let the Spirit keep renewing you in the image of the One who made you — where every human dividing line gives way, because Christ is all, and in all.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">5</sup>Therefore consider the members of your earthly body as dead to immorality, impurity, passion, evil desire, and greed, which amounts to idolatry. <sup class="vn">6</sup>For it is because of these things that the wrath of God will come upon the sons of disobedience, <sup class="vn">7</sup>and in them you also once walked, when you were living in them. <sup class="vn">8</sup>But now you also, put them all aside: anger, wrath, malice, slander, and abusive speech from your mouth. <sup class="vn">9</sup>Do not lie to one another, since you laid aside the old self with its evil practices, <sup class="vn">10</sup>and have put on the new self who is being renewed to a true knowledge according to the image of the One who created him— <sup class="vn">11</sup>a renewal in which there is no distinction between Greek and Jew, circumcised and uncircumcised, barbarian, Scythian, slave and freeman, but Christ is all, and in all.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">5</sup>Put to death therefore what is earthly in you: sexual immorality, impurity, passion, evil desire, and covetousness, which is idolatry. <sup class="vn">6</sup>On account of these the wrath of God is coming. <sup class="vn">7</sup>In these you too once walked, when you were living in them. <sup class="vn">8</sup>But now you must put them all away: anger, wrath, malice, slander, and obscene talk from your mouth. <sup class="vn">9</sup>Do not lie to one another, seeing that you have put off the old self with its practices <sup class="vn">10</sup>and have put on the new self, which is being renewed in knowledge after the image of its creator. <sup class="vn">11</sup>Here there is not Greek and Jew, circumcised and uncircumcised, barbarian, Scythian, slave, free; but Christ is all, and in all.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the hinge between “you already died and were raised” (3:1–4) and the positive virtues to put on (3:12–17)",blocks:[
      {type:"p",html:'The previous paragraph (3:1–4) grounded everything in a settled identity: raised with Christ, mind fixed above, life hidden with Him, certain of future glory. Verse 5 opens with “therefore” — the ethical instruction that follows is not a bid to earn that identity, but the lived shape of already having it.'},
      {type:"p",html:'This paragraph runs in two halves: first a warning built on the readers’ pre-Christian past (vv.5–8, two vice lists — impulses of the heart, then sins of speech and relationship), then the reason such change is even possible (vv.9–10) — because you have already, decisively, put off the old self and put on the new. It closes (v.11) with the sweeping claim that in this new humanity, none of the categories people use to rank each other survive: Christ is all, and in all.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Because you were already raised with Christ (3:1–4), put to death what belongs to the old way of life — not to become new, but because you already are."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"five beats: put to death, warned, put away, already changed, no more distinctions",blocks:[
      {type:"p",html:'<strong>Beat 1 — a decisive execution, not gradual improvement (v.5).</strong> “Consider the members of your earthly body as dead” renders a single strong verb (see §4): treat these things as already put to death, not merely as being managed.'},
      {type:"p",html:'<strong>Beat 2 — the warning and the reminder (vv.6–7).</strong> These things provoke God’s wrath; and “in them you also once walked” — a direct reminder of who the readers used to be before Christ.'},
      {type:"p",html:'<strong>Beat 3 — the second list: relational and verbal sins (v.8).</strong> A shift from private vice (v.5) to the sins that damage a community — anger, wrath, malice, slander, abusive speech — all to be “put aside,” using the image of removing a garment.'},
      {type:"p",html:'<strong>Beat 4 — the reason such change is real (vv.9–10).</strong> “Do not lie to one another, since you laid aside the old self… and have put on the new self.” The command not to lie rests on a completed fact: the old self already stripped off, the new self already put on — and that new self is continually “being renewed… according to the image of the One who created him.”'},
      {type:"p",html:'<strong>Beat 5 — the result: no more human categories (v.11).</strong> Ethnic (Greek/Jew, circumcised/uncircumcised), cultural (barbarian/Scythian), and social (slave/free) distinctions — every line people use to rank one another — give way, because Christ is all, and in all.'},
      {type:"callout",style:"oneline",label:"In one line",html:"put to death (decisive act) → warned by your own past → put away the relational sins → because you already put off the old and put on the new (settled fact, still being renewed) → and every human dividing line disappears in Christ."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"consider… as dead — nekrōsate",parse:"aorist imperative active, 2nd plural, of nekroō, “to put to death” (v.5)",html:'A strong, decisive command — literally “put to death,” which NASB1995 renders more smoothly as “consider… as dead” (its own footnote notes the literal sense). Not a call to gradually weaken these impulses, but to treat them as already executed.'},
      {type:"word",term:"put them all aside / laid aside / put on — apothesthe / apekdysamenoi / endysamenoi",parse:"aorist middle imperative of apotithēmi (v.8); aorist middle participle of apekdyomai (v.9); aorist middle participle of enduō (v.10)",html:'A single clothing metaphor runs through the paragraph: “put away” (like taking off a garment, v.8), “laid aside” (<em>apekdyomai</em>, a rare, forceful compound meaning to strip completely off — the same verb Paul uses in 2:15 of Christ “disarming” the rulers and authorities), and “put on” (<em>enduō</em>, to clothe oneself, v.10). Strip off the old garment entirely; put on the new.'},
      {type:"word",term:"being renewed — anakainoumenon",parse:"present passive participle, nominative singular, of anakainoō, “to make new again” (v.10)",html:'Present tense: an ongoing, continuing process, not a single completed act like the “putting off/on” beside it. Passive voice: something being done to the person, not self-generated. Compare Romans 12:2 (“renewed,” <em>anakainōsis</em>) and 2 Corinthians 4:16 (“the inner man is being renewed,” same verb).'},
      {type:"word",term:"knowledge — epignōsin",parse:"accusative singular of epignōsis (v.10)",html:'A compound of gnōsis (“knowledge”) with the prefix epi-. Older grammars (e.g. Robertson) sometimes treated the prefix as intensifying — “full” or “deeper” knowledge — but more recent lexical work is cautious about that claim; the safer reading is simply “knowledge,” without overclaiming a guaranteed intensified sense from the prefix alone.'},
      {type:"word",term:"the image of the One who created — eikona tou ktisantos",parse:"accusative singular of eikōn, “image”; ktisantos, aorist active participle genitive singular of ktizō, “to create” (v.10)",html:'The renewal has a fixed reference point outside the self: the Creator’s own image, echoing Genesis 1:26–27 (mankind made in God’s image) and anticipating Romans 8:29 (“conformed to the image of His Son”). The pattern being renewed toward is given, not self-designed.'},
      {type:"callout",style:"caution",label:"Honest note — “new self”: neos here, kainos in Ephesians",html:'The word translated “new” in v.10 is <em>neos</em> (new in time — recent, young), not <em>kainos</em> (new in kind or quality), which Paul uses for the parallel phrase in Ephesians 4:24 (“the new self, created after the likeness of God”). The theological point is the same — a genuinely new identity — but the exact Greek wording differs between the two letters, worth noting rather than treating the phrases as verbally identical.'},
      {type:"callout",style:"oneline",label:"In one line",html:"put to death (nekrōsate, decisive) → strip off the old, put on the new (apekdysamenoi / endysamenoi, a completed exchange) → and keep being renewed (anakainoumenon, ongoing, passive) → toward the fixed pattern of the Creator’s own image."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But notice the shape of the change he describes: a decisive, completed exchange (aorist participles, vv.9–10) paired with an ongoing, continuing process (present passive participle, v.10) — aimed at a fixed external pattern, not a self-generated one.'},
      {type:"list",style:"plain",items:[
        "<strong>The exchange is already finished; the renewal is still happening.</strong> “Laid aside… put on” describes a completed event; “being renewed” describes a continuing one. Durable change often works this way — a decisive turning point, followed by ongoing, incremental reinforcement, not one without the other.",
        "<strong>The renewal is passive — done to you, not purely self-willed.</strong> <em>Anakainoumenon</em> is passive voice: something happening to the person, echoing the same pattern as Romans 12:2’s “be transformed.” Change that depends entirely on unaided self-effort is a heavier, less sustainable model than one where the Spirit is doing the renewing.",
        "<strong>The target pattern is fixed and external, not invented moment to moment.</strong> Renewal is “according to the image of the One who created him” — a stable reference point outside the self, rather than a shifting, self-generated standard that has to be reinvented under pressure."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 12:2 — “be transformed by the renewing of your mind” — the same pattern: a decisive exchange already made, an ongoing renewal still underway, aimed at a fixed pattern outside yourself."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
