      {type:"p",html:'<strong>Beat 6 — already crucified (v.24).</strong> Those who belong to Christ have already crucified the flesh with its passions and desires — a settled, past-tense fact underlying the ongoing walk commanded in vv.16 and 25.'},
      {type:"p",html:'<strong>Beat 7 — keep in step (vv.25–26).</strong> The section closes by returning to its opening command in a new key — not just “walk,” but “keep in step,” aimed specifically at guarding the community from the rivalry named back in v.15.'},
      {type:"callout",style:"oneline",label:"In one line",html:"walk by the Spirit (v.16) → real conflict with the flesh (v.17) → Spirit-led freedom from law (v.18) → the flesh’s plural deeds (vv.19–21) versus the Spirit’s singular fruit (vv.22–23) → the flesh already crucified (v.24) → so keep in step with the Spirit, together (vv.25–26)."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"walk — peripateite",parse:"present active imperative, 2nd plural, of peripateō (v.16)",html:'The present tense pictures an ongoing, habitual lifestyle — “keep walking,” not a single decisive step. <em>Peripateō</em> is common Pauline shorthand for how one conducts one’s whole manner of life (compare Romans 6:4; Ephesians 4:1; Colossians 2:6), not a specific isolated action.'},
      {type:"word",term:"are in opposition — antikeitai",parse:"present middle/passive indicative, 3rd singular, of antikeimai (v.17)",html:'Literally “to lie opposite, be set against” — a vivid, ongoing image of two forces in continual, mutual conflict, neither winning a final, once-for-all victory over the other in this present tense. The conflict named here is real and current, not merely theoretical.'},
      {type:"word",term:"led — agesthe",parse:"present passive indicative, 2nd plural, of agō (v.18)",html:'A passive verb: believers are <em>led</em>, not leading — the Spirit is the active agent, and the ongoing, present-tense form pictures continual, moment-by-moment guidance rather than a single past event of being led once.'},
      {type:"word",term:"deeds of the flesh — erga tēs sarkos",parse:"nominative plural noun phrase (v.19)",html:'“Deeds,” plural — a list of varied, separable acts, not all necessarily present in every person at once. This plural is deliberately set against v.22’s singular “fruit,” a contrast Paul appears to intend as more than incidental (see below).'},
      {type:"word",term:"the fruit of the Spirit — ho karpos tou pneumatos",parse:"nominative singular noun phrase (v.22)",html:'Singular <em>karpos</em>, against the plural “deeds” of v.19 — a widely noted, genuine grammatical feature of the text, not an invented distinction. The singular suggests one unified harvest with many facets (love, joy, peace, and so on, all part of one fruit) rather than a checklist of separate virtues to acquire and check off individually. This is a real, defensible reading of the grammar; it should not be pressed further than the text allows.'},
      {type:"word",term:"have crucified — estaurōsan",parse:"aorist active indicative, 3rd plural, of stauroō (v.24)",html:'A completed, past action — those who belong to Christ Jesus <em>have</em> crucified the flesh, a settled fact already accomplished. This creates a real and worth-naming tension with Paul’s own “I have been crucified with Christ” language in Galatians 2:20 and with Romans 6:6’s “our old self was crucified with Him” — different agency (Christ crucifying us there; believers crucifying the flesh here) describing the same underlying reality from different angles, part of the “already/not yet” shape of Pauline sanctification also visible in Romans 8:13’s ongoing command to “put to death the deeds of the body.”'},
      {type:"word",term:"let us keep in step — stoichōmen",parse:"present active subjunctive, 1st plural (hortatory), of stoicheō (v.25)",html:'A military and marching term — to walk in formation, keep rank, stay in line — distinct from the more general <em>peripateō</em> of v.16. Where “walk” pictures an individual’s ongoing lifestyle, “keep in step” pictures a group moving together in coordinated order, fitting the community-focused warning against rivalry that follows immediately in v.26.'},
      {type:"callout",style:"caution",label:"Honest caution — what does “so that you may not do the things that you please” (v.17) mean?",html:'This is a genuine, long-debated interpretive crux, closely related to the larger debate over Romans 7’s description of struggle. Some read the clause as describing a kind of stalemate: the flesh and Spirit so thoroughly oppose each other that a believer is prevented from consistently doing either good or evil entirely at will. Others read it as describing the Spirit’s specific, intended purpose: to block the flesh’s desires particularly, so that the believer is freed to actually obey rather than being left in neutral gridlock. Commentators differ on which reading fits Paul’s flow best; both are represented in serious scholarship. This study names the debate rather than resolving it.'},
      {type:"callout",style:"oneline",label:"In one line",html:"walk, habitually (peripateite) — a real, ongoing opposition (antikeitai) — led, not leading (agesthe) — plural deeds (erga) versus one unified fruit (karpos) — the flesh already crucified (estaurōsan) — and now march in step, together (stoichōmen)."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Paul did not know modern neuroscience, and this study claims no such thing. But notice the passage’s two key present-tense verbs: “walk” (v.16) and “are led” (v.18) both describe an ongoing, repeated pattern rather than a one-time event.'},
      {type:"list",style:"plain",items:[
        "<strong>Sustained direction, not a single decisive victory, is how this passage pictures change.</strong> The command is to keep walking and keep being led — moment by moment, day by day — matching how durable change is actually built: through repeated, directed practice, not one dramatic breakthrough.",
        "<strong>Fruit grows; it is not manufactured by effort alone.</strong> Verse 22’s image is agricultural, not mechanical — fruit is what a rightly-tended life produces over time under an outside power (the Spirit), not a product assembled by willpower on demand."
      ]},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Romans 12:2 — ongoing, repeated turning toward the Spirit’s leading, not a single fix, is how this fruit actually grows."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>Willpower is not the mechanism named here.</strong> The passage locates the acting power in the Spirit — “walk by the Spirit,” “led by the Spirit” — not in a believer’s unaided self-control. That is real relief for a mind whose executive function and willpower reserves run out fast.'},
      {type:"p",html:'<strong>The conflict named in v.17 is not a personal failure — it is the honest, ongoing condition Paul describes for every believer.</strong> Feeling pulled two directions at once is not evidence something is uniquely wrong with you; it is the passage’s own diagnosis of normal Spirit-versus-flesh existence.'},
      {type:"p",html:'<strong>One unified fruit, not nine separate performance targets.</strong> The grammar itself (singular <em>karpos</em>) supports treating growth as one organic, gradually ripening whole rather than nine independent virtues to master and track one by one — a real relief from checklist-style self-monitoring.'},
      {type:"p",html:'<strong>The flesh’s “deeds” are concrete and specific (v.19), not a vague moral atmosphere to feel generally bad about.</strong> Specificity is easier for a concrete-oriented mind to actually work with than an abstract sense of falling short.'},
      {type:"p",html:'<strong>“Keep in step” (v.25) names a rhythm, not a solo sprint.</strong> The military image of marching together suggests pacing set by someone else (the Spirit) and shared with others, rather than a demand to generate your own perfect internal cadence alone.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name one specific “deed of the flesh” (vv.19–21) you notice today</strong> — concrete, not a vague mood — and ask the Spirit’s leading in that one moment.",
        "<strong>Pick one facet of the fruit (v.22–23) to notice, not produce, today</strong> — watch for where it’s already growing rather than trying to manufacture all nine at once.",
        "<strong>Say once, when you feel pulled two directions:</strong> “This conflict is normal, not a sign I’m failing — Christ has already crucified the flesh, and I am walking, not sprinting, by the Spirit.”"
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Spirit of God, lead me today — I cannot out-willpower the pull of my own flesh, and You have not asked me to. When desire and Spirit tug in opposite directions, remind me that is normal, not evidence of failure, and that You have already broken the flesh’s claim on me at the cross. Grow in me one unified fruit, not nine separate tasks to perform — and where I am tempted toward rivalry or comparison with others, teach me to keep in step with You, together with those around me, rather than walking alone. Amen.'}
    ]}
  ],
  oneThing:"Walk by the Spirit, moment by moment — the flesh's pull is real, but Christ has already crucified its claim on you, and the Spirit is growing one unified fruit in you, not demanding a checklist mastered all at once.",
  sources:"Translations: NASB 1995, ESV. Greek text: Galatians 5:16–26 (NA/UBS). Key words: peripateite (present active imperative of peripateō, v.16), antikeitai (present middle/passive indicative of antikeimai, v.17), agesthe (present passive indicative of agō, v.18), erga tēs sarkos (v.19), ho karpos tou pneumatos (v.22), estaurōsan (aorist active indicative of stauroō, v.24), stoichōmen (present active subjunctive of stoicheō, v.25). Cross-references: Galatians 2:20; 5:1, 13–15; Romans 6:4, 6; 7:14–25; 8:13; 12:2; Ephesians 4:1; Colossians 2:6. Contested point flagged, not resolved: the precise force of v.17’s “so that you may not do the things that you please” — read by some as a mutual stalemate preventing consistent action either way, by others as the Spirit’s specific purpose of blocking the flesh so obedience becomes possible; both readings appear in serious scholarship, and this study names rather than resolves the debate."
},
{
  id:"john14-1-14",
  reference:"John 14:1–14",
  title:"John 14:1–14",
  subtitle:"Do not let your heart be troubled — I am the way, and the truth, and the life; no one comes to the Father but through Me.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Assurance & Security","Union with Christ","Discipleship & Following Jesus"],
  anchor:"Jesus meets His disciples’ troubled hearts not with a technique but with Himself — the way, the truth, and the life, one with the Father — so trusting Him is trusting the Father, and asking in His name reaches the Father’s own answer.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">1</sup>“Do not let your heart be troubled; believe in God, believe also in Me. <sup class="vn">2</sup>In My Father’s house are many dwelling places; if it were not so, I would have told you; for I go to prepare a place for you. <sup class="vn">3</sup>If I go and prepare a place for you, I will come again and receive you to Myself, that where I am, there you may be also. <sup class="vn">4</sup>And you know the way where I am going.” <sup class="vn">5</sup>Thomas said to Him, “Lord, we do not know where You are going, how do we know the way?” <sup class="vn">6</sup>Jesus said to him, “I am the way, and the truth, and the life; no one comes to the Father but through Me. <sup class="vn">7</sup>If you had known Me, you would have known My Father also; from now on you know Him, and have seen Him.” <sup class="vn">8</sup>Philip said to Him, “Lord, show us the Father, and it is enough for us.” <sup class="vn">9</sup>Jesus said to him, “Have I been so long with you, and yet you have not come to know Me, Philip? He who has seen Me has seen the Father; how can you say, ‘Show us the Father’? <sup class="vn">10</sup>Do you not believe that I am in the Father, and the Father is in Me? The words that I say to you I do not speak on My own initiative, but the Father abiding in Me does His works. <sup class="vn">11</sup>Believe Me that I am in the Father and the Father is in Me; otherwise believe because of the works themselves. <sup class="vn">12</sup>Truly, truly, I say to you, he who believes in Me, the works that I do, he will do also; and greater works than these he will do; because I go to the Father. <sup class="vn">13</sup>Whatever you ask in My name, that will I do, so that the Father may be glorified in the Son. <sup class="vn">14</sup>If you ask Me anything in My name, I will do it.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">1</sup>“Let not your hearts be troubled. Believe in God; believe also in me. <sup class="vn">2</sup>In my Father’s house are many rooms. If it were not so, would I have told you that I go to prepare a place for you? <sup class="vn">3</sup>And if I go and prepare a place for you, I will come again and will take you to myself, that where I am you may be also. <sup class="vn">4</sup>And you know the way to where I am going.” <sup class="vn">5</sup>Thomas said to him, “Lord, we do not know where you are going. How can we know the way?” <sup class="vn">6</sup>Jesus said to him, “I am the way, and the truth, and the life. No one comes to the Father except through me. <sup class="vn">7</sup>If you had known me, you would have known my Father also. From now on you do know him and have seen him.” <sup class="vn">8</sup>Philip said to him, “Lord, show us the Father, and it is enough for us.” <sup class="vn">9</sup>Jesus said to him, “Have I been with you so long, and you still do not know me, Philip? Whoever has seen me has seen the Father. How can you say, ‘Show us the Father’? <sup class="vn">10</sup>Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak on my own authority, but the Father who dwells in me does his works. <sup class="vn">11</sup>Believe me that I am in the Father and the Father is in me, or else believe on account of the works themselves. <sup class="vn">12</sup>Truly, truly, I say to you, whoever believes in me will also do the works that I do; and greater works than these will he do, because I am going to the Father. <sup class="vn">13</sup>Whatever you ask in my name, this I will do, that the Father may be glorified in the Son. <sup class="vn">14</sup>If you ask me anything in my name, I will do it.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the night before the cross, opening the Upper Room discourse",blocks:[
      {type:"p",html:'This opens the Upper Room Discourse (John 13–17), spoken the same night as the Last Supper, right after Jesus has washed His disciples’ feet, Judas has gone out into the night (13:30), and Jesus has just told Peter — who moments ago swore he would lay down his life for Him — that he will deny Him three times before the rooster crows (13:36–38). The command not to be troubled follows directly on real, founded reasons for trouble.'},
      {type:"p",html:'Jesus’ remedy is not a technique for managing anxiety but Himself: belief in Him placed alongside — not beneath — the belief in God the disciples already hold. This paragraph runs as its own unit through v.14 before Jesus turns, at v.15, to the coming Helper and His own peace (John 14:15–31, a following study).'},
      {type:"callout",style:"oneline",label:"In one line",html:"Because the disciples have just heard unsettling news — a coming departure, a coming denial — Jesus roots their trust in exactly who He is: the way to the Father, the truth about the Father, and the life the Father gives."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"eight beats: the command, the promise, Thomas’s question, Philip’s request, mutual indwelling, greater works, asking in His name",blocks:[
      {type:"p",html:'<strong>Beat 1 — the command and its ground (v.1).</strong> Do not let your heart be troubled; believe in God, believe also in Me — trust in Jesus placed on the same footing as trust in God, not a separate, harder step.'},
      {type:"p",html:'<strong>Beat 2 — the Father’s house and the promise of return (vv.2–3).</strong> Many dwelling places, a place being prepared, and an explicit promise stated twice: I will come again and receive you to Myself.'},
      {type:"p",html:'<strong>Beat 3 — Thomas’s honest confusion (vv.4–6).</strong> Jesus says they know the way; Thomas objects that they do not even know the destination. Jesus answers not with clearer directions but with an identity claim: I am the way, and the truth, and the life.'},
      {type:"p",html:'<strong>Beat 4 — seeing the Father already (v.7).</strong> To know Jesus, from now on, is already to know and have seen the Father.'},
      {type:"p",html:'<strong>Beat 5 — Philip’s request and a gentle rebuke (vv.8–9).</strong> Show us the Father, and it is enough; Jesus answers that after all this time with them, to have seen Him is to have seen the Father.'},
      {type:"p",html:'<strong>Beat 6 — mutual indwelling as the ground of the works (vv.10–11).</strong> I am in the Father and the Father in Me; the words and works are the Father’s own, done through Him — believe it directly, or believe it because of the works themselves.'},
      {type:"p",html:'<strong>Beat 7 — greater works, and the reason (v.12).</strong> Whoever believes will do the works Jesus does, and greater, because He is going to the Father (see the caution in §4).'},
      {type:"p",html:'<strong>Beat 8 — asking in His name (vv.13–14).</strong> The same promise, stated twice for emphasis, aimed at one purpose: that the Father may be glorified in the Son.'},
      {type:"callout",style:"oneline",label:"In one line",html:"troubled hearts, met with trust in Him → a real place prepared, and a real return promised → I am Myself the way, not just its map → to know Me is already to know and have seen the Father → mutual indwelling grounds both the works and the asking, all aimed at the Father’s glory."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"do not let your heart be troubled — mē tarassesthō hymōn hē kardia",parse:"present passive/middle imperative, 3rd singular, of tarassō, “to stir up, agitate, trouble” (v.1)",html:'The identical command Jesus gives here, He gives again almost verbatim in v.27 — but it is also the very verb used of Jesus’ own inner turmoil: “troubled in spirit” at Lazarus’s tomb (11:33), “My soul is troubled” facing His own coming death (12:27), and “troubled in spirit” foretelling His betrayal (13:21). He asks nothing of His disciples that He has not already carried Himself.'},
      {type:"word",term:"dwelling places — monai",parse:"nominative feminine plural of monē, “an abiding, a dwelling place,” from menō, “to remain, abide” (v.2)",html:'Older translations’ “mansions” overstates it — the word is closer to “rooms” or “abiding-places” (so NASB1995 and ESV both), rooted in the everyday verb “to remain.” The same word resurfaces, singular, in 14:23: Father and Son making Their own <em>monē</em> with the one who loves Jesus — the place prepared in the Father’s house and the home made within the believer are named with the same Greek word.'},
      {type:"word",term:"I am the way, and the truth, and the life — egō eimi hē hodos kai hē alētheia kai hē zōē",parse:"each noun marked with its own definite article (v.6)",html:'Three articular predicates, not a vague list — <em>the</em> way, <em>the</em> truth, <em>the</em> life, each definite. The claim is exclusive, not merely descriptive: “no one comes to the Father but through Me” — echoed in John 1:4; 11:25; 1 John 5:20 (life), and in Romans 5:2; Ephesians 2:18; Hebrews 10:20 (access to the Father through Him).'},
      {type:"word",term:"greater works — meizona erga",parse:"accusative neuter plural, comparative adjective meizona modifying erga, “works” (v.12)",html:'The believer’s works, done because Jesus goes to the Father — but what makes them “greater” is genuinely debated (see caution below).'},
      {type:"callout",style:"caution",label:"Caution — a debated phrase",html:'Commentators do not agree on exactly what “greater works” (v.12) means. Standard evangelical commentary (such as D. A. Carson and Leon Morris on John) generally reads it as greater in <em>scope</em> — the worldwide reach of gospel proclamation and its fruit after Pentecost, enabled by the Spirit and the finished work of the cross — not greater in raw miraculous power. The text itself does not fully specify; this study presents that reading as the majority view, not a settled certainty.'},
      {type:"word",term:"ask in My name — aiteō en tō onomati mou",parse:"the promise is stated twice, vv.13–14, with the second adding “anything”",html:'Not a blank-check formula but a bounded promise, framed by its stated purpose — “so that the Father may be glorified in the Son” — and elsewhere qualified by asking according to His will (1 John 5:14) and right motive (James 4:3).'},
      {type:"callout",style:"oneline",label:"In one line",html:"a command not to be troubled, from One who was Himself troubled → dwelling places that echo forward to a home made within you → I am, definitely, the way, the truth, the life → greater works, in a scope genuinely debated → and a promise to ask in His name, aimed at the Father’s glory."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Jesus did not know modern neuroscience, and this study claims no such thing. But notice the shape of what He does: the command not to be troubled is never left bare. It is immediately paired with something specific to do — believe in God, believe also in Me — a redirection toward concrete trust, not just a demand to suppress a feeling.'},
      {type:"p",html:'The same command brackets the whole night: it opens this section (v.1) and closes the next (v.27), an inclusio repeating the identical Greek phrase. Not a single reassurance offered once, but a truth returned to across the whole discourse.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Isaiah 26:3 — “You will keep him in perfect peace whose mind is stayed on You, because he trusts in You” — the same pattern: peace anchored in the direction attention is deliberately turned, sustained by trust, not manufactured by will."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>“Do not be troubled” is paired with an action, not a demand to just stop feeling.</strong> Believe in God, believe also in Me — a specific redirection to return to, not a bare command to suppress emotion.'},
      {type:"p",html:'<strong>A concrete, spatial image, not an abstract theological claim.</strong> A house, with rooms, being prepared — something to picture, not just a doctrine to affirm.'},
      {type:"p",html:'<strong>The plan is already made.</strong> “I go to prepare a place for you” — executive-function relief: you are not responsible for figuring out where this goes; it is already being handled.'},
      {type:"p",html:'<strong>Honest confusion is met with patience, not correction for missing the point.</strong> Thomas bluntly says they do not even know the destination — and Jesus answers by giving Himself, not by scolding the question.'},
      {type:"p",html:'<strong>The promise is repeated, not left to one uncertain mention.</strong> Ask in My name, stated twice (vv.13–14) — something concrete and reliable to hold onto, rather than a single fragile assurance.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Notice one moment your heart is troubled today,</strong> and instead of only trying to calm it, name one specific thing to trust Jesus about — pairing the feeling with a concrete redirection, as v.1 models.",
        "<strong>Picture the “many dwelling places” concretely today.</strong> Let it be a real image you return to, not an abstract hope.",
        "<strong>Bring one specific request to Jesus today “in His name,”</strong> trusting the promise repeated in vv.13–14."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Lord Jesus, my heart is troubled more often than I let on. Teach me to believe in You the way I already believe in the Father — not a separate, harder step, but the same trust extended to You. Thank You for going to prepare an actual place for me, and for the promise that You will come again. When I do not understand where You are leading, meet my honest confusion the way You met Thomas’s — not with rebuke, but with Yourself: the way, the truth, and the life. Amen.'}
    ]}
  ],
  oneThing:"Your heart need not be troubled, because Jesus Himself — not a technique — is the way, the truth, and the life, one with the Father.",
  sources:"Translations: NASB 1995, ESV. Greek text: John 14:1–14 (NA/UBS). Key words: mē tarassesthō (present passive/middle imperative of tarassō, v.1; the same verb describes Jesus’ own troubled spirit in John 11:33; 12:27; 13:21), monai (nominative plural of monē, from menō, v.2; the same word recurs, singular, as monēn in 14:23), hē hodos kai hē alētheia kai hē zōē (each articular, v.6), meizona erga (v.12), aiteō en tō onomati mou (vv.13–14). Cross-references: John 11:33; 12:27; 13:21, 30, 33, 36–38; 14:18, 23, 27–28; 12:26; 10:9; Romans 5:2; Ephesians 2:18; Hebrews 10:20; John 1:4, 14, 43; 11:25; 12:45; Colossians 1:15; Hebrews 1:3; 1 John 5:20; John 5:19, 36; 7:33; Matthew 7:7; John 13:31; 15:16; 16:23–24; 1 John 5:14. Debated point flagged, not resolved: what “greater works” (v.12) means — standard commentary (e.g. Carson, Morris) generally reads it as greater in scope (worldwide gospel proclamation and its fruit after Pentecost) rather than greater in miraculous power, though the text itself does not fully specify; presented here as the majority view, not settled certainty."
},
{
  id:"john14-15-31",
  reference:"John 14:15–31",
  title:"John 14:15–31",
  subtitle:"The Father will send another Helper, the Spirit of truth, to be with you forever — and Christ’s own peace, not as the world gives, He leaves with you.",
  translations:["NASB 1995","ESV"],
  purpose:["Formation","AuDHD","Greek"],
  themes:["Life in the Spirit","Assurance & Security","Union with Christ"],
  anchor:"Because you love Jesus and keep His word, the Father will send another Helper to be with you forever, and Father and Son will make Their home in you — so the peace Christ leaves is not the world’s fragile peace but His own, freeing your heart from trouble and fear.",
  sections:[
    {n:"1",id:"text",title:"The Text",blocks:[
      {type:"scripture",ver:"NASB 1995",html:'<sup class="vn">15</sup>“If you love Me, you will keep My commandments. <sup class="vn">16</sup>I will ask the Father, and He will give you another Helper, that He may be with you forever; <sup class="vn">17</sup>that is the Spirit of truth, whom the world cannot receive, because it does not see Him or know Him, but you know Him because He abides with you and will be in you. <sup class="vn">18</sup>I will not leave you as orphans; I will come to you. <sup class="vn">19</sup>After a little while the world will no longer see Me, but you will see Me; because I live, you will live also. <sup class="vn">20</sup>In that day you will know that I am in My Father, and you in Me, and I in you. <sup class="vn">21</sup>He who has My commandments and keeps them is the one who loves Me; and he who loves Me will be loved by My Father, and I will love him and will disclose Myself to him.” <sup class="vn">22</sup>Judas (not Iscariot) said to Him, “Lord, what then has happened that You are going to disclose Yourself to us and not to the world?” <sup class="vn">23</sup>Jesus answered and said to him, “If anyone loves Me, he will keep My word; and My Father will love him, and We will come to him and make Our abode with him. <sup class="vn">24</sup>He who does not love Me does not keep My words; and the word which you hear is not Mine, but the Father’s who sent Me. <sup class="vn">25</sup>These things I have spoken to you while abiding with you. <sup class="vn">26</sup>But the Helper, the Holy Spirit, whom the Father will send in My name, He will teach you all things, and bring to your remembrance all that I said to you. <sup class="vn">27</sup>Peace I leave with you; My peace I give to you; not as the world gives do I give to you. Do not let your heart be troubled, nor let it be fearful. <sup class="vn">28</sup>You heard that I said to you, ‘I go away, and I will come to you.’ If you loved Me, you would have rejoiced because I go to the Father, for the Father is greater than I. <sup class="vn">29</sup>Now I have told you before it happens, so that when it happens, you may believe. <sup class="vn">30</sup>I will not speak much more with you, for the ruler of the world is coming, and he has nothing in Me; <sup class="vn">31</sup>but so that the world may know that I love the Father, I do exactly as the Father commanded Me. Get up, let us go from here.'},
      {type:"scripture",ver:"ESV",html:'<sup class="vn">15</sup>“If you love me, you will keep my commandments. <sup class="vn">16</sup>And I will ask the Father, and he will give you another Helper, to be with you forever, <sup class="vn">17</sup>even the Spirit of truth, whom the world cannot receive, because it neither sees him nor knows him. You know him, for he dwells with you and will be in you. <sup class="vn">18</sup>I will not leave you as orphans; I will come to you. <sup class="vn">19</sup>Yet a little while and the world will see me no more, but you will see me. Because I live, you also will live. <sup class="vn">20</sup>In that day you will know that I am in my Father, and you in me, and I in you. <sup class="vn">21</sup>Whoever has my commandments and keeps them, he it is who loves me. And he who loves me will be loved by my Father, and I will love him and manifest myself to him.” <sup class="vn">22</sup>Judas (not Iscariot) said to him, “Lord, how is it that you will manifest yourself to us, and not to the world?” <sup class="vn">23</sup>Jesus answered him, “If anyone loves me, he will keep my word, and my Father will love him, and we will come to him and make our home with him. <sup class="vn">24</sup>Whoever does not love me does not keep my words. And the word that you hear is not mine but the Father’s who sent me. <sup class="vn">25</sup>These things I have spoken to you while I am still with you. <sup class="vn">26</sup>But the Helper, the Holy Spirit, whom the Father will send in my name, he will teach you all things and bring to your remembrance all that I have said to you. <sup class="vn">27</sup>Peace I leave with you; my peace I give to you. Not as the world gives do I give to you. Let not your hearts be troubled, neither let them be afraid. <sup class="vn">28</sup>You heard me say to you, ‘I am going away, and I will come to you.’ If you loved me, you would have rejoiced, because I am going to the Father, for the Father is greater than I. <sup class="vn">29</sup>And now I have told you before it takes place, so that when it does take place you may believe. <sup class="vn">30</sup>I will no longer talk much with you, for the ruler of this world is coming. He has no claim on me, <sup class="vn">31</sup>but I do as the Father has commanded me, so that the world may know that I love the Father. Rise, let us go from here.'}
    ]},
    {n:"2",id:"context",title:"Where This Sits",sub:"the second half of the discourse’s opening night — from love, to the Spirit, to peace",blocks:[
      {type:"p",html:'This continues directly from 14:1–14 (see that study) within the same unbroken scene, the night before the crucifixion. Having assured the disciples of His return and told them plainly who He is — the way to the Father — Jesus now turns to what will sustain them once He is gone: the Helper He will send, and the peace He will leave.'},
      {type:"p",html:'The unit closes not just this paragraph but the whole scene begun at 13:1. Verse 31’s “Get up, let us go from here” is the natural hinge into chapter 15’s vine discourse — most likely spoken while already moving toward Gethsemane.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Having told them who He is (14:1–14), Jesus now tells them who is coming — the Spirit — and what He leaves behind — a peace unlike the world’s."}
    ]},
    {n:"3",id:"flow",title:"The Movement of Thought",sub:"nine beats: love and keeping, the Helper given, no orphans, shared life, private disclosure, teaching and reminding, peace, the reason for going",blocks:[
      {type:"p",html:'<strong>Beat 1 — love proven by keeping (v.15).</strong> Love for Jesus expressed concretely: “you will keep My commandments” — stated as the natural outcome of love, not a bar to clear first.'},
      {type:"p",html:'<strong>Beat 2 — the Father sends another Helper (vv.16–17).</strong> Jesus will ask, the Father will give — another Helper of Jesus’ own kind, the Spirit of truth, unrecognized by the world but already known to the disciples, soon to be in them.'},
      {type:"p",html:'<strong>Beat 3 — not orphaned (v.18).</strong> A tender reassurance placed right after describing His departure: I will come to you.'},
      {type:"p",html:'<strong>Beat 4 — shared life and mutual indwelling (vv.19–20).</strong> A little while, and the world will no longer see Him, but the disciples will; because He lives, they will live; the mutual indwelling of vv.10–11 extended now to include them — Jesus in the Father, they in Him, He in them.'},
      {type:"p",html:'<strong>Beat 5 — love, keeping, and disclosure (v.21).</strong> Whoever keeps His commandments loves Him, and will be loved by the Father and shown Jesus Himself.'},
      {type:"p",html:'<strong>Beat 6 — Judas’s question, and the private answer (vv.22–24).</strong> Judas (not Iscariot) asks why the disclosure is not public; Jesus repeats the love–keep–Father’s love pattern, adding that Father and Son will come and make Their home with the one who loves Him — a personal indwelling, not a worldwide spectacle.'},
      {type:"p",html:'<strong>Beat 7 — the Spirit’s specific ministry (vv.25–26).</strong> Spoken now, while still with them: the coming Helper will teach all things and bring to remembrance everything Jesus has already said.'},
      {type:"p",html:'<strong>Beat 8 — peace, unlike the world’s (v.27).</strong> A bookend, repeating v.1’s command almost word for word, now grounded in the specific gift of Christ’s own peace.'},
      {type:"p",html:'<strong>Beat 9 — the reason for going, and what is coming (vv.28–31).</strong> If they loved Him they would rejoice that He goes to the Father, who is greater; told in advance so that when it happens they will believe; the ruler of this world is coming but has no claim on Jesus — His obedience to the Father, in full view of the world, is the reason for it all. Then: “Get up, let us go from here.”'},
      {type:"callout",style:"oneline",label:"In one line",html:"loving Jesus shown in keeping His word → another Helper given by the Father → no orphans, He returns → shared life and mutual indwelling → a private disclosure to those who love Him → the Spirit’s specific work: teaching and reminding → Christ’s own peace, unlike the world’s → and a willing walk toward what is coming next."}
    ]},
    {n:"4",id:"words",title:"Words That Carry Weight",sub:"with parsing",blocks:[
      {type:"word",term:"you will keep — tērēsete",parse:"future active indicative, 2nd plural, of tēreō, “to guard, keep, watch over” (v.15; repeated in vv.21, 23)",html:'A future indicative — “you will keep” — not a command issued as a precondition. Keeping is described as the natural, promised outworking of loving Jesus, stated three times across this paragraph with slight variation each time (vv.15, 21, 23), not one bar to clear.'},
      {type:"callout",style:"caution",label:"Caution — a minor textual note",html:'A small number of manuscripts read the aorist imperative <em>tērēsate</em> (“keep!”) at v.15 rather than the future indicative <em>tērēsete</em> (“you will keep”) followed by NASB1995, ESV, and the standard critical text. The variant is minor and does not affect the passage’s sense either way — keeping is tied to loving Jesus, not the reverse — but is worth naming honestly rather than passing over.'},
      {type:"word",term:"another Helper — allon paraklēton",parse:"accusative singular; allos, “another of the same kind”; paraklētos, “one called alongside to help” (v.16; repeated as ho paraklētos, v.26)",html:'The NASB1995 margin itself glosses <em>paraklētos</em> as “one called alongside to help; or Comforter, Advocate, Intercessor.” The same word is used of Jesus Himself in 1 John 2:1 — “we have an Advocate [<em>paraklēton</em>] with the Father” — meaning the Spirit continues Jesus’ own kind of presence and advocacy among the disciples, not a lesser substitute for it. (Some grammarians caution against pressing the allos/heteros “same kind” distinction as an ironclad rule in Koine usage generally, but the point stands here regardless, given the 1 John 2:1 echo.)'},
      {type:"word",term:"orphans — orphanous",parse:"accusative masculine plural of orphanos, “bereaved, fatherless” (v.18)",html:'A vivid, personal image — Jesus’ departure will not leave the disciples abandoned or without an advocate. The promise “I will come to you” answers the fear directly, not abstractly.'},
      {type:"word",term:"make our home — monēn poiēsometha",parse:"monēn, accusative singular of monē (same root as monai in 14:2); poiēsometha, future middle indicative of poieō, “we will make” (v.23)",html:'The identical word for the “dwelling places” Jesus is preparing in the Father’s house (14:2) reappears here, singular: Father and Son making Their own <em>monē</em> within the one who loves Jesus and keeps His word. A real, documented echo within the same chapter — the place prepared and the home made are named with the same Greek word.'},
      {type:"word",term:"peace — eirēnē",parse:"accusative singular (v.27)",html:'Carries the weight of Hebrew <em>shalom</em> — not merely absence of conflict but wholeness under God’s favor. Jesus explicitly contrasts it with the world’s peace, then repeats, almost verbatim, the command of v.1: “do not let your heart be troubled” — the same phrase bookending the whole discourse night.'},
      {type:"callout",style:"oneline",label:"In one line",html:"keeping as love’s natural fruit, not its precondition → another Helper of Jesus’ own kind → no orphans left behind → the same word for “dwelling place” now naming a home made within you → and Christ’s own peace, bookending the night’s opening command."}
    ]},
    {n:"5",id:"neuro",title:"The Neuroplasticity Bridge",blocks:[
      {type:"p",html:'Jesus did not know modern neuroscience, and this study claims no such thing. But notice the Spirit’s specific, named work in v.26: not only teaching, but bringing to remembrance what Jesus has already said — a real mechanism of return and recall, not a vague future comfort.'},
      {type:"p",html:'This mirrors the older pattern of Deuteronomy 6:6–9 — God’s words repeated “when you sit… when you walk… when you lie down” — deliberate, repeated remembrance as the shape formation takes, now carried out by the Spirit’s own ministry rather than by human repetition alone.'},
      {type:"callout",style:"oneline",label:"In one line",html:"Tie this to Deuteronomy 6:6–9 — repeated, deliberate remembrance as the mechanism of a formed life — now continued by the Spirit’s promised work of teaching and reminding."}
    ]},
    {n:"6",id:"audhd",title:"AuDHD Reframe",blocks:[
      {type:"p",html:'<strong>“Not as orphans” answers abandonment fear directly.</strong> Not a vague reassurance but a named fear, met with a specific promise: I will come to you.'},
      {type:"p",html:'<strong>Reminding is named as the Spirit’s job, not a personal failure.</strong> “Bring to your remembrance” (v.26) makes external memory support a divine work — permission to need reminders, rather than a mark of not trying hard enough.'},
      {type:"p",html:'<strong>Peace is given, not performed.</strong> “Not as the world gives” (v.27) — relief from having to manufacture calm; the peace is received, not achieved by getting your feelings in the right order first.'},
      {type:"p",html:'<strong>The same expectation, restated gently three times.</strong> Love shown in keeping His word is said in vv.15, 21, and 23, each time slightly differently — not one impossible bar, but the same simple thing returned to.'},
      {type:"p",html:'<strong>A personal, particular disclosure — not one case among many.</strong> Judas’s question and Jesus’ specific answer (vv.21–23) confirm this is not generic; it is a real, particular relationship, not anonymous inclusion in a crowd.'}
    ]},
    {n:"7",id:"formation",title:"Formation",sub:"making it concrete",blocks:[
      {type:"p",html:'Pick <strong>one</strong>, not all — choosing one and doing it beats admiring the whole list.'},
      {type:"list",style:"pick",items:[
        "<strong>Name one place you feel “orphaned” or unsteadied today,</strong> and rest specifically in v.18’s promise: I will not leave you as orphans.",
        "<strong>Ask the Spirit today to bring one specific thing Jesus has said to your remembrance,</strong> rather than searching for something entirely new.",
        "<strong>Receive Christ’s peace as a gift today, rather than trying to produce calm yourself</strong> — say v.27 over one anxious moment."
      ]}
    ]},
    {n:"8",id:"prayer",title:"Response / Prayer",blocks:[
      {type:"prayer",html:'Father, thank You for not leaving me as an orphan. Thank You for the Helper who teaches me and reminds me of what Jesus has already said, so I do not have to hold everything perfectly in my own memory. Give me Christ’s own peace today — not the fragile kind the world offers, but the kind that does not depend on my circumstances lining up. When my heart wants to be troubled or afraid, let this peace be the answer I return to. Amen.'}
    ]}

/* ================= RENDER ENGINE ================= */
const $=s=>document.querySelector(s);

/* Canonical Bible book order, for library sorting/grouping. */
const BOOK_ORDER=["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];

/* Controlled vocabulary of themes. Every study is tagged with 2–4 of these in its
   `themes` array (see STUDY-FORMAT-SPEC.md §5). Keep this list and each study's tags
   in sync — add a new theme here before using it on a study. */
const THEMES=["Assurance & Security","Crucified with Christ","Discipleship & Following Jesus","Freedom from Sin","Identity in Christ","Life in the Spirit","Purpose & Mission","Renewal of the Mind","Resurrection Hope","Sanctification & Holiness","Suffering & Endurance","Union with Christ","Worship & Consecration"];

/* Parses a "reference" string like "Romans 6:6" or "1 Corinthians 6:17" or "Romans 12:1–2"
   into {book, bookIdx, chapter, verse} for sorting. Unknown books sort last. */
function parseRef(ref){
  const m=(ref||"").match(/^(.*?)\s+(\d+):(\d+)/);
  if(!m) return {book:ref||"",bookIdx:999,chapter:0,verse:0};
  const book=m[1].trim();
  let bookIdx=BOOK_ORDER.indexOf(book);
  if(bookIdx===-1)bookIdx=999;
  return {book,bookIdx,chapter:parseInt(m[2],10),verse:parseInt(m[3],10)};
}

/* Returns STUDIES sorted into canonical Bible order and grouped by book:
   [{label:"Romans",items:[study,study,...]}, ...] */
function sortedGroupedStudies(){
  const withRef=STUDIES.map(s=>({s,p:parseRef(s.reference)}));
  withRef.sort((a,b)=>a.p.bookIdx-b.p.bookIdx||a.p.chapter-b.p.chapter||a.p.verse-b.p.verse);
  const groups=[];
  withRef.forEach(({s,p})=>{
    let grp=groups[groups.length-1];
    if(!grp||grp.label!==p.book){grp={label:p.book,items:[]};groups.push(grp);}
    grp.items.push(s);
  });
  return groups;
}

/* The themes "database": groups studies by theme (alphabetical by theme name), each
   study listed under every theme it is tagged with, sorted by canonical book/chapter/
   verse within each theme group: [{label:"Union with Christ",items:[study,...]}, ...] */
function sortedGroupedByTheme(){
  const byTheme={};
  STUDIES.forEach(s=>{
    (s.themes||[]).forEach(t=>{
      if(!byTheme[t])byTheme[t]=[];
      byTheme[t].push(s);
    });
  });
  return Object.keys(byTheme).sort((a,b)=>a.localeCompare(b)).map(theme=>{
    const items=byTheme[theme].slice().sort((a,b)=>{
      const pa=parseRef(a.reference), pb=parseRef(b.reference);
      return pa.bookIdx-pb.bookIdx||pa.chapter-pb.chapter||pa.verse-pb.verse;
    });
    return {label:theme,items};
  });
}

let libView=load("libView","book");
function setLibView(v){
  libView=v; store("libView",v);
  renderLibrary();
}

function renderLibrary(){
  const g=$("#grid"); g.innerHTML="";
  $("#vtBook").classList.toggle("on",libView==="book");
  $("#vtTheme").classList.toggle("on",libView==="theme");
  const groups=libView==="theme"?sortedGroupedByTheme():sortedGroupedStudies();
  groups.forEach(grp=>{
    const h=document.createElement("div"); h.className="group-header";
    h.innerHTML=`<span>${grp.label}</span>`;
    g.appendChild(h);
    grp.items.forEach(s=>{
      const c=document.createElement("div"); c.className="card"; c.onclick=()=>openStudy(s.id);
      c.innerHTML=`<div class="ref">${s.reference}</div>
        <div class="subtitle">${s.subtitle||""}</div>`;
      g.appendChild(c);
    });
  });
  const queue=getQueue();
  if(queue.length){
    const qh=document.createElement("div"); qh.className="group-header";
    qh.innerHTML="<span>Queued — not yet studied</span>";
    g.appendChild(qh);
    queue.forEach((q,i)=>{
      const c=document.createElement("div"); c.className="card card-queued";
      const refDiv=document.createElement("div"); refDiv.className="ref"; refDiv.textContent=q;
      const subDiv=document.createElement("div"); subDiv.className="subtitle"; subDiv.textContent="Waiting to be studied";
      const rm=document.createElement("button"); rm.className="queue-remove"; rm.title="Remove from queue"; rm.type="button"; rm.textContent="×";
      rm.onclick=(ev)=>{ev.stopPropagation();removeFromQueue(i);};
      c.appendChild(refDiv); c.appendChild(subDiv); c.appendChild(rm);
      g.appendChild(c);
    });
  }
  const e=document.createElement("div"); e.className="card card-empty card-add";
  e.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px;width:100%">
    <div class="add-label">+ Request a study</div>
    <input type="text" id="queueInput" class="queue-input" placeholder="e.g. James 1:2–8" autocomplete="off">
    <button type="button" class="vt-btn queue-submit" onclick="submitQueueInput()">Add to queue</button>
  </div>`;
  g.appendChild(e);
  const qi=$("#queueInput");
  if(qi)qi.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();submitQueueInput();}});
}
function getQueue(){try{return JSON.parse(load("studyQueue","[]"))}catch(err){return []}}
function setQueue(q){store("studyQueue",JSON.stringify(q))}
function submitQueueInput(){
  const inp=$("#queueInput"); if(!inp)return;
  const v=inp.value.trim();
  if(!v)return;
  const q=getQueue();
  q.push(v);
  setQueue(q);
  renderLibrary();
}
function removeFromQueue(i){
  const q=getQueue();
  q.splice(i,1);
  setQueue(q);
  renderLibrary();
}
function blockHTML(b){
  switch(b.type){
    case"p":return `<p>${b.html}</p>`;
    case"scripture":return `<div class="scripture"><span class="ver">${b.ver}</span>${b.html}</div>`;
    case"word":return `<div class="word"><div class="term">${b.term}</div><div class="parse">${b.parse}</div><div>${b.html}</div></div>`;
    case"callout":return `<div class="callout ${b.style||""}">${b.label?`<div class="clbl">${b.label}</div>`:""}<div>${b.html}</div></div>`;
    case"list":return `<ul class="${b.style==='pick'?'pick':'plain'}">${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
    case"heading":return `<h3>${b.text}</h3>`;
    case"prayer":return `<div class="prayer">${b.html}</div>`;
    default:return"";
  }
}
function openStudy(id){
  const s=STUDIES.find(x=>x.id===id); if(!s)return;
  $("#library").style.display="none";
  $("#reader").classList.add("active");
  window.scrollTo(0,0);
  // nav
  const nav=$("#arcNav");
  nav.innerHTML=`<button class="back" onclick="showLibrary()">← Library</button>`+
    `<a href="#anchor" class="on">Anchor</a>`+
    s.sections.map(sec=>`<a href="#sec-${sec.id}">${sec.n}. ${sec.title}</a>`).join("")+
    `<a href="#onething">One Thing</a>`;
  // article
  const art=$("#article");
  let html=`<h1 class="title">${s.title}</h1>
    <p class="meta">${s.translations.join(" · ")}</p>
    <div class="anchor" id="anchor"><div class="lbl">⚓ The Anchor — read first, return often</div><p>${s.anchor}</p></div>`;
  s.sections.forEach(sec=>{
    html+=`<section class="blk" id="sec-${sec.id}"><h2><span class="num">${sec.n}</span><span>${sec.title}${sec.sub?`<span class="sub">${sec.sub}</span>`:""}</span></h2>`;
    sec.blocks.forEach(b=>html+=blockHTML(b));
    html+=`</section>`;
  });
  html+=`<div class="onething" id="onething"><div class="lbl">One thing to carry today</div>${s.oneThing}</div>`;
  html+=`<div class="sources">${s.sources}</div>`;
  art.innerHTML=html;
  setupScrollSpy(s);
  location.hash="";
}
function showLibrary(){
  $("#reader").classList.remove("active");
  $("#library").style.display="block";
  window.scrollTo(0,0);
}
let spyHandler=null;
function setupScrollSpy(s){
  const ids=["anchor",...s.sections.map(x=>"sec-"+x.id),"onething"];
  const links=[...document.querySelectorAll("nav.arc a")];
  if(spyHandler)window.removeEventListener("scroll",spyHandler);
  spyHandler=()=>{
    let cur=ids[0];
    for(const id of ids){const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<200)cur=id;}
    links.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+cur));
  };
  window.addEventListener("scroll",spyHandler);spyHandler();
}
/* ============ CONTROLS ============ */
function store(k,v){try{localStorage.setItem("logos_"+k,v)}catch(e){}}
function load(k,d){try{return localStorage.getItem("logos_"+k)??d}catch(e){return d}}


let fs=+load("fs",17);
function applyFs(){document.documentElement.style.setProperty("--fs",fs+"px");}
function fontStep(d){fs=Math.max(14,Math.min(22,fs+d));applyFs();store("fs",fs);}
function toggleFocus(){const on=document.body.classList.toggle("focus");$("#focusBtn").classList.toggle("active",on);store("focus",on?"1":"0");}
