[build]
  # Copies the canonical app file into a clean publish folder as index.html.
  # logos-study-app.html itself is never renamed or moved — this only affects
  # the deploy output, so the working docs alongside it (STUDY-FORMAT-SPEC.md,
  # HANDOFF notes, prototypes, etc.) are never published to the public site.
  command = "mkdir -p dist && cp logos-study-app.html dist/index.html"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
