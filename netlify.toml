[build]
  # logos-study-app.html into dist/ with the STUDIES literal moved to /assets/studies.<hash>.js (the source file still runs when opened directly), plus generated study pages/sitemap/robots/llms.txt.
  command = "node scripts/build-seo.js"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Hashed asset (/assets/studies.<hash>.js) is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old flat-file study URLs redirect via literal lines in dist/_redirects (not a wildcard here).

[[redirects]]
  from = "/studies"
  to = "/"
  status = 301

# SPA fallback must stay last so Netlify tries real files and earlier rules first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
